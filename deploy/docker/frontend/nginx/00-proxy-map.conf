# ==============================================================================
# 跨层协议透传用的 map —— 必须位于 http {} 上下文
#
# 位置说明：本文件被拷到 /etc/nginx/conf.d/00-proxy-map.conf。
# nginx 官方镜像的 /etc/nginx/nginx.conf 里有：
#     http { ... include /etc/nginx/conf.d/*.conf; }
# 所以放在这个目录就是在 http 上下文里，map / limit_req_zone 这类指令才有位置写。
# （server 块里写 map 会直接报 "map directive is not allowed here"，nginx 起不来。）
#
# 语义：请求经过「浏览器 → 宿主机 nginx(443) → 本容器(8080)」两层反代。
#   · 宿主机已经传了 X-Forwarded-Proto: https → 用它（保住真实协议）；
#   · 没有这个头（容器被直接 127.0.0.1:8080 访问）→ 回落到本次连接的 $scheme。
#
# 为什么非这样不可：容器内直接写 $scheme 永远得到 http，会把上层的 https 覆盖掉，
# Spring 生成的绝对链接与 Location 头都会退回 http://，被浏览器按混合内容拦。
# ==============================================================================
map $http_x_forwarded_proto $lesson_fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

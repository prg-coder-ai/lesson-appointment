# ============================================================
# 文件：/etc/nginx/sites-available/booking-https
# 用途：**有域名**时的正式部署（HTTPS）。与 booking-ip.conf（纯 IP、仅内测）二选一，
#       两者不要同时启用 —— 见文件末尾「与 booking-ip.conf 的关系」。
#
# 本文件与 booking-ip.conf 的关系：
#   · 全部分流 location 与 booking-ip.conf **逐条一致**（check:proxy 会逐项比对，
#     两边任何一侧漏加课堂前缀都会判红）；
#   · 差异只在 server 级别：listen 443 ssl + 证书 + HSTS + 80→443 跳转。
#   · 因此升级/新增课堂端点时，**两个文件必须同步改**，否则本地(dev 代理)与线上之一会 404。
#
# 启用步骤：
#   # ① 先放 zone 定义（limit_req_zone 只能写在 http{} 里，本文件是 server 块，放不进去）
#   sudo cp deploy/nginx/conf.d/00-limit-req-zone.conf /etc/nginx/conf.d/
#
#   # ② 把下面两处占位替换成真实值（全文一共 4 行）：
#   #    your.domain.com  → 你的域名
#   #    证书路径          → certbot 签发的 /etc/letsencrypt/live/<域名>/
#   sudo cp deploy/nginx/booking-https.conf /etc/nginx/sites-available/booking-https
#   sudo sed -i 's/your\.domain\.com/实际域名/g' /etc/nginx/sites-available/booking-https
#
#   # ③ 与 IP 版二选一：先摘掉 IP 站点，再启用本份
#   sudo rm -f /etc/nginx/sites-enabled/booking-ip /etc/nginx/sites-enabled/default
#   sudo ln -sfn /etc/nginx/sites-available/booking-https /etc/nginx/sites-enabled/booking-https
#   sudo nginx -t && sudo systemctl reload nginx
#
#   # ④ 证书续期后要 reload（certbot 的 --deploy-hook 已覆盖；手工续期记得补一次）
#
# ⚠️ 安全组必须放通 443；80 也要保留（ACME 校验 + 跳转）。
# ⚠️ 境内服务器上的域名必须完成 ICP 备案，否则 80/443 会被云厂商拦截。
#
# ★ 2026-11-22 新增：作为 booking.conf（示例域名版）的「可直接落地」版本，
#   与 booking-ip.conf 保持分流一致，避免出现「按文档改了域名，课堂又 404」。
# ============================================================

# ------------------------------------------------------------
# 80：只做三件事 —— ACME 校验、健康探测、301 跳转到 443
# 显式不加 default_server：本份是域名站点，default_server 留给需要 catch-all 的环境；
# 若 nginx -t 报 "a duplicate default server for 0.0.0.0:80"，说明另一个站点抢了，
# 先删掉 /etc/nginx/sites-enabled/ 下多余的站点（多半是没摘干净的 booking-ip 或 default）。
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name your.domain.com;

    # certbot --webroot 会往这里写校验文件，必须原样放行（不能跳转）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------
# 443：真正的站点
# ------------------------------------------------------------
server {
    # nginx 1.24（Ubuntu 22.04 默认）用这条；1.25.1 起 `http2` 从 listen 参数独立出来，
    # 那时可写成 `listen 443 ssl;` + `http2 on;`。**1.24 上写 `http2 on;` 会报 unknown directive**。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your.domain.com;

    # ---- 证书（两处占位）----
    ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;
    # 若用腾讯云/阿里云下发的证书，改成本地文件即可，例如：
    #   ssl_certificate     /etc/nginx/ssl/your.domain.com.pem;
    #   ssl_certificate_key /etc/nginx/ssl/your.domain.com.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;       # TLS1.3 下交给客户端更优
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 40m;            # 通用业务层 40MB；课堂资料若要放开到 100MB，需把 /api/v1/uploads/ 那处再调到 105m

    # ═══════════════════════════════════════════════════════
    # 等保 P0-2：6 大安全响应头（HSTS **只**在 HTTPS 下加，且只加在这一份）
    # ⚠️ HSTS 一旦被浏览器记住（max-age），回退到 HTTP 会打不开 —— 首次上线可先改成
    #    max-age=300 试跑一天，确认无 http 资源后改 31536000。
    # ═══════════════════════════════════════════════════════
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self)" always;

    root /var/www/frontend;
    index login.html;

    # 📥 自签根证书下载（仅公钥可公开；ca.key 只在 /etc/nginx/ssl/selfsigned/，绝不放这里）
    #    客户端导入到「受信任的根证书颁发机构」后，地址栏的「不安全」警告消失。
    #    独立成块而非交给 location /：后者 try_files 兜底 /login.html，ca.crt 没放进来时
    #    浏览器会"下载成功"一个登录页 HTML，看着像证书损坏；这里文件不在就是干净的 404。
    #    default_type 显式给出：mime.types 未被 include 时 .crt 会落成 text/plain，
    #    Chrome 会把证书文本摊在页面里显示而不是下载。
    #    ⚠️ 刻意不写 add_header —— 写了就不再继承 server 级 6 个安全头（要写须整套重发）。
    location = /ca.crt {
        default_type application/x-x509-ca-cert;
    }
    # ══════════════════════════════════════════════════════════════
    # 课堂 App 静态承接（classroom-app/www）—— 2026-11-26
    # ──────────────────────────────────────────────────────────────
    # frontend 侧所有「进入课堂」入口都收敛到 ClassroomLink，产出相对
    # 地址 ./launch.html?scheduleId=…，而 launch.html 只在 classroom-app/www
    # 里，frontend 没有同名页。不接管 → 404；本地代理同理（APP_WWW）。
    #
    # ★ 不能整体把 www 挂成站点：它与 frontend 有 6 个同名页
    #   （classroom / classroom-prep / index / login / student / teacher）。
    #   整站接管会让后台 teacher.html、student.html、登录页全变成 App 版。
    #   这里只接管「课堂侧须用 App 补丁版」+「www 独有」的路径。
    #   刻意排除：index.html / login.html / teacher.html / student.html
    #
    # ★ 回落语义与 dev-proxy 的 existsSync 判定对齐：www 缺文件才回落
    #   frontend。但**不兜 /login.html** —— 兜了会把「App 未部署」伪装成
    #   「未登录」，比 404 难查得多。这里缺失就是干净 404。
    #
    # ★ 本块内不写 add_header：写了会丢掉 server 级安全头（须整套重发）。
    # ══════════════════════════════════════════════════════════════
    location ~ ^/(classroom-prep|my-classroom|classroom|launch|verify|ops)\.html$ {
        root /var/www/classroom-app;
        try_files $uri @fe_static;
    }
    location ~ ^/(app-[a-z-]+\.js|role-router\.js|ops-lite\.js|verify\.js|app\.css)$ {
        root /var/www/classroom-app;
        try_files $uri @fe_static;
    }
    location ^~ /js/classroom/ {
        root /var/www/classroom-app;
        try_files $uri @fe_static;
    }
    location = /css/classroom.css {
        root /var/www/classroom-app;
        try_files $uri @fe_static;
    }
    location @fe_static {
        root /var/www/frontend;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /login.html;
    }

    # ============================================================
    # ↓↓↓ 以下与 booking-ip.conf **逐条一致**，改动请两边同步 ↓↓↓
    # ============================================================

    location /api/v1/sensitive {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    location /api/v1/message {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    location /api/v1/sse {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    location /api/v1/users/ {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    # 🔐 登录/注册专用限流 —— 5 r/s
    location ~* ^/api/v1/(auth/login|auth/refreshToken|auth/logout|auth/wechat-login|auth/wechat-register|auth/wechat/qr|auth/wechat/pc-callback|user/register|promo/register-tenant|promo/register-user|promo/referral/validate)$ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        limit_req zone=login_zone burst=10 nodelay;
        limit_req_status 429;
    }
    # 📖 公开 GET 接口 —— 50 r/s
    location ~* ^/api/v1/(teacher/published|course/public|tenant/public|industry/options|apiInfo|system/info|tenant/name|legal/doc|term/map|interfaces) {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        limit_req zone=public_zone burst=30 nodelay;
        limit_req_status 429;
    }
    # ---- 在线课堂 classroom-service（8092）----
    location /api/v1/classrooms/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }
    location /api/v1/recordings/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # 学生历史出勤（F2-07）：GET /api/v1/attendance/history
    location /api/v1/attendance/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # 讲稿/作品/录制的分片上传（包3B）
    # ⚠️ 课堂单文件上限 100MB 时，这里与 booking-ip.conf 的同一处需**同时**调到 105m，
    #    只改一份会出现「HTTP 能传、HTTPS 413」（或反之）。当前两份都保持 40m 以对齐。
    location /api/v1/uploads/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
        client_max_body_size 40m;
    }
    # 签名文件访问（包3B）：靠 URL 的 exp+sig 鉴权，需支持 Range 206
    location /api/v1/files/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
    }
    # 排期事件接收：POST /api/v1/schedules/events（主服务是单数 /api/v1/schedule，不冲突）
    location /api/v1/schedules/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # RTC 选型诊断（包3A）
    location /api/v1/rtc/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # ---- 课堂运营台（包4）：逐个精确前缀，不可用 /api/v1/admin/ 通配 ----
    location /api/v1/admin/monitor/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/reports/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/reconcile/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/audit/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/contract/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/exports/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location /api/v1/admin/classrooms/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # POST /api/v1/admin/classrooms（创建临时课堂）不带尾斜杠，前缀 location 匹配不到
    # → 会落到 location /api/v1/ 进 8081 → 403（2026-11-19 修）
    location = /api/v1/admin/classrooms {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # 课堂服务回调预约系统的落点（显式写死到 8081）。
    # 前缀刻意与前端课堂路由 /api/v1/classrooms/ 区分，否则回调会被 8092 抢走并 404。
    location /api/v1/classroom-callback/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
    }
    # 课堂 WebSocket：白板/心跳/信令三通道
    # ★ HTTPS 下前端会连 wss://<域名>/ws/classrooms/...（同源），因此本条在 443 上**必须存在**，
    #   少它表现为课堂白板不刷新、心跳断、反复重连，而 HTTP 页面一切正常。
    location /ws/classrooms/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # 课堂 App 安装包上传/下载（系统配置 → 课堂 App 包管理）—— 2026-11-26
    # 绿色 Windows 包约 108MB、业务层上限 400MB；server 级 40m 会在到达应用前先拒绝，
    # 因此这里单独放宽到 450m。关闭请求缓冲，避免 nginx 先把百 MB 包体落盘再转投上游。
    # 用 ^~ 锁死前缀，防止被上面的正则 location 抢走匹配。
    location ^~ /api/v1/app-package/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        client_max_body_size 450m;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    # Actuator：health 匿名放行 + 限流；info/env/beans 由 Spring Security Basic Auth 保护
    location /actuator/ {
        proxy_pass http://127.0.0.1:8081;
        access_log off;
        limit_req zone=public_zone burst=10 nodelay;
        limit_req_status 429;
    }
}

# ============================================================
# 切到 HTTPS 后的回归项（少测一项就会在事后才炸）：
#   1) 登录 → 平台首页正常；
#   2) 进课堂，Network 里 wss://<域名>/ws/classrooms/... 必须是 **101**；
#   3) 上传 >20MB 讲稿成功（client_max_body_size）；
#   4) 消息中心能实时收到（SSE 不被缓冲、不 60s 断）。
# 另：后端要能感知 https（Spring 用 server.forward-headers-strategy=framework），
#     否则重定向/绝对链接会退回 http 被浏览器按混合内容拦掉 ——
#     proxy_params 里的 `X-Forwarded-Proto $scheme` 就是为此，勿删。
# 再另：课堂实例的 ws_host/api_host 保持回环(127.0.0.1)，
#     后端 buildWsUrl 恒输出 ws:// ，只有被判定为回环时前端才会改用同源 wss://——
#     填成域名/公网 IP 反而会在 HTTPS 页面被当混合内容拦掉。
# ============================================================

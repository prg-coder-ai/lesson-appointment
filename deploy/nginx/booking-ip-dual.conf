# ============================================================
# 文件：/etc/nginx/sites-available/booking-ip-dual
# 用途：**没有域名、只有公网 IP**，且要求 **HTTP 与 HTTPS 同时可用**（自签证书）。
#       与 booking-ip.conf（仅 HTTP）、booking-ip-https.conf（仅 HTTPS，80 跳转）
#       三者同一时间**只启用一份**（sites-available 里可全留，只摘 sites-enabled 的链接）。
#
# 为什么需要这一份：只 HTTPS 时 80 会 301 到 https，于是
#   · curl / 监控 / 老客户端走 http 一律 301，脚本要改成 -k https；
#   · 排查 TLS 问题时没有明文通道做对照，分不清"证书问题"还是"应用问题"；
#   · 内网、备案前的过渡期需要一个不依赖证书的入口。
#
# 代价（务必知悉）：
#   · 两个 server 块的 location 清单必须完全一致 —— 本文件由脚本从
#     booking-ip-https.conf 派生，check:proxy 会把五份站点一起比对，漏同一步即判红；
#   · **http 与 https 是不同 origin**（scheme 参与同源判定），localStorage 不共享，
#     用户在 http 登录后切到 https 会显示「未登录」，反之亦然 —— 浏览器行为，不是 bug；
#   · http 段不是安全上下文：课堂的摄像头/麦克风在 http 下被禁用（只有 localhost 例外），
#     表现是"能看白板、麦克风点了没反应"。**课堂音视频必须走 https**；
#   · 明文段的 token 可被中间人截获，仅限内测/内网；正式对外请尽快换域名 + 受信任证书。
#
# 启用步骤：
#   sudo bash deploy/nginx/gen-selfsigned-cert.sh 152.136.254.127      # ① 生成证书（须传公网 IP）
#   sudo cp deploy/nginx/conf.d/00-limit-req-zone.conf /etc/nginx/conf.d/   # ② zone 定义
#   sudo cp deploy/nginx/booking-ip-dual.conf /etc/nginx/sites-available/booking-ip-dual
#   sudo rm -f /etc/nginx/sites-enabled/{booking,booking-ip,booking-https,booking-ip-https,booking-ip-dual,default}   # ③ 只留一份
#   sudo ln -sfn /etc/nginx/sites-available/booking-ip-dual /etc/nginx/sites-enabled/booking-ip-dual
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 安全组同时放通 80 与 443。
# ⚠️ 完整落地清单（含验证、坑位表、回滚、到期动作）：
#    doc-develop/04-部署与运维/纯IP环境HTTPS自签配置清单-20261122-1645.md
#
# ★ 换公网 IP 后必须同时改两处：本文件的两处 server_name、以及重跑证书脚本（SAN 里的 IP）。
# ============================================================

# ------------------------------------------------------------
# 80：HTTP 明文段 —— **完整可用**（不是跳转）
# 与 443 段的 location 逐字相同，唯一差别是没有 TLS。
# ------------------------------------------------------------
server {
    # 本段只监听 80，不涉及 TLS / http2（那些只属于下面的 443 段）。
    listen 80;
    listen [::]:80;
    server_name 152.136.254.127;

    # 80 段不加载证书 —— 证书只属于下面的 443 段（同一文件两个 server 各管一个端口）。

    client_max_body_size 20m;            # 课堂单文件上限 100MB 时，把 /api/v1/uploads/ 那处调到 105m

    # ═══════════════════════════════════════════════════════
    # 等保 P0-2：安全响应头 5 项（HSTS 不在其中 —— 见下）
    # ⛔ 本段（80/HTTP）**禁止**加 HSTS：明文段声明 HSTS 属于配置错误，
    #    且自签证书下开 HSTS 会把站点彻底锁死（连"继续前往"都不给）。
    #    HSTS 只属于 443 段，且仅在换成受信任证书后才启用。
    # ═══════════════════════════════════════════════════════
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self)" always;

    root /var/www/frontend;
    index login.html;

    # 📥 自签根证书下载（仅公钥可公开；ca.key 只在 /etc/nginx/ssl/selfsigned/，绝不放这里）
    #    客户端导入到「受信任的根证书颁发机构」后，地址栏的「不安全」警告消失。
    #    独立成块而非交给 location /：后者 try_files 兜底 /login.html，ca.crt 没放进来时
    #    浏览器会"下载成功"一个登录页 HTML，看着像证书损坏；这里文件不在就是干净的 404。
    #    default_type 显式给出：mime.types 未被 include 时 .crt 会落成 text/plain，
    #    Chrome 会把证书文本摊在页面里显示而不是下载。
    #    ⚠️ 刻意不写 add_header —— 写了就不再继承 server 级 6 个安全头（要写须整套重发）。
    location = /ca.crt {
        default_type application/x-x509-ca-cert;
    }
    # ACME 校验目录（将来加域名时 certbot --webroot 用；纯 IP 当前用不上）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # ══════════════════════════════════════════════════════════════
    # 课堂 App 静态承接（classroom-app/www）—— 2026-11-26
    # ──────────────────────────────────────────────────────────────
    # frontend 侧所有「进入课堂」入口都收敛到 ClassroomLink，产出相对
    # 地址 ./launch.html?scheduleId=…，而 launch.html 只在 classroom-app/www
    # 里，frontend 没有同名页。不接管 → 404；本地代理同理（APP_WWW）。
    #
    # ★ 不能整体把 www 挂成站点：它与 frontend 有 6 个同名页
    #   （classroom / classroom-prep / index / login / student / teacher）。
    #   整站接管会让后台 teacher.html、student.html、登录页全变成 App 版。
    #   这里只接管「课堂侧须用 App 补丁版」+「www 独有」的路径。
    #   刻意排除：index.html / login.html / teacher.html / student.html
    #
    # ★ 回落语义与 dev-proxy 的 existsSync 判定对齐：www 缺文件才回落
    #   frontend。但**不兜 /login.html** —— 兜了会把「App 未部署」伪装成
    #   「未登录」，比 404 难查得多。这里缺失就是干净 404。
    #
    # ★ 本块内不写 add_header：写了会丢掉 server 级安全头（须整套重发）。
    # ══════════════════════════════════════════════════════════════
    location ~ ^/(classroom-prep|my-classroom|classroom|launch|verify|ops)\.html$ {
        root /var/www/classroom-app;
        try_files $uri @fe_static;
    }
    location ~ ^/(app-[a-z-]+\.js|role-router\.js|ops-lite\.js|verify\.js|app\.css)$ {
        root /var/www/classroom-app;
        try_files $uri @fe_static;
    }
    location ^~ /js/classroom/ {
        root /var/www/classroom-app;
        try_files $uri @fe_static;
    }
    location = /css/classroom.css {
        root /var/www/classroom-app;
        try_files $uri @fe_static;
    }
    location @fe_static {
        root /var/www/frontend;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /login.html;
    }

    # ============================================================
    # ↓↓↓ 以下与 booking-ip.conf **逐条一致**，改动请两边同步 ↓↓↓
    # ============================================================

    location /api/v1/sensitive {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    location /api/v1/message {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    location /api/v1/sse {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    location /api/v1/users/ {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    # 🔐 登录/注册专用限流 —— 5 r/s
    location ~* ^/api/v1/(auth/login|auth/refreshToken|auth/logout|auth/wechat-login|auth/wechat-register|auth/wechat/qr|auth/wechat/pc-callback|user/register|promo/register-tenant|promo/register-user|promo/referral/validate)$ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        limit_req zone=login_zone burst=10 nodelay;
        limit_req_status 429;
    }
    # 📖 公开 GET 接口 —— 50 r/s
    location ~* ^/api/v1/(teacher/published|course/public|tenant/public|industry/options|apiInfo|system/info|tenant/name|legal/doc|term/map|interfaces) {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        limit_req zone=public_zone burst=30 nodelay;
        limit_req_status 429;
    }
    # ---- 在线课堂 classroom-service（8092）----
    location /api/v1/classrooms/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }
    location /api/v1/recordings/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # 学生历史出勤（F2-07）：GET /api/v1/attendance/history
    location /api/v1/attendance/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # 讲稿/作品/录制的分片上传（包3B）
    # ⚠️ 课堂单文件上限 100MB 时，这里与 booking-ip.conf 的同一处需**同时**调到 105m，
    #    只改一份会出现「HTTP 能传、HTTPS 413」（或反之）。当前两份都保持 20m 以对齐。
    location /api/v1/uploads/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }
    # 签名文件访问（包3B）：靠 URL 的 exp+sig 鉴权，需支持 Range 206
    location /api/v1/files/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
    }
    # 排期事件接收：POST /api/v1/schedules/events（主服务是单数 /api/v1/schedule，不冲突）
    location /api/v1/schedules/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # RTC 选型诊断（包3A）
    location /api/v1/rtc/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # ---- 课堂运营台（包4）：逐个精确前缀，不可用 /api/v1/admin/ 通配 ----
    location /api/v1/admin/monitor/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/reports/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/reconcile/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/audit/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/contract/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/exports/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location /api/v1/admin/classrooms/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # POST /api/v1/admin/classrooms（创建临时课堂）不带尾斜杠，前缀 location 匹配不到
    # → 会落到 location /api/v1/ 进 8081 → 403（2026-11-19 修）
    location = /api/v1/admin/classrooms {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # 课堂服务回调预约系统的落点（显式写死到 8081）。
    # 前缀刻意与前端课堂路由 /api/v1/classrooms/ 区分，否则回调会被 8092 抢走并 404。
    location /api/v1/classroom-callback/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
    }
    # 课堂 WebSocket：白板/心跳/信令三通道
    # ★ HTTPS 下前端会连 wss://<域名>/ws/classrooms/...（同源），因此本条在 443 上**必须存在**，
    #   少它表现为课堂白板不刷新、心跳断、反复重连，而 HTTP 页面一切正常。
    location /ws/classrooms/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # 课堂 App 安装包上传/下载（系统配置 → 课堂 App 包管理）—— 2026-11-26
    # 绿色 Windows 包约 108MB、业务层上限 150MB；server 级 20m 会在到达应用前先拒绝，
    # 因此这里单独放宽。关闭请求缓冲，避免 nginx 先把百 MB 包体落盘再转投上游。
    # 用 ^~ 锁死前缀，防止被上面的正则 location 抢走匹配。
    location ^~ /api/v1/app-package/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        client_max_body_size 200m;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    # Actuator：health 匿名放行 + 限流；info/env/beans 由 Spring Security Basic Auth 保护
    location /actuator/ {
        proxy_pass http://127.0.0.1:8081;
        access_log off;
        limit_req zone=public_zone burst=10 nodelay;
        limit_req_status 429;
    }
}

# ------------------------------------------------------------
# 443：真正的站点
# ------------------------------------------------------------
server {
    # nginx 1.24（Ubuntu 22.04 默认）用这条；1.25.1 起 `http2` 从 listen 参数独立出来，
    # 那时可写成 `listen 443 ssl;` + `http2 on;`。**1.24 上写 `http2 on;` 会报 unknown directive**。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 152.136.254.127;

    # ---- 证书：自签（由 deploy/nginx/gen-selfsigned-cert.sh 生成）----
    ssl_certificate     /etc/nginx/ssl/selfsigned/server.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned/server.key;
    # 证书的 SAN 里必须含 152.136.254.127，否则浏览器是「连不上」而不是「点继续」
    # （现代浏览器只看 SAN，不看 CN）。用下面这条核验：
    #   openssl x509 -in /etc/nginx/ssl/selfsigned/server.crt -noout -ext subjectAltName

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;       # TLS1.3 下交给客户端更优
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 20m;            # 课堂单文件上限 100MB 时，把 /api/v1/uploads/ 那处调到 105m

    # ═══════════════════════════════════════════════════════
    # 等保 P0-2：6 大安全响应头（HSTS **只**在 HTTPS 下加，且只加在这一份）
    # ⚠️ HSTS 一旦被浏览器记住（max-age），回退到 HTTP 会打不开 —— 首次上线可先改成
    #    max-age=300 试跑一天，确认无 http 资源后改 31536000。
    # ═══════════════════════════════════════════════════════
    # ⛔ 自签证书场景**必须关闭 HSTS**（此处刻意注释掉，勿擅自打开）：
    #    HSTS 一旦被浏览器记住 max-age，后续访问连「继续前往」的警告页都不再显示，
    #    浏览器直接 ERR_CERT_AUTHORITY_INVALID 拒绝，站点在有效期内彻底不可用，
    #    只能去 chrome://net-internals/#hsts → Delete domain security policies 手动清。
    #    等拿到域名 + 受信任证书（Let's Encrypt / 云厂商 DV）再启用，改用 booking-https.conf。
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self)" always;

    root /var/www/frontend;
    index login.html;

    # 📥 自签根证书下载（仅公钥可公开；ca.key 只在 /etc/nginx/ssl/selfsigned/，绝不放这里）
    #    客户端导入到「受信任的根证书颁发机构」后，地址栏的「不安全」警告消失。
    #    独立成块而非交给 location /：后者 try_files 兜底 /login.html，ca.crt 没放进来时
    #    浏览器会"下载成功"一个登录页 HTML，看着像证书损坏；这里文件不在就是干净的 404。
    #    default_type 显式给出：mime.types 未被 include 时 .crt 会落成 text/plain，
    #    Chrome 会把证书文本摊在页面里显示而不是下载。
    #    ⚠️ 刻意不写 add_header —— 写了就不再继承 server 级 6 个安全头（要写须整套重发）。
    location = /ca.crt {
        default_type application/x-x509-ca-cert;
    }
    # ══════════════════════════════════════════════════════════════
    # 课堂 App 静态承接（classroom-app/www）—— 2026-11-26
    # ──────────────────────────────────────────────────────────────
    # frontend 侧所有「进入课堂」入口都收敛到 ClassroomLink，产出相对
    # 地址 ./launch.html?scheduleId=…，而 launch.html 只在 classroom-app/www
    # 里，frontend 没有同名页。不接管 → 404；本地代理同理（APP_WWW）。
    #
    # ★ 不能整体把 www 挂成站点：它与 frontend 有 6 个同名页
    #   （classroom / classroom-prep / index / login / student / teacher）。
    #   整站接管会让后台 teacher.html、student.html、登录页全变成 App 版。
    #   这里只接管「课堂侧须用 App 补丁版」+「www 独有」的路径。
    #   刻意排除：index.html / login.html / teacher.html / student.html
    #
    # ★ 回落语义与 dev-proxy 的 existsSync 判定对齐：www 缺文件才回落
    #   frontend。但**不兜 /login.html** —— 兜了会把「App 未部署」伪装成
    #   「未登录」，比 404 难查得多。这里缺失就是干净 404。
    #
    # ★ 本块内不写 add_header：写了会丢掉 server 级安全头（须整套重发）。
    # ══════════════════════════════════════════════════════════════
    location ~ ^/(classroom-prep|my-classroom|classroom|launch|verify|ops)\.html$ {
        root /var/www/classroom-app;
        try_files $uri @fe_static;
    }
    location ~ ^/(app-[a-z-]+\.js|role-router\.js|ops-lite\.js|verify\.js|app\.css)$ {
        root /var/www/classroom-app;
        try_files $uri @fe_static;
    }
    location ^~ /js/classroom/ {
        root /var/www/classroom-app;
        try_files $uri @fe_static;
    }
    location = /css/classroom.css {
        root /var/www/classroom-app;
        try_files $uri @fe_static;
    }
    location @fe_static {
        root /var/www/frontend;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /login.html;
    }

    # ============================================================
    # ↓↓↓ 以下与 booking-ip.conf **逐条一致**，改动请两边同步 ↓↓↓
    # ============================================================

    location /api/v1/sensitive {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    location /api/v1/message {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    location /api/v1/sse {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    location /api/v1/users/ {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    # 🔐 登录/注册专用限流 —— 5 r/s
    location ~* ^/api/v1/(auth/login|auth/refreshToken|auth/logout|auth/wechat-login|auth/wechat-register|auth/wechat/qr|auth/wechat/pc-callback|user/register|promo/register-tenant|promo/register-user|promo/referral/validate)$ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        limit_req zone=login_zone burst=10 nodelay;
        limit_req_status 429;
    }
    # 📖 公开 GET 接口 —— 50 r/s
    location ~* ^/api/v1/(teacher/published|course/public|tenant/public|industry/options|apiInfo|system/info|tenant/name|legal/doc|term/map|interfaces) {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        limit_req zone=public_zone burst=30 nodelay;
        limit_req_status 429;
    }
    # ---- 在线课堂 classroom-service（8092）----
    location /api/v1/classrooms/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }
    location /api/v1/recordings/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # 学生历史出勤（F2-07）：GET /api/v1/attendance/history
    location /api/v1/attendance/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # 讲稿/作品/录制的分片上传（包3B）
    # ⚠️ 课堂单文件上限 100MB 时，这里与 booking-ip.conf 的同一处需**同时**调到 105m，
    #    只改一份会出现「HTTP 能传、HTTPS 413」（或反之）。当前两份都保持 20m 以对齐。
    location /api/v1/uploads/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }
    # 签名文件访问（包3B）：靠 URL 的 exp+sig 鉴权，需支持 Range 206
    location /api/v1/files/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
    }
    # 排期事件接收：POST /api/v1/schedules/events（主服务是单数 /api/v1/schedule，不冲突）
    location /api/v1/schedules/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # RTC 选型诊断（包3A）
    location /api/v1/rtc/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # ---- 课堂运营台（包4）：逐个精确前缀，不可用 /api/v1/admin/ 通配 ----
    location /api/v1/admin/monitor/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/reports/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/reconcile/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/audit/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/contract/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/exports/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location /api/v1/admin/classrooms/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # POST /api/v1/admin/classrooms（创建临时课堂）不带尾斜杠，前缀 location 匹配不到
    # → 会落到 location /api/v1/ 进 8081 → 403（2026-11-19 修）
    location = /api/v1/admin/classrooms {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # 课堂服务回调预约系统的落点（显式写死到 8081）。
    # 前缀刻意与前端课堂路由 /api/v1/classrooms/ 区分，否则回调会被 8092 抢走并 404。
    location /api/v1/classroom-callback/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
    }
    # 课堂 WebSocket：白板/心跳/信令三通道
    # ★ HTTPS 下前端会连 wss://<域名>/ws/classrooms/...（同源），因此本条在 443 上**必须存在**，
    #   少它表现为课堂白板不刷新、心跳断、反复重连，而 HTTP 页面一切正常。
    location /ws/classrooms/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # 课堂 App 安装包上传/下载（系统配置 → 课堂 App 包管理）—— 2026-11-26
    # 绿色 Windows 包约 108MB、业务层上限 150MB；server 级 20m 会在到达应用前先拒绝，
    # 因此这里单独放宽。关闭请求缓冲，避免 nginx 先把百 MB 包体落盘再转投上游。
    # 用 ^~ 锁死前缀，防止被上面的正则 location 抢走匹配。
    location ^~ /api/v1/app-package/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        client_max_body_size 200m;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    # Actuator：health 匿名放行 + 限流；info/env/beans 由 Spring Security Basic Auth 保护
    location /actuator/ {
        proxy_pass http://127.0.0.1:8081;
        access_log off;
        limit_req zone=public_zone burst=10 nodelay;
        limit_req_status 429;
    }
}

# ============================================================
# 152.136.254.127 专属：
#   · 浏览器首次访问 → 「高级 / 继续前往（不安全）」→ 页面可正常用，
#     地址栏仍显示"不安全"，这是自签的必然结果，不影响功能；
#   · 课堂：Network 里 wss://152.136.254.127/ws/classrooms/... 必须是 **101**；
#   · 服务器内部探测（curl、监控、upload-to-server.sh）走 https 要加 -k，
#     或改用 curl -k https://127.0.0.1/ -H "Host: 152.136.254.127" 走回环。
# ============================================================

# ============================================================
# 切到 HTTPS 后的回归项（少测一项就会在事后才炸）：
#   1) 登录 → 平台首页正常；
#   2) 进课堂，Network 里 wss://152.136.254.127/ws/classrooms/... 必须是 **101**；
#   3) 上传 >20MB 讲稿成功（client_max_body_size）；
#   4) 消息中心能实时收到（SSE 不被缓冲、不 60s 断）。
# 另：后端要能感知 https（Spring 用 server.forward-headers-strategy=framework），
#     否则重定向/绝对链接会退回 http 被浏览器按混合内容拦掉 ——
#     proxy_params 里的 `X-Forwarded-Proto $scheme` 就是为此，勿删。
# 再另：课堂实例的 ws_host/api_host 保持回环(127.0.0.1)，
#     后端 buildWsUrl 恒输出 ws:// ，只有被判定为回环时前端才会改用同源 wss://——
#     填成域名/公网 IP 反而会在 HTTPS 页面被当混合内容拦掉。
# ============================================================

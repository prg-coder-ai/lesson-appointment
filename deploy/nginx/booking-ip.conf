# ============================================================
# 文件：/etc/nginx/sites-available/booking-ip
# 用途：只有公网 IP、无域名（未备案）时的临时部署（纯 HTTP，仅内测）
# 启用：sudo ln -s /etc/nginx/sites-available/booking-ip /etc/nginx/sites-enabled/
#       sudo rm -f /etc/nginx/sites-enabled/default
#       sudo nginx -t && sudo systemctl reload nginx
# 注意：本配置 listen 80 default_server。若 nginx -t 报 "a duplicate default server for 0.0.0.0:80"，
#       说明 /etc/nginx/sites-enabled/ 下还有别的站点(如 default、或误挂的 booking HTTPS 版)也声明了
#       default_server，必须先删掉它们（见下方命令），否则 0.0.0.0:80 上只能有一个 default_server。
# 访问：http://<服务器IP>/            （业务端）
#       http://<服务器IP>/platform_admin.html  （平台管理端，静态页）
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                       # 无域名：catch-all

    client_max_body_size 20m;

    root /var/www/frontend;
    index login.html;
    location / {
        try_files $uri $uri/ /login.html;
    }

    location /api/v1/sensitive {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/message {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/sse {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
    }
    location /api/v1/users/ {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
    }
    # ---- 在线课堂 classroom-service（8092）----
    location /api/v1/classrooms/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }
    location /api/v1/recordings/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # 学生历史出勤（F2-07）：GET /api/v1/attendance/history
    location /api/v1/attendance/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # 讲稿/作品/录制的分片上传（包3B）
    location /api/v1/uploads/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }
    # 签名文件访问（包3B）：靠 URL 的 exp+sig 鉴权，需支持 Range 206
    location /api/v1/files/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
    }
    # 排期事件接收：POST /api/v1/schedules/events（主服务是单数 /api/v1/schedule，不冲突）
    location /api/v1/schedules/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # RTC 选型诊断（包3A）
    location /api/v1/rtc/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # ---- 课堂运营台（包4）：逐个精确前缀，不可用 /api/v1/admin/ 通配 ----
    location /api/v1/admin/monitor/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/reports/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/reconcile/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/audit/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/contract/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/exports/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location /api/v1/admin/classrooms/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # 课堂服务回调预约系统的落点（显式写死到 8081）。
    # 前缀刻意与前端课堂路由 /api/v1/classrooms/ 区分，否则回调会被 8092 抢走并 404。
    location /api/v1/classroom-callback/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
    }
    # 课堂 WebSocket：白板/心跳/信令三通道
    location /ws/classrooms/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }
}

# ============================================================
# 文件：/etc/nginx/sites-available/booking-ip
# 用途：只有公网 IP、无域名（未备案）时的临时部署（纯 HTTP，仅内测）
# 启用：sudo ln -s /etc/nginx/sites-available/booking-ip /etc/nginx/sites-enabled/
#       sudo rm -f /etc/nginx/sites-enabled/default
#       sudo nginx -t && sudo systemctl reload nginx
# 访问：http://<服务器IP>/            （业务端）
#       http://<服务器IP>/platform_admin.html  （平台管理端，静态页）
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                       # 无域名：catch-all

    client_max_body_size 20m;

    root /var/www/frontend;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/message {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/sse {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
    }
    location /api/v1/users/ {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }
}

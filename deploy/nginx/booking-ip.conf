# ============================================================
# 文件：/etc/nginx/sites-available/booking-ip
# 用途：只有公网 IP、无域名（未备案）时的临时部署（纯 HTTP，仅内测）
# 启用：sudo ln -s /etc/nginx/sites-available/booking-ip /etc/nginx/sites-enabled/
#       sudo rm -f /etc/nginx/sites-enabled/default
#       sudo nginx -t && sudo systemctl reload nginx
# 注意：本配置 listen 80 default_server。若 nginx -t 报 "a duplicate default server for 0.0.0.0:80"，
#       说明 /etc/nginx/sites-enabled/ 下还有别的站点(如 default、或误挂的 booking HTTPS 版)也声明了
#       default_server，必须先删掉它们（见下方命令），否则 0.0.0.0:80 上只能有一个 default_server。
# 访问：http://<服务器IP>/            （业务端）
#       http://<服务器IP>/platform_admin.html  （平台管理端，静态页）
#
# ★ 2026-10-29 等保 P0-2/P0-3 修订：新增安全头 + 接口限流
# ★ 本文件是 HTTP 版，HSTS（Strict-Transport-Security）不生效，故不加
#
# ⚠ 部署本文件前必须先放 zone 定义文件，否则 nginx -t 报 "unknown limit_req_zone"，
#   nginx 直接起不来（不是限流不生效，是整站挂掉）：
#
#     sudo cp deploy/nginx/conf.d/00-limit-req-zone.conf /etc/nginx/conf.d/
#     sudo ln -s /etc/nginx/sites-available/booking-ip /etc/nginx/sites-enabled/
#     sudo rm -f /etc/nginx/sites-enabled/default
#     sudo nginx -t && sudo systemctl reload nginx
#
#   limit_req_zone 只能写在 http {} 上下文，放不进本文件（本文件是 server 块），
#   所以单独拆成 conf.d/00-limit-req-zone.conf（命名带 00- 保证先于站点加载）。
#
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                       # 无域名：catch-all

    client_max_body_size 20m;

    # ═══════════════════════════════════════════════════════
    # 等保 P0-2：5 大安全响应头（HSTS 仅 HTTPS 下有效，HTTP 版不加）
    # ═══════════════════════════════════════════════════════
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    root /var/www/frontend;
    index login.html;
    location / {
        try_files $uri $uri/ /login.html;
    }

    location /api/v1/sensitive {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    location /api/v1/message {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    location /api/v1/sse {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    location /api/v1/users/ {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    # 🔐 登录/注册专用限流 —— 5 r/s
    location ~* ^/api/v1/(auth/login|auth/refreshToken|auth/logout|auth/wechat-login|auth/wechat-register|auth/wechat/qr|auth/wechat/pc-callback|user/register|promo/register-tenant|promo/register-user|promo/referral/validate)$ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        limit_req zone=login_zone burst=10 nodelay;
        limit_req_status 429;
    }
    # 📖 公开 GET 接口 —— 50 r/s
    location ~* ^/api/v1/(teacher/published|course/public|tenant/public|industry/options|apiInfo|system/info|tenant/name|legal/doc|term/map|interfaces) {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        limit_req zone=public_zone burst=30 nodelay;
        limit_req_status 429;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    # Actuator：health 匿名放行 + 限流；info/env/beans 由 Spring Security Basic Auth 保护
    location /actuator/ {
        proxy_pass http://127.0.0.1:8081;
        access_log off;
        limit_req zone=public_zone burst=10 nodelay;
        limit_req_status 429;
    }
}

# ============================================================
# 文件：/etc/nginx/conf.d/00-limit-req-zone.conf
# 用途：等保 P0-3 接口限流的 zone 定义（必须位于 http {} 上下文）
#
# 为什么单独拆一个文件而不是写进 nginx.conf：
#   1. limit_req_zone 只能出现在 http {} 里，不能进 server {}，所以放不进
#      sites-available/booking 和 booking-ip.conf（那两个是 server 块）。
#   2. Debian/Ubuntu 的 /etc/nginx/nginx.conf 默认有：
#          http {
#              include /etc/nginx/conf.d/*.conf;      ← 本文件从这里进入 http
#              include /etc/nginx/sites-enabled/*;    ← booking 从这里进入
#          }
#      conf.d 的 include 在 sites-enabled 之前，zone 先定义、后引用，nginx -t 能过。
#   3. 不用手动编辑 nginx.conf，升级/重装 nginx 不会丢配置。
#
# 部署：
#   sudo cp deploy/nginx/conf.d/00-limit-req-zone.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠ 缺了本文件会怎样：booking.conf 里的 `limit_req zone=xxx` 指向不存在的 zone，
#   nginx -t 直接报 "unknown limit_req_zone"，**整个 nginx 起不来**
#   （不是限流不生效，是整个服务挂掉）。所以这个文件和站点配置必须成对部署。
# ============================================================

# 登录/注册 —— 5 请求/秒，突发 10
# 覆盖：/api/v1/auth/login、user/register、promo/register-tenant 等暴力破解高危入口
limit_req_zone $binary_remote_addr zone=login_zone:10m   rate=5r/s;

# 短信验证码 —— 1 请求/分钟（等保 IP-1 要求项，防止短信轰炸与话费盗刷）
# 当前后端**尚无短信发送端点**，此 zone 为预置；将来接入 sms 接口时在对应
# location 内加 `limit_req zone=sms_zone burst=1 nodelay;` 即可。
limit_req_zone $binary_remote_addr zone=sms_zone:10m     rate=1r/m;

# 公开只读接口 —— 50 请求/秒
# 覆盖：/api/v1/teacher/published、course/public、tenant/public、/actuator 等匿名入口
limit_req_zone $binary_remote_addr zone=public_zone:10m  rate=50r/s;

# 其余业务接口 —— 100 请求/秒
limit_req_zone $binary_remote_addr zone=api_zone:20m    rate=100r/s;

# ---------- 超限时的行为 ----------
# 引用处的 `limit_req_status 429;` 决定返回码（Too Many Requests）。
# 需要更细的排查信息时，可临时开启日志（默认 error 级别即可见，无需修改）：
#   limit_req_log_level warn;
# 当前不加：默认 error 级别已记录 [limiting requests]，够审计用，不必调低级别刷日志。

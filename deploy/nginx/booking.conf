# ============================================================
# 文件：/etc/nginx/sites-available/booking
# 用途：业务前端 + 平台管理端 + /api/v1 分流（有域名 + HTTPS）
# 前置：把 booking.example.com 换成你的域名；
#       证书用 certbot 签发到 /etc/letsencrypt/live/<域名>/
# 启用：sudo ln -s /etc/nginx/sites-available/booking /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name booking.example.com;
    # ACME 校验目录（certbot 用），先放行
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name booking.example.com;

    ssl_certificate     /etc/letsencrypt/live/booking.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booking.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # ---- 前端静态资源（frontend/dist 的内容）----
    root /var/www/frontend;
    index login.html;
    location / {
        try_files $uri $uri/ /login.html;      # SPA 兜底（登录页已独立为 login.html）
    }
    # platform_admin.html 就在这份 dist 里，不需要任何反代

    # ---- /api/v1 分流：消息类 → 8090，其余 → 8081 ----
    # 注意顺序：越具体的 location 越靠前
    location /api/v1/sensitive {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/message {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/sse {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        proxy_buffering off;        # SSE 必须关缓冲，否则消息不实时
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
    }
    location /api/v1/users/ {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
    }
    # ---- 在线课堂 classroom-service（8092）----
    # 顺序无关（nginx 取最长前缀匹配），此处集中放在通用 /api/v1/ 之前便于阅读。
    # 注意：/api/v1/classroom-callback/ 必须留在 8081（booking-api），不能落进这里 ——
    # 它是课堂服务回调预约系统的落点，同名前缀会被 8092 抢走并 404。
    location /api/v1/classrooms/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }
    # 学生历史出勤查询（F2-07）：跨课堂聚合，落到 8092 的 /api/v1/attendance/history
    location /api/v1/attendance/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/recordings/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # 讲稿/作品/录制的分片上传（包3B）：init → PUT parts → complete
    location /api/v1/uploads/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        # 单个分片 5MB，低带宽下也可能超过默认 60s
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }
    # 签名文件访问（包3B）：<video>/<iframe> 直接 GET，带不了 Authorization 头，
    # 因此靠 URL 里的 exp+sig 自证。必须走 GET 且支持 Range（拖动/倍速依赖 206）
    location /api/v1/files/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
    }
    # 排期事件接收（课堂服务 ← 预约系统）：POST /api/v1/schedules/events
    # 注意主服务是单数 /api/v1/schedule（无 s），两者不冲突
    location /api/v1/schedules/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # RTC 选型诊断（包3A）：GET /api/v1/rtc/providers
    location /api/v1/rtc/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # ---- 课堂运营台（包4）----
    # 逐个精确前缀，不能用 location /api/v1/admin/ 一刀切：
    # 主服务也有 /api/v1/admin 语义的接口，通配会把它整片抢到 8092。
    location /api/v1/admin/monitor/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/reports/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/reconcile/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/audit/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    location /api/v1/admin/contract/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # 数据导出走流式 CSV，大时间跨度可能较慢
    location /api/v1/admin/exports/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    # 运营后台巡课/强制结束（精确前缀，避免命中 booking 的 /api/v1/admin/*）
    location /api/v1/admin/classrooms/ {
        proxy_pass http://127.0.0.1:8092;
        include /etc/nginx/proxy_params;
    }
    # 课堂服务回调预约系统的落点（显式写死到 8081，防将来通用规则改动时被 8092 抢走）。
    # 该路径只应由内网调用；如需从公网触发重放，请在防火墙上限制来源。
    location /api/v1/classroom-callback/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
    }
    # 课堂 WebSocket：白板/心跳/信令三通道，必须带 Upgrade 头且长连接不超时
    location /ws/classrooms/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }
}

# ============================================================
# 文件：/etc/nginx/sites-available/booking
# 用途：业务前端 + 平台管理端 + /api/v1 分流（有域名 + HTTPS）
# 前置：把 booking.example.com 换成你的域名；
#       证书用 certbot 签发到 /etc/letsencrypt/live/<域名>/
# 启用：sudo ln -s /etc/nginx/sites-available/booking /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# ★ 2026-10-29 等保 P0-2/P0-3 修订：新增安全头 + 接口限流
#
# ⚠ 部署本文件前必须先放 zone 定义文件，否则 nginx -t 报 "unknown limit_req_zone"，
#   nginx 直接起不来（不是限流不生效，是整站挂掉）：
#
#     sudo cp deploy/nginx/conf.d/00-limit-req-zone.conf /etc/nginx/conf.d/
#     sudo ln -s /etc/nginx/sites-available/booking /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
#   limit_req_zone 只能写在 http {} 上下文，放不进本文件（本文件是 server 块），
#   所以单独拆成 conf.d/00-limit-req-zone.conf（命名带 00- 保证先于站点加载）。
#
# ============================================================

server {
    listen 80;
    server_name booking.example.com;
    # ACME 校验目录（certbot 用），先放行
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name booking.example.com;

    ssl_certificate     /etc/letsencrypt/live/booking.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booking.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # ═══════════════════════════════════════════════════════
    # 等保 P0-2：6 大安全响应头 + HSTS（HTTPS 下 HSTS 才有效）
    # ═══════════════════════════════════════════════════════
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- 前端静态资源（frontend/dist 的内容）----
    root /var/www/frontend;
    index login.html;
    location / {
        try_files $uri $uri/ /login.html;      # SPA 兜底（登录页已独立为 login.html）
    }
    # platform_admin.html 就在这份 dist 里，不需要任何反代

    # ---- /api/v1 分流：消息类 → 8090，其余 → 8081 ----
    # 注意顺序：越具体的 location 越靠前

    location /api/v1/sensitive {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    location /api/v1/message {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    location /api/v1/sse {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        proxy_buffering off;        # SSE 必须关缓冲，否则消息不实时
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    location /api/v1/users/ {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    # 🔐 登录/注册专用限流 —— 5 r/s（防暴力破解）
    location ~* ^/api/v1/(auth/login|auth/refreshToken|auth/logout|auth/wechat-login|auth/wechat-register|auth/wechat/qr|auth/wechat/pc-callback|user/register|promo/register-tenant|promo/register-user|promo/referral/validate)$ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        limit_req zone=login_zone burst=10 nodelay;
        limit_req_status 429;
    }
    # 📖 公开 GET 接口 —— 50 r/s
    location ~* ^/api/v1/(teacher/published|course/public|tenant/public|industry/options|apiInfo|system/info|tenant/name|legal/doc|term/map|interfaces) {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        limit_req zone=public_zone burst=30 nodelay;
        limit_req_status 429;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
    }
    # Actuator：health 匿名放行 + 限流；info/env/beans 由 Spring Security Basic Auth 保护
    location /actuator/ {
        proxy_pass http://127.0.0.1:8081;
        access_log off;
        limit_req zone=public_zone burst=10 nodelay;
        limit_req_status 429;
    }
}

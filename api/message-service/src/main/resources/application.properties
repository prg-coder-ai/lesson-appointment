# ================= 消息中心微服务 message-service 端口 =================
server.port=8090

# ================= 字符集（UTF-8） =================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.messages.encoding=UTF-8
spring.mvc.encoding.charset=UTF-8
spring.mvc.encoding.enabled=true
spring.mvc.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# ================= 数据库：独立 schema message_center =================
spring.datasource.url=jdbc:mysql://localhost:3306/message_center?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= MyBatis-Plus =================
mybatis-plus.type-aliases-package=com.messagecenter.entity
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=assign_id

# ================= 日志 =================
logging.level.com.messagecenter.mapper=ERROR
logging.level.org.apache.ibatis=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level --- [%thread] %logger{36} : %msg%n

# ================= 鉴权：与主系统共享同一 JWT 密钥，主系统登录签发的 Token 可直接在此校验 =================
jwt.
jwt.expiration=360000000

# ================= AES-256-GCM 字段加密（与主系统相同密钥，可互通解密） =================
crypto.aes-key=HVwcdqAh5A6nScL+0CRJYhKPLCI8y1FP9blj3BL9L4g=
crypto.hmac-key=Ip0fg8W0iUXc9Iuw/rcsL+DQ3UkJklcATNqjAtwZmMA=

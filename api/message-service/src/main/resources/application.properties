# ================= 消息中心微服务 message-service 端口 =================
server.port=8090

# ================= 字符集（UTF-8） =================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.messages.encoding=UTF-8
spring.mvc.encoding.charset=UTF-8
spring.mvc.encoding.enabled=true
spring.mvc.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# ================= 数据库：独立 schema message_center =================
spring.datasource.url=jdbc:mysql://localhost:3306/message_center?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= MyBatis-Plus =================
mybatis-plus.type-aliases-package=com.messagecenter.entity
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=assign_id

# ================= Actuator 健康检查 =================
# 与 booking-api 同步接入（2026-10-09）。两者互相依赖：api 同步 HTTP 调本服务投递消息，
# 本服务挂掉 = 预约成功但用户收不到通知。探针必须能区分"进程活着"与"能投递"。
# 暴露面只开 health/info —— env/beans/loggers/threaddump/heapdump 一律不开放。
management.endpoints.web.exposure.include=health,info
management.endpoint.env.enabled=false
management.endpoint.beans.enabled=false
management.endpoint.configprops.enabled=false
management.endpoint.loggers.enabled=false
management.endpoint.threaddump.enabled=false
management.endpoint.heapdump.enabled=false
management.endpoint.mappings.enabled=false
management.endpoint.shutdown.enabled=false

# liveness 只查存活（DB 挂了不重启，重启救不了还会雪崩）；
# readiness 查 DB 连通性（DB 挂了摘流量但不重启）。
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.info.build.enabled=true

# ⚠️ 本服务的 MessageAuthInterceptor 只拦 /api/** 与 /msg/sse/**
#    （见 WebMvcConfig.addInterceptors），故 /actuator/** 天然不经过鉴权，
#    不需要额外放行。若日后拦截范围扩大，必须同步在 excludePathPatterns 里补上。

# ================= 调度线程池 =================
# 本服务当前**没有** @Scheduled（无定时任务），但仍显式配置：
#   1) 不配则用Spring Boot 默认的 pool.size=1 —— 等 SSE 心跳清理、过期消息回收
#      这类任务加进来时，会直接落进单线程坑，且不报任何错。
#   2) 与 booking-api 保持同一套写法，便于两边的 jstack 输出一致地按 sched-N 读。
# size 取 2 而非 4：本服务任务量预计远少于主系统，不需要更多线程。
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=sched-

# ================= 日志 =================
logging.level.com.messagecenter.mapper=ERROR
logging.level.org.apache.ibatis=ERROR
# 注意：落盘策略不在这里配，而在同目录的 logback-spring.xml
# （application.properties 里的 logging.* 只在**没有** logback 配置时才生效，
#  有 logback-spring.xml 时会被它整体接管 —— 两边混写容易出现"改了没反应"）

# ================= 鉴权：与主系统共享同一 JWT 密钥，主系统登录签发的 Token 可直接在此校验 =================
jwt.
jwt.expiration=360000000


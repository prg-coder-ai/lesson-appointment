# ================= classroom-service 端口 =================
server.port=8092

# ================= 字符集 =================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ================= 数据库：独立 schema classroom =================
spring.datasource.url=jdbc:mysql://localhost:3306/classroom?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= 跨 schema 只读（课堂守卫） =================
# classroom-service 除本库 classroom 外，还需只读访问主业务库 lesson_appointment 的
# sys_tenant_eclassroom 表。要求与 booking-api 连接同一个 MySQL 实例（本地均为 localhost:3306），
# 且该账号对 lesson_appointment 库具备 SELECT 权限。库名变更需同步修改实体/Mapper 全限定表名。
classroom.cross-schema.tenant-schema=${MYSQL_TENANT_SCHEMA:lesson_appointment}

# ================= MyBatis-Plus =================
mybatis-plus.type-aliases-package=com.classroom.entity
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=assign_id

# ================= Redis =================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=2

# ================= Actuator =================
management.endpoints.web.exposure.include=health,info
management.endpoint.env.enabled=false
management.endpoint.beans.enabled=false
management.endpoint.configprops.enabled=false
management.endpoint.loggers.enabled=false
management.endpoint.threaddump.enabled=false
management.endpoint.heapdump.enabled=false
management.endpoint.mappings.enabled=false
management.endpoint.shutdown.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.info.build.enabled=true

# ================= 调度线程池 =================
# P0-D 后常驻 9 个扫描器（2 个对账 + 7 个课堂生命周期），池太小会排队/互拖
spring.task.scheduling.pool.size=8
spring.task.scheduling.thread-name-prefix=sched-

# ================= 鉴权：共享 JWT 密钥 =================
jwt.secret=${JWT_SECRET:}
jwt.expiration=3600000

# ================= AES/HMAC（服务间签名） =================
crypto.aes-key=${AES_KEY:HVwcdqAh5A6nScL+0CRJYhKPLCI8y1FP9blj3BL9L4g=}
crypto.hmac-key=${HMAC_KEY:Ip0fg8W0iUXc9Iuw/rcsL+DQ3UkJklcATNqjAtwZmMA=}

# ================= 预约系统回调地址 =================
booking.api.base-url=${BOOKING_API_URL:http://localhost:8081}

# ================= 课堂参数 & 生命周期扫描器（P0-D） =================
# 就绪提醒：上课前多少分钟把 SCHEDULED 翻成 READY 并发提醒
classroom.ready-before-start-minutes=10
# 迟到宽限（分钟）：超过开课时间这么多分钟签到算迟到
classroom.late-grace-minutes=5
# 在线心跳：心跳间隔 15s，Redis 在线 key TTL = 下面这个值（默认 60s，≥心跳间隔避免抖动误判）。
# 掉线判定扫描器以「Redis key 是否还在」为在线唯一真相源，DB online_state 只是展示态。
classroom.offline-timeout-seconds=60
classroom.heartbeat-interval-seconds=15
# 重连续课宽限（秒）：最后心跳后超过此值进入 IDLE（不离开课堂），给 15-60s 闪断/切网留缓冲；
# 必须 < offline-timeout-seconds，否则 IDLE 窗口被压缩为空。
classroom.reconnect-grace-seconds=30
# 自动开课：全局开关（单个课堂可显式 auto_start=false 关闭）
classroom.auto-start=true
# 自动下课宽限（分钟）：超过计划结束时间这么多分钟后自动下课
classroom.auto-end-grace-minutes=5
# 教师掉线结课宽限（秒）：教师掉线这么久后自动结课（给重连留足时间，避免误杀）
classroom.teacher-drop-grace-seconds=120
# 点名超时（分钟）：发起后这么久未应答判超时
classroom.rollcall-timeout-minutes=2
# 过期数据保留（天）
classroom.presence-retention-days=180
classroom.rollcall-retention-days=90
classroom.reconcile-retention-days=365
classroom.session-retention-days=180
classroom.submission-retention-days=730
# 录制清理复用 classroom.recording-retention-days（90 天）
classroom.recording-retention-days=90
# 过期数据清理执行时刻（每日 03:30）
classroom.retention.cron=0 30 3 * * ?

# ================= 对账调度 =================
classroom.reconcile.cron=0 0 1 * * ?
classroom.reconcile.fullcheck.cron=0 0 2 ? * MON

# ================= 对象存储 =================
oss.endpoint=${OSS_ENDPOINT:https://oss.example.com}
oss.bucket=${OSS_BUCKET:classroom}
oss.access-key=${OSS_ACCESS_KEY:}
oss.secret-key=${OSS_SECRET_KEY:}
oss.signed-url-expire-hours=2

# ================= 消息队列（可选，降级为 REST） =================
mq.enabled=${MQ_ENABLED:false}
mq.schedule-event-queue=teaching.schedule.events

# ================= 日志 =================
logging.level.com.classroom.mapper=ERROR
logging.level.org.apache.ibatis=ERROR
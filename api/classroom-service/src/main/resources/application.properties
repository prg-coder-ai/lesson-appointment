# ================= classroom-service 端口 =================
server.port=8092

# ================= 字符集 =================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ================= 数据库：独立 schema classroom =================
spring.datasource.url=jdbc:mysql://localhost:3306/classroom?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= 跨 schema 只读（课堂守卫） =================
# classroom-service 除本库 classroom 外，还需只读访问主业务库 lesson_appointment 的
# sys_tenant_eclassroom 表。要求与 booking-api 连接同一个 MySQL 实例（本地均为 localhost:3306），
# 且该账号对 lesson_appointment 库具备 SELECT 权限。库名变更需同步修改实体/Mapper 全限定表名。
classroom.cross-schema.tenant-schema=${MYSQL_TENANT_SCHEMA:lesson_appointment}

# ================= MyBatis-Plus =================
mybatis-plus.type-aliases-package=com.classroom.entity
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=assign_id

# ================= Redis =================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=2

# ================= Actuator =================
management.endpoints.web.exposure.include=health,info
management.endpoint.env.enabled=false
management.endpoint.beans.enabled=false
management.endpoint.configprops.enabled=false
management.endpoint.loggers.enabled=false
management.endpoint.threaddump.enabled=false
management.endpoint.heapdump.enabled=false
management.endpoint.mappings.enabled=false
management.endpoint.shutdown.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.info.build.enabled=true

# ================= 调度线程池 =================
# P0-D 后常驻 9 个扫描器（2 个对账 + 7 个课堂生命周期），池太小会排队/互拖
spring.task.scheduling.pool.size=8
spring.task.scheduling.thread-name-prefix=sched-

# ================= 鉴权：共享 JWT 密钥 =================
jwt.secret=${JWT_SECRET:}
jwt.expiration=3600000

# ================= AES/HMAC（服务间签名） =================
crypto.aes-key=${AES_KEY:HVwcdqAh5A6nScL+0CRJYhKPLCI8y1FP9blj3BL9L4g=}
crypto.hmac-key=${HMAC_KEY:Ip0fg8W0iUXc9Iuw/rcsL+DQ3UkJklcATNqjAtwZmMA=}

# ================= 预约系统回调地址 =================
booking.api.base-url=${BOOKING_API_URL:http://localhost:8081}

# ================= 课堂参数 & 生命周期扫描器（P0-D） =================
# 就绪提醒：上课前多少分钟把 SCHEDULED 翻成 READY 并发提醒
classroom.ready-before-start-minutes=10
# 迟到宽限（分钟）：超过开课时间这么多分钟签到算迟到
classroom.late-grace-minutes=5
# 在线心跳：心跳间隔 15s，Redis 在线 key TTL = 下面这个值（默认 60s，≥心跳间隔避免抖动误判）。
# 掉线判定扫描器以「Redis key 是否还在」为在线唯一真相源，DB online_state 只是展示态。
classroom.offline-timeout-seconds=60
classroom.heartbeat-interval-seconds=15
# 重连续课宽限（秒）：最后心跳后超过此值进入 IDLE（不离开课堂），给 15-60s 闪断/切网留缓冲；
# 必须 < offline-timeout-seconds，否则 IDLE 窗口被压缩为空。
classroom.reconnect-grace-seconds=30
# 自动开课：全局开关（单个课堂可显式 auto_start=false 关闭）
classroom.auto-start=true
# 自动下课宽限（分钟）：超过计划结束时间这么多分钟后自动下课
classroom.auto-end-grace-minutes=5
# 教师掉线结课宽限（秒）：教师掉线这么久后自动结课（给重连留足时间，避免误杀）
classroom.teacher-drop-grace-seconds=120
# 点名超时（分钟）：发起后这么久未应答判超时
classroom.rollcall-timeout-minutes=2
# 过期数据保留（天）
classroom.presence-retention-days=180
classroom.rollcall-retention-days=90
classroom.reconcile-retention-days=365
classroom.session-retention-days=180
classroom.submission-retention-days=730
# 录制清理复用 classroom.recording-retention-days（90 天）
classroom.recording-retention-days=90
# 过期数据清理执行时刻（每日 03:30）
classroom.retention.cron=0 30 3 * * ?

# ================= 对账调度 =================
classroom.reconcile.cron=0 0 1 * * ?
classroom.reconcile.fullcheck.cron=0 0 2 ? * MON

# ================= RTC 媒体选型（包3·P2；抽象层见 com.classroom.rtc） =================
# provider 取值：
#   native-mesh —— 浏览器原生 WebRTC 两两直连（默认；零外部依赖，人数上限见下方 max-peers）
#   livekit     —— 开源 SFU，可自建也可用官方云；凭证为 HS256 JWT，纯 JDK 签发
#   trtc        —— 腾讯云 TRTC；凭证 UserSig v2，纯 JDK 签发
#   agora       —— 声网；token 由官方 io.agora:authentication 反射签发（未引入该依赖则不可用）
# 任何 provider 只要关键配置缺失/依赖缺失，启动时自动降级 native-mesh 并打 WARN，
# 降级事实可用 GET /api/v1/rtc/providers 查（含 configured / active / degraded）。
classroom.rtc.provider=${RTC_PROVIDER:native-mesh}
# 学生是否允许推视频（默认 false：省上行；学生音频始终可发，出声与否由服务端禁言态强控）
classroom.rtc.student-publish-video=${RTC_STUDENT_VIDEO:false}

# --- 原生 WebRTC（mesh）---
classroom.rtc.mesh.stun-servers=${RTC_STUN:stun:stun.l.google.com:19302}
# TURN 中继地址，逗号分隔，如 turn:turn.example.com:3478?transport=udp
# 生产必配：只有 STUN 时对称型 NAT / 企业防火墙下约 2-3 成用户建连失败
classroom.rtc.mesh.turn-urls=${RTC_TURN_URLS:}
# coturn 的 static-auth-secret：走 REST 临时凭证（HMAC-SHA1），不落固定账号密码
classroom.rtc.mesh.turn-secret=${RTC_TURN_SECRET:}
classroom.rtc.mesh.turn-ttl-seconds=3600
# mesh 人数上限：超过的成员只收不发（浏览器上行随人数线性增长，硬上限约 6）
classroom.rtc.mesh.max-peers=${RTC_MESH_MAX_PEERS:6}

# --- LiveKit（自建或官方云）---
classroom.rtc.livekit.url=${LIVEKIT_URL:}
classroom.rtc.livekit.api-key=${LIVEKIT_API_KEY:}
classroom.rtc.livekit.api-secret=${LIVEKIT_API_SECRET:}
classroom.rtc.livekit.token-ttl-seconds=7200
classroom.rtc.livekit.sdk-url=${LIVEKIT_SDK_URL:https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js}

# --- 腾讯云 TRTC ---
classroom.rtc.trtc.sdk-app-id=${TRTC_SDK_APP_ID:0}
classroom.rtc.trtc.secret-key=${TRTC_SECRET_KEY:}
classroom.rtc.trtc.expire-seconds=7200
classroom.rtc.trtc.sdk-url=${TRTC_SDK_URL:https://web.sdk.qcloud.com/trtc/webrtc/v5/trtc.js}

# --- 声网 Agora ---
classroom.rtc.agora.app-id=${AGORA_APP_ID:}
classroom.rtc.agora.app-certificate=${AGORA_APP_CERTIFICATE:}
classroom.rtc.agora.token-ttl-seconds=7200
classroom.rtc.agora.sdk-url=${AGORA_SDK_URL:https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js}

# ================= 对象存储 =================
# 落实形态：local（本机/挂载盘，内置、真实可用）| s3 | oss（需实现 ObjectStorage 接口后装配）
classroom.storage.type=${STORAGE_TYPE:local}
classroom.storage.local-root=${STORAGE_LOCAL_ROOT:./data/oss}
# 单文件上限 100MB（需求 F4-04 / F5-01）
classroom.storage.max-file-size-bytes=104857600
# 分片大小 5MB（100MB 文件 = 20 片；断点续传以此为最小重传单位）
classroom.storage.part-size-bytes=5242880
# 签名 URL 有效期 2h（需求 F4-06 / F6-03）
classroom.storage.signed-url-ttl-seconds=7200
# 对外访问前缀；留空则输出相对路径 /api/v1/files/...（同源代理）
classroom.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:}

# Spring multipart：一次性直传用（>100MB 时应走分片接口）
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# ---------------- 兼容旧配置（OssClient 已改为委托 classroom.storage） ----------------
oss.endpoint=${OSS_ENDPOINT:https://oss.example.com}
oss.bucket=${OSS_BUCKET:classroom}
oss.access-key=${OSS_ACCESS_KEY:}
oss.secret-key=${OSS_SECRET_KEY:}
oss.signed-url-expire-hours=2

# ================= 录制（包3·P2） =================
# mode：client（默认，教师端 MediaRecorder 本地录制后分片上传）
#       cloud（媒体服务器侧云录制；本仓库未内置厂商 REST 实现，配了也会降级 client 并 WARN）
classroom.recording.mode=${RECORDING_MODE:client}
# 保留天数（F6-05：90 天）；到期由每日 03:30 清理任务"先删对象再删记录"
classroom.recording.retention-days=90
# 单次录制上传上限（字节），默认 2GB
classroom.recording.max-upload-bytes=2147483648

# ================= 用户维度限流（包4B） =================
# 固定窗口计数（Redis INCR + EXPIRE）；Redis 不可用时降级为进程内兜底并 WARN，不拒服务。
classroom.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# 进课堂：刷新/重连都会打到这里，阈值不能太小
classroom.rate-limit.enter-per-minute=30
# 创建上传会话（每次上传 1 次 init）
classroom.rate-limit.upload-per-minute=30
# 发起点名（教师手抖连点会刷出一串 PENDING）
classroom.rate-limit.rollcall-per-minute=10
# 提交作业（防脚本刷作品打满存储）
classroom.rate-limit.submit-per-minute=20

# ================= 消息队列（可选，降级为 REST） =================
mq.enabled=${MQ_ENABLED:false}
mq.schedule-event-queue=teaching.schedule.events

# ================= 日志 =================
logging.level.com.classroom.mapper=ERROR
logging.level.org.apache.ibatis=ERROR
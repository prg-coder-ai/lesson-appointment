# ==============================================================================
# 等保 P0-1：cloud 档强制严格安全模式
# ==============================================================================
# Dockerfile 入口参数：--spring.profiles.active=cloud
# 容器部署场景下必须启用严格安全模式：
#   1) JWT/AES/HMAC 密钥必须通过独立环境变量注入（JWT_SECRET / AES_KEY / HMAC_KEY）；
#      与仓库内示例默认值相同会在启动时抛 IllegalStateException 阻断。
#   2) 密码强度强制严格（PasswordPolicy.STRONG = 8-64 位、大小写+数字+特殊字符缺一不可）。
#   3) Actuator Basic Auth 的 ACTUATOR_PASSWORD 若仍是默认占位值也阻断启动。
#   4) 如需临时关闭（排障紧急回滚）：在容器部署控制台把 APP_SECURITY_STRICT_MODE=false
#      同时重启容器。

app.security.strict-mode=${APP_SECURITY_STRICT_MODE:true}

# ==============================================================================
# 等保 P1-3：CORS 允许来源（cloud 档）
# ==============================================================================
# 生产域名**不写死在镜像里**，由云端环境变量 APP_CORS_ORIGIN_PATTERNS 注入。
#
# 为什么留空而不是给一个默认域名：
#   本项目前后端由**同一个 Nginx 域名**对外（web 容器静态页 + /api/v1 反代到 api 容器），
#   浏览器访问的是同源地址，根本不会触发 CORS 预检。也就是说：留空不影响正常访问，
#   但如果留了一个"猜的域名"，一旦猜错反而会把真正的跨域调用（如小程序/H5 独立域）拦掉，
#   而且排查时看到的是浏览器 CORS 报错、后端日志一片正常，非常难定位。
#
# 部署时按需注入（逗号分隔，不含路径）：
#   APP_CORS_ORIGIN_PATTERNS=https://www.yourdomain.com,https://admin.yourdomain.com
#   兼容云托管/小程序场景时可加：https://*.tcloudbase.com
#
# ⚠️ 不要注入单独的 "*"：与 allowCredentials=true 组合等于对所有站点开放。
app.cors.allowed-origin-patterns=${APP_CORS_ORIGIN_PATTERNS:}

# ==============================================================================
# 云托管数据源覆盖（2026-11-07 修复）
# ==============================================================================
# 故障现象：api-023 部署后 Liveness/Readiness probe 报
#   dial tcp 10.36.2.177:8081: connect: connection refused
# 原因之一：镜像内 cloud 档此前未覆盖 datasource，容器内回落到
#   application.properties 的 localhost:3306 —— 容器里没有 MySQL，必然连不上。
# 这里改为环境变量注入；未注入时仍回落 localhost，方便本地起容器联调。
# 云托管控制台需配置：MYSQL_HOST / MYSQL_PORT / MYSQL_DB
# （用户名密码沿用 application.properties 的 DB_USERNAME / DB_PASSWORD）
#
# ★ characterEncoding 必须写 Java 字符集名（UTF-8），**不能写 utf8mb4**（2026-11-08 线上事故）
#   Connector/J 的 characterEncoding 参数接受的是 **Java charset 名**，不是 MySQL 字符集名；
#   Java 里没有 "utf8mb4" 这个 charset（实测 Charset.isSupported("utf8mb4") == false，
#   而 "utf8" / "UTF-8" 均为 true），所以驱动启动建连时直接抛
#     java.sql.SQLException: Unsupported character encoding 'utf8mb4'
#   表现：容器活着、健康检查通过，但任何要查库的接口（登录/列表）全 500。
#   连接层是否用 utf8mb4 由 Connector/J 8.x 依 UTF-8 自动协商，无需在此声明。
# ==============================================================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:lesson_appointment}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true

# 端口显式声明，避免与 Dockerfile EXPOSE / container.config.json containerPort 漂移
server.port=8081

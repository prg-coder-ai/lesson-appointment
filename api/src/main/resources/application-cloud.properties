# ==============================================================================
# 等保 P0-1：cloud 档强制严格安全模式
# ==============================================================================
# Dockerfile 入口参数：--spring.profiles.active=cloud
# 容器部署场景下必须启用严格安全模式：
#   1) JWT/AES/HMAC 密钥必须通过独立环境变量注入（JWT_SECRET / AES_KEY / HMAC_KEY）；
#      与仓库内示例默认值相同会在启动时抛 IllegalStateException 阻断。
#   2) 密码强度强制严格（PasswordPolicy.STRONG = 8-64 位、大小写+数字+特殊字符缺一不可）。
#   3) Actuator Basic Auth 的 ACTUATOR_PASSWORD 若仍是默认占位值也阻断启动。
#   4) 如需临时关闭（排障紧急回滚）：在容器部署控制台把 APP_SECURITY_STRICT_MODE=false
#      同时重启容器。

app.security.strict-mode=${APP_SECURITY_STRICT_MODE:true}

# ==============================================================================
# 等保 P1-3：CORS 允许来源（cloud 档）
# ==============================================================================
# 生产域名**不写死在镜像里**，由云端环境变量 APP_CORS_ORIGIN_PATTERNS 注入。
#
# 为什么留空而不是给一个默认域名：
#   本项目前后端由**同一个 Nginx 域名**对外（web 容器静态页 + /api/v1 反代到 api 容器），
#   浏览器访问的是同源地址，根本不会触发 CORS 预检。也就是说：留空不影响正常访问，
#   但如果留了一个"猜的域名"，一旦猜错反而会把真正的跨域调用（如小程序/H5 独立域）拦掉，
#   而且排查时看到的是浏览器 CORS 报错、后端日志一片正常，非常难定位。
#
# 部署时按需注入（逗号分隔，不含路径）：
#   APP_CORS_ORIGIN_PATTERNS=https://www.yourdomain.com,https://admin.yourdomain.com
#   兼容云托管/小程序场景时可加：https://*.tcloudbase.com
#
# ⚠️ 不要注入单独的 "*"：与 allowCredentials=true 组合等于对所有站点开放。
app.cors.allowed-origin-patterns=${APP_CORS_ORIGIN_PATTERNS:}

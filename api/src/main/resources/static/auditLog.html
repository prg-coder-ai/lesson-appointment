<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审计日志 - 语言教学预约系统</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f0f2f5; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 0 24px; height: 60px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; color: #722ed1; }
    .header-actions { display: flex; align-items: center; gap: 16px; }
    .user-info { display: flex; align-items: center; gap: 8px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #722ed1; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #f0f0f0; }
    .card-title { font-size: 16px; font-weight: 600; color: #333; display: flex; align-items: center; gap: 8px; }
    .card-body { padding: 16px 20px; }
    .btn { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; transition: opacity .2s; }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #722ed1; color: #fff; }
    .btn-default { background: #fff; color: #333; border: 1px solid #d9d9d9; }
    .header-btns { display: flex; gap: 8px; }

    /* 工具栏 */
    .audit-toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    .audit-toolbar select, .audit-toolbar input {
      padding: 8px 10px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; box-sizing: border-box;
    }
    .audit-toolbar select:focus, .audit-toolbar input:focus { outline: none; border-color: #722ed1; }

    /* 表格 */
    .audit-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .audit-table th { background: #fafafa; padding: 10px 8px; text-align: left; border-bottom: 2px solid #f0f0f0; font-weight: 600; color: #333; }
    .audit-table td { padding: 8px; border-bottom: 1px solid #f0f0f0; color: #555; }
    .audit-table tr:hover { background: #fafafa; }
    .badge-success { color: #52c41a; font-weight: 600; }
    .badge-fail { color: #ff4d4f; font-weight: bold; }

    /* 分页 */
    .pagination { margin-top: 16px; display: flex; gap: 4px; justify-content: center; }
    .pagination button { padding: 6px 12px; border: 1px solid #d9d9d9; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; }
    .pagination button:hover { border-color: #722ed1; color: #722ed1; }
    .pagination button.active { background: #722ed1; color: #fff; border-color: #722ed1; }
    .pagination button:disabled { opacity: .4; cursor: not-allowed; }

    /* 详情弹窗 */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.45); z-index: 9999; }
    .modal-content { background: #fff; margin: 5% auto; padding: 24px; border-radius: 8px; width: 80%; max-width: 800px; max-height: 80vh; overflow: auto; box-shadow: 0 4px 20px rgba(0,0,0,.15); }
    .modal-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .detail-field { margin-bottom: 10px; font-size: 14px; }
    .detail-field .label { color: #999; font-size: 12px; margin-bottom: 2px; }
    .detail-field .value { color: #333; word-break: break-all; }
    .audit-detail-code { max-height: 300px; overflow: auto; background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px; font-family: 'Cascadia Mono', monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; }

    .empty-tip { text-align: center; color: #999; padding: 40px 0; }
  </style>
</head>
<body>
  <!-- 头部 -->
  <header class="header">
    <div class="logo">
      <i class="fa fa-shield-alt"></i>
      <span>审计日志</span>
    </div>
    <div class="header-actions">
      <div class="user-info">
        <div class="avatar" id="avatar">A</div>
        <span id="user-name">Admin</span>
      </div>
      <button class="btn btn-default" onclick="goBack()"><i class="fa fa-arrow-left"></i> 返回</button>
    </div>
  </header>

  <div class="container">
    <!-- 审计日志卡片 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title"><i class="fa fa-history"></i> 操作审计日志</div>
        <div class="header-btns">
          <button class="btn btn-default" onclick="resetFilter()"><i class="fa fa-undo"></i> 重置</button>
          <button class="btn btn-primary" onclick="loadAuditLogs(1)"><i class="fa fa-search"></i> 查询</button>
        </div>
      </div>
      <div class="card-body">
        <!-- 筛选工具栏 -->
        <div class="audit-toolbar">
          <select id="f-action">
            <option value="">全部操作</option>
          </select>
          <select id="f-resourceType">
            <option value="">全部资源</option>
            <option value="user">用户</option>
            <option value="course">课程</option>
            <option value="template">模板</option>
            <option value="schedule">排期</option>
            <option value="booking">预约</option>
            <option value="appointment">课时</option>
          </select>
          <select id="f-result">
            <option value="">全部结果</option>
            <option value="success">成功</option>
            <option value="fail">失败</option>
          </select>
          <input type="date" id="f-start">
          <span style="color:#999;">~</span>
          <input type="date" id="f-end">
          <input type="text" id="f-userId" placeholder="用户ID" style="width:160px">
        </div>

        <!-- 数据表格 -->
        <div style="overflow-x:auto;">
          <table class="audit-table">
            <thead>
              <tr>
                <th>时间</th>
                <th>操作人</th>
                <th>角色</th>
                <th>操作</th>
                <th>资源</th>
                <th>结果</th>
                <th>耗时</th>
                <th>IP</th>
                <th>详情</th>
              </tr>
            </thead>
            <tbody id="audit-tbody"></tbody>
          </table>
        </div>

        <!-- 分页 -->
        <div id="audit-pagination" class="pagination"></div>
      </div>
    </div>
  </div>

  <!-- 详情弹窗 -->
  <div id="audit-detail-modal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <div class="modal-title"><i class="fa fa-file-alt"></i> 审计日志详情</div>
      <div id="audit-detail-content"></div>
      <div style="margin-top:16px;text-align:right;">
        <button class="btn btn-default" onclick="closeDetail()"><i class="fa fa-times"></i> 关闭</button>
      </div>
    </div>
  </div>

  <!-- 依赖脚本 -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/public/utility_request.js"></script>
  <script src="/js/public/auth.js"></script>
  <script src="js/public/api.js"></script>
  <script src="/js/auditLog.js"></script>
  <script>
    var pageChannel = new BroadcastChannel('auditLog-channel');
    pageChannel.onmessage = function(ev) {
      if (ev.data === 'ping') {
        pageChannel.postMessage('pong');
        window.focus();
      }
    };
    window.addEventListener('beforeunload', function() {
      pageChannel.close();
    });

    // 页面初始化
    (function init() {
      var user = getCurrentUserInfo();
      if (!user) {
        saveLoginRedirect && saveLoginRedirect('no-login');
        window.location.href = './index.html';
        return;
      }
      if (user.role !== 'admin') {
        document.querySelector('.container').innerHTML =
          '<div class="card"><div class="card-body empty-tip">仅管理员可访问本页面</div></div>';
        return;
      }
      if (user.name) {
        document.getElementById('avatar').innerHTML = user.name[0] || 'A';
        document.getElementById('user-name').innerHTML = user.name;
      }
    })();

    function goBack() {
      var from = new URLSearchParams(window.location.search).get('from');
      if (from) {
        window.location.href = from;
      } else if (document.referrer) {
        window.history.back();
      } else {
        window.location.href = './admin.html';
      }
    }
  </script>
</body>
</html>

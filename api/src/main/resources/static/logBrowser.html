<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统日志 - 语言教学预约系统</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f0f2f5; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 0 24px; height: 60px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; color: #722ed1; }
    .header-actions { display: flex; align-items: center; gap: 16px; }
    .user-info { display: flex; align-items: center; gap: 8px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #722ed1; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #f0f0f0; }
    .card-title { font-size: 16px; font-weight: 600; color: #333; display: flex; align-items: center; gap: 8px; }
    .card-body { padding: 16px 20px; }
    .btn { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; transition: opacity .2s; }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #722ed1; color: #fff; }
    .btn-default { background: #fff; color: #333; border: 1px solid #d9d9d9; }
    .header-btns { display: flex; gap: 8px; }

    /* 工具栏 */
    .log-toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    .log-toolbar select, .log-toolbar input {
      padding: 8px 10px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; box-sizing: border-box;
    }
    .log-toolbar select:focus, .log-toolbar input:focus { outline: none; border-color: #722ed1; }
    .log-toolbar label { display: flex; align-items: center; gap: 4px; font-size: 14px; color: #666; cursor: pointer; }
    .log-toolbar input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }

    /* 日志内容 */
    .log-content {
      background: #1e1e1e; color: #d4d4d4; font-family: 'Cascadia Mono', 'Consolas', monospace;
      font-size: 13px; padding: 16px; border-radius: 6px; max-height: 70vh; overflow: auto;
      white-space: pre-wrap; word-break: break-all; line-height: 1.6;
    }
    .log-line-ERROR { color: #f48771; }
    .log-line-WARN  { color: #d7ba7d; }
    .log-line-INFO  { color: #d4d4d4; }

    .empty-tip { text-align: center; color: #999; padding: 40px 0; }
  </style>
</head>
<body>
  <!-- 头部 -->
  <header class="header">
    <div class="logo">
      <i class="fa fa-file-medical-alt"></i>
      <span>系统日志</span>
    </div>
    <div class="header-actions">
      <div class="user-info">
        <div class="avatar" id="avatar">A</div>
        <span id="user-name">Admin</span>
      </div>
      <button class="btn btn-default" onclick="goBack()"><i class="fa fa-arrow-left"></i> 返回</button>
    </div>
  </header>

  <div class="container">
    <!-- 系统日志卡片 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title"><i class="fa fa-terminal"></i> 系统运行日志</div>
        <div class="header-btns">
          <label style="display:flex;align-items:center;gap:4px;font-size:14px;color:#666;cursor:pointer;">
            <input type="checkbox" id="log-autorefresh" style="width:16px;height:16px;cursor:pointer;"> 自动刷新(3秒)
          </label>
          <button class="btn btn-primary" onclick="loadLogs()"><i class="fa fa-search"></i> 查询</button>
        </div>
      </div>
      <div class="card-body">
        <!-- 筛选工具栏 -->
        <div class="log-toolbar">
          <select id="log-date">
            <option value="">当前日志</option>
          </select>
          <select id="log-level">
            <option value="">全部级别</option>
            <option value="INFO">INFO</option>
            <option value="WARN">WARN</option>
            <option value="ERROR">ERROR</option>
          </select>
          <input type="text" id="log-keyword" placeholder="关键词搜索" style="width:200px">
        </div>

        <!-- 日志内容 -->
        <div class="log-content" id="log-content"></div>
      </div>
    </div>
  </div>

  <!-- 依赖脚本 -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/public/utility_request.js"></script>
  <script src="/js/public/auth.js"></script>
  <script src="js/public/api.js"></script>
  <script src="/js/logBrowser.js"></script>
  <script>
    var pageChannel = new BroadcastChannel('logBrowser-channel');
    pageChannel.onmessage = function(ev) {
      if (ev.data === 'ping') {
        pageChannel.postMessage('pong');
        window.focus();
      }
    };
    window.addEventListener('beforeunload', function() {
      pageChannel.close();
    });

    // 页面初始化
    (function init() {
      var user = getCurrentUserInfo();
      if (!user) {
        saveLoginRedirect && saveLoginRedirect('no-login');
        window.location.href = './index.html';
        return;
      }
      if (user.role !== 'admin') {
        document.querySelector('.container').innerHTML =
          '<div class="card"><div class="card-body empty-tip">仅管理员可访问本页面</div></div>';
        return;
      }
      if (user.name) {
        document.getElementById('avatar').innerHTML = user.name[0] || 'A';
        document.getElementById('user-name').innerHTML = user.name;
      }
    })();

    function goBack() {
      var from = new URLSearchParams(window.location.search).get('from');
      if (from) {
        window.location.href = from;
      } else if (document.referrer) {
        window.history.back();
      } else {
        window.location.href = './admin.html';
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" , xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语言教学预约系统 - 统一登录入口</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <!-- 引入公共样式 -->
  <!--- link rel="stylesheet" href="/css/common.css" -->
  <!-- 引入图标库 -->
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 新增注册弹窗样式（可整合到common.css） */
    .login-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 400px;
      background: #fff;
      border-radius: 8px;
      padding: 24px; 
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    .modal-mask {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      display: none;
    }
    .modal-content {
      width: 90%;
      max-width: 400px;
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }
    .modal-close {
      cursor: pointer;
      font-size: 18px;
      color: #999;
    }
    .modal-close:hover {
      color: #333;
    }
    .register-btn {
      margin-top: 12px;
      text-align: center;
    }
    .register-btn a {
      color: #409eff;
      text-decoration: none;
      font-size: 14px;
    }
    .register-btn a:hover {
      text-decoration: underline;
    }
    .form-item {
      margin-bottom: 16px;
    }
    .form-item label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .form-item input, .form-item select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .error-tip {
      color: #f56c6c;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }
    .success-tip {
      color: #67c23a;
      font-size: 14px;
      text-align: center;
      margin-top: 12px;
      display: none;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #409eff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    .btn:disabled {
      background: #a0cfff;
      cursor: not-allowed;
    }
    .btn-cancel {
      background: #909399;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <!-- 登录容器 -->
  <div class="login-container">
    <div class="login-header">
      <div class="logo"><i class="fa fa-graduation-cap"></i></div>
      <div class="title">语言教学预约系统</div>
      <div class="subtitle">请登录</div>
    </div>

    <!--class="modal-content"  登录表单 -->
    <form class="modal-content"  id="login-form">

      <div class="form-item">
        <label for="username">账号</label>
        <input type="text" id="username" placeholder="请输入账号" required>
        <div class="error-tip" id="username-error">请输入账号</div>

  </div>
 <!--   TBD：后台判断如果已经存在，则不允许增加admin --当user为空时才可添加supperadmin/admin 
   <option value="admin">管理员</option>
   -->

    <div class="modal-content">

        <div class="form-item">

        <button type="submit" class="btn" id="register-btn">提交注册</button>

        <div class="success-tip" id="register-success">注册申请提交成功！请等待管理员审核</div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/public/terms.js"></script>
  <script src="js/public/termsFunction.js"></script>
  <script src="js/public/api.js"></script>
  <script src="js/public/utility_request.js"></script>
  <script src="js/public/auth.js"></script>

  <!-- JavaScript核心逻辑 -->
  <script> 
    // DOM元素获取（登录相关）
    const loginForm = document.getElementById('login-form');
    //const userRole = document.getElementById('user-role');
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const loginBtn = document.getElementById('login-btn');
    const btnText = document.getElementById('btn-text');
    
    // 错误提示元素（登录）
   // const roleError = document.getElementById('role-error');
    const usernameError = document.getElementById('username-error');
    const passwordError = document.getElementById('password-error');
    const loginError = document.getElementById('login-error');

    // 新增：注册相关DOM元素
    const registerModal = document.getElementById('register-modal');
    const showRegister = document.getElementById('show-register');
    const closeModal = document.getElementById('close-modal');
    const cancelRegister = document.getElementById('cancel-register');
    const registerForm = document.getElementById('register-form');
    const registerRole = document.getElementById('register-role');
    const registerUsername = document.getElementById('register-username');
    const registerName = document.getElementById('register-name');

     var   registerEmail ="";// document.getElementById('register-email');
     var   registerPhone =""; //document.getElementById('register-phone');
      var registerAccount="";
    const registerPassword = document.getElementById('register-password');
    const registerConfirmPwd = document.getElementById('register-confirm-pwd');
    const registerBtn = document.getElementById('register-btn');
    
    // 注册错误/成功提示
    const registerRoleError = document.getElementById('register-role-error');
    const registerUsernameError = document.getElementById('register-username-error');
    const registerNameError = document.getElementById('register-name-error');
     const registerPasswordError = document.getElementById('register-password-error');
    const registerConfirmError = document.getElementById('register-confirm-error');
    const registerSuccess = document.getElementById('register-success');
    const registerError = document.getElementById('register-error');
   

    // 表单验证函数（登录）
    function validateForm() {
      let isValid = true;
      
      // 重置所有错误提示
      //roleError.style.display = 'none';
      usernameError.style.display = 'none';
      passwordError.style.display = 'none';
      loginError.style.display = 'none';

      // 验证身份选择
    //  if (!userRole.value) {
    //    roleError.style.display = 'block';
    //    isValid = false;
     // }

      // 验证账号
      if (!username.value.trim()) {
        usernameError.style.display = 'block';
        isValid = false;
      }
   
      // 验证密码
      if (!password.value.trim()) {
        passwordError.style.display = 'block';
        isValid = false;
      }

      return isValid;
    }

    // 新增：注册表单验证函数
    async function validateRegisterForm() {
      let isValid = true;
      
      // 重置所有提示
      registerRoleError.style.display = 'none';
      registerUsernameError.style.display = 'none';
      registerNameError.style.display = 'none';
      registerPasswordError.style.display = 'none';
      registerConfirmError.style.display = 'none';
      tenantError.style.display = 'none';
      registerSuccess.style.display = 'none';
      registerError.style.display = 'none';

      // 验证身份
      if (!registerRole.value) {
        registerRoleError.style.display = 'block';
        isValid = false;
      }

      // 验证租户编码：后端要求注册时携带，缺失会返回 403
      if (!tenantCodeInput.value.trim()) {
        tenantError.textContent = '请输入租户编码';
        tenantError.style.display = 'block';
        isValid = false;
      }

      // 验证账号
      if (!registerUsername.value.trim()) {
        registerUsernameError.style.display = 'block';
        isValid = false;
      } else {
        // 账号格式校验（邮箱或电话号码）
        // 【修改】新增：根据输入内容判断是邮箱还是电话号码，并进行相应格式校验
        // 账号包含"@"符号，判断为邮箱，否则判断为电话号码 
        if (registerUsername.value.includes("@")) {
           //判断为邮箱，检查是否合规
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(registerUsername.value.trim())) {
          registerUsernameError.textContent = '请输入有效的邮箱地址';
          registerUsernameError.style.display = 'block';
          isValid = false;
      }else {
          registerEmail = registerUsername.value.trim();
          registerAccount = registerEmail;
          registerPhone = "";
        }
    }else{
        registerEmail="";
        const phonePattern = /^[\d-]{1,30}$/;
        if (!phonePattern.test(registerUsername.value.trim())) {
          registerUsernameError.textContent = '请输入有效的电话号码（最多30位，仅限数字和“-”分隔符）';
          registerUsernameError.style.display = 'block';
          isValid = false;
        } else {
          registerPhone = registerUsername.value.trim();
          registerAccount = registerPhone;
        }
      }
      if(isValid)
       { // 检查账号是否已存在  
        const isExist = await toCheckAccountExists(registerAccount);
        if (isExist) { 
          isValid = false; 
          registerUsernameError.textContent = '账号已存在';
          registerUsernameError.style.display = 'block';
        }
      }
    } 

      // 验证真实姓名
      if (!registerName.value.trim()) {
        registerNameError.style.display = 'block';
        isValid = false;
      }
            

      // 验证密码
      if (!registerPassword.value.trim()) {
        registerPasswordError.style.display = 'block';
        isValid = false;
      }

      // 验证确认密码
      if (registerConfirmPwd.value.trim() !== registerPassword.value.trim()) {
        registerConfirmError.style.display = 'block';
        isValid = false;
      }

      return isValid;
    }

   // 利用后端 "/account/exist" 检查账号是否已经存在
   // 该函数会对输入账号发起GET请求，返回Promise<boolean>
   async function toCheckAccountExists(registerAccount) {
     if (!registerAccount) return false;
     try {
       // 调用后端接口 GET /user/account/exist?account=xxx
       // request 拦截器在 code=200 时直接返回 res.data，此处即 Boolean
       const existed = await request({
         url: '/user/account/exist',
         method: 'GET',
         params: { account: registerAccount.trim() },
         customErrorMsg: false // 异常由本函数自行提示，不弹窗
       });
       return !!existed;
     } catch (e) {
       // 后端不可达时保守视为"未占用"，避免阻塞注册；控制台记录便于排查
       console.warn('账号存在性校验失败，视为未占用：', e);
       return false;
     }
   }
    // 新增：提交注册申请（直接使用 request 封装，无伪异步）
    async function submitRegister() {
      // 1. 先跑表单校验（含账号存在性、密码等）；失败直接返回
      const valid = await validateRegisterForm();
      if (!valid) return Promise.resolve(false);

      // 2. 构造注册信息 —— 后端 @RequestBody User 实体字段严格对齐
      const role = registerRole.value.trim();
      const account = (registerAccount || '').trim();
      const tenantCode = document.getElementById('tenant-code').value.trim();
      const registerInfo = {
        role: role,
        account: account,
        email: (registerEmail || '').trim() || null,   // null 不进库时不会触发唯一键
        phone: (registerPhone || '').trim() || null,
        name: registerName.value.trim() || null,        // 学生注册时 name 可空
        password: registerPassword.value.trim(),
        status: 'pending'   ,                           // 修正拼写：原 pendding(3d) -> pending(2d)，与后端一致
        tenantCode: tenantCode // 新增：租户编码
      };
        
      
      try {
        // 3. 使用 request 发起 POST：URL 已通过拦截器 baseURL 自动拼接
        //    后端路径：POST /user/{student|teacher}/register
        const resultData = await request({
          url: `/user/register`,
          method: 'POST',
          data: registerInfo,
          customErrorMsg: false // 我们自己统一处理错误信息（400/网络/异常），避免重复弹窗
        });

        // 4. 注册成功：显示后端返回的 message（若有）
        registerError.style.display = 'none';
        registerSuccess.style.display = 'block';
        // request 拦截器 code=200 时只返回 res.data（Map：{userId,account,token,role}）
        // 所以 message 需从 localStorage 暂存或用默认文案；此处给用户友好提示
        registerSuccess.textContent = '注册成功，请等待管理员审核';

        // 5. 保存登录态：currentUser（完整用户信息） + token/refreshToken
        //    后端 Register 接口返回不含 refreshToken（只有 token），这里与登录返回对齐
        const currentUser = {
          userId:  resultData.userId,
          account: resultData.account,
          role:    resultData.role,
          token:   resultData.token,
          name:    registerInfo.name || '',
          tenantCode: registerInfo.tenantCode || '' // 新增：租户编码
        };
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        // token 单独保存：utility_request.js 请求拦截器从 localStorage.getItem('token') 取
        if (resultData.token) {
          localStorage.setItem('token', resultData.token);
        }
        // 注册接口暂未返回 refreshToken，留空避免刷新逻辑误判
        localStorage.removeItem('refreshToken');

        // 6. 写入 Cookie（2小时），保持当前逻辑
        try {
          const d = new Date();
          d.setTime(d.getTime() + (2 * 60 * 60 * 1000));
          document.cookie = `currentUser=${encodeURIComponent(JSON.stringify(currentUser))};expires=${d.toUTCString()};path=/`;
        } catch (e) {
          console.warn('写入cookie失败（不影响核心流程）：', e);
        }

        // 7. 2秒后关闭弹窗并按登录回跳逻辑跳转（优先消费 redirect）
        setTimeout(() => {
          registerModal.style.display = 'none';
          resetRegisterForm();
          // 先查是否有保存的来源页 redirect（例如被 401 打回后注册新账号）
          let redirectUrl = null;
          if (typeof window.consumeLoginRedirect === 'function') {
            redirectUrl = window.consumeLoginRedirect();
          }
          if (redirectUrl) {
            // 有来源页：回跳到访问前的 URL（保留 hash/search）
            window.location.assign(redirectUrl);
          } else {
            // 无来源页：按角色跳默认页，或者留在 index
            // 因为注册的 role 是 registerInfo.role（student/teacher），这里用 redirectToUserPage 即可
            if (typeof redirectToUserPage === 'function') {
              redirectToUserPage({ role: registerInfo.role });
            } else {
              window.location.href = './index.html';
            }
          }
        }, 2000);

        return true;
      } catch (error) {
        // ---- 8. 错误分支：分场景给出精确提示 ----
        console.error('注册请求出错：', error);
        registerSuccess.style.display = 'none';
        registerError.style.display = 'block';

        // request 拦截器对非200：return Promise.reject(res)，res 结构为 {code,message,data}
        const code = error && error.code;
        const msg  = error && (error.message || error.msg);

        if (code === 400) {
          // 后端 existAccount -> "该账号已注册，请登录或重置密码"
          registerError.textContent = msg || '该账号已存在，请更换账号或登录';
           } else if (code === 401  ) {
          registerError.textContent = ' 请先登录'; 
        } else if ( code === 403) {
          registerError.textContent = '无权访问，请联系管理员';
        } else if (code === 500) {
          registerError.textContent = '服务器内部错误，请稍后重试';
        } else if (typeof error === 'string' && error.includes('超时')) {
          registerError.textContent = error;
        } else if (typeof error === 'string' && error.includes('网络连接失败')) {
          registerError.textContent = '网络连接失败，请检查后端服务是否启动（端口8081）';
        } else if (msg) {
          registerError.textContent = msg;
        } else {
          registerError.textContent = '注册失败，请检查网络或稍后重试';
        }
        return false;
      }
    }

   
    // 重置登录表单
    function resetLoginForm() {
      loginForm.reset();
      loginBtn.disabled = false;
      btnText.innerHTML = '登录系统';
    }

    // 新增：重置注册表单
    function resetRegisterForm() {
      registerForm.reset();
      registerBtn.disabled = false;
      registerSuccess.style.display = 'none';
      registerError.style.display = 'none';
      // 重置后重新套用租户编码规则（恢复 URL 参数或平台默认值）
      applyTenantCodeRule();
    }

    
    // 登录表单提交事件
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault(); // 阻止表单默认提交

      // 表单验证
      if (!validateForm()) {
        return;
      }

      // 显示加载状态
      loginBtn.disabled = true;
      btnText.innerHTML = '<span class="loading"></span> 登录中...';
       const loginRole = document.getElementById('login-role').value.trim();
      const loginTenantCode = document.getElementById('login-tenant-code').value.trim();

      try {
        const user = await authenticateUser(
          username.value.trim(),
          password.value.trim(),
          { tenantCode: loginRole === 'platform_admin' ? 'platform' : loginTenantCode,
            role: loginRole }
          )  ;
        //save
      const currentUser = {
          userId:  user.userId,
          account: user.account,
          role:    user.role,
          token:   user.token,
          name:    user.name || '',
          // 修正：后端登录响应不含 tenantCode，必须用【登录时确定的租户编码】保存，

在使用 fetch 进行自动登录（如刷新页面后检查 localStorage/cookie 自动登录）时出现 403 错误，原因可能有：

1. **会话凭证丢失**：后端通常通过 Cookie（如 JSESSIONID、token 等）验证登录态。刷新页面时，如果前端未携带或丢失这些凭证（如本地未种 cookie，或 fetch 没加 credentials 配置），后端会拒绝请求返回 403。

2. **跨域未携带认证信息**：fetch 请求如果未设置 `credentials: 'include'`，跨域情况下不会自动携带 cookie，导致登录态失效。

3. **token 已过期或状态与后端不一致**：localStorage 的用户信息只是前端存储，若 session 已失效、token 过期、cookie 被手动清理，前端以为有“已登录”信息但后端拒绝认证，请求接口就会 403。

4. **CSRF 校验失败**：有些后端对 POST/登录敏感接口做了 CSRF 校验，header/token 不对时也会 403。

**排查与修复建议：**
- 检查 fetch 是否正确带上了 Cookie（如需要跨域，必须加 `credentials: 'include'`）。
- 检查 localStorage 或 cookie 的登录态是否和服务端保持一致。
- 手动清除 localStorage 及 cookie，重新登录一次，观察是否能恢复正常。
- 检查后端日志确认 403 详细原因。

1. 在自动登录的 fetch 请求之后，判断 response.status 是否为 403。
2. 如果遇到 403，前端需要清理本地的登录信息（localStorage.removeItem('currentUser')，或清除 cookie），然后跳转回登录页。
3. 示例如下：

fetch('/api/v1/user/info', {
  method: 'GET',
  credentials: 'include'
})
  .then(response => {
    if (response.status === 403) {
      // 清除前端登录存储信息
      localStorage.removeItem('currentUser');
      document.cookie = 'currentUser=;expires=Thu, 01 Jan 1970 00:00:01 GMT;path=/';
      // 可根据需要加提示
      alert('登录状态已过期，请重新登录');
      // 跳回登录页
      window.location.href = './index.html';
      throw new Error('未登录或登录已失效');
    }
    return response.json();
  })
  .then(data => {
    // 根据 data 继续后续逻辑
  })
  .catch(err => {
    // 这里可根据需要处理其它异常
    console.error('自动登录失败:', err);
  });

4. 自动登录相关位置总结（例如页面 onload 或初始化检测登录态时）都应加上述 403 处理分支。

  credentials: 'include', // 重要！带上 cookie

  .then(resp => resp.json())

  });

【fetch 的使用方法说明】

1. fetch 是原生 JavaScript 用于发起 HTTP 请求获取数据的函数。其基本用法如下：

fetch(请求地址, 配置项)
  .then(response => response.json()) // 解析响应体为 JSON
  .then(data => {
    // 对 data 进行处理（data 是 JSON 解析出来的 JS 对象）
  })
  .catch(error => {
    // 处理网络异常等错误
  });

2. 参数和链式调用说明：
- 第一个参数：字符串类型，接口地址（如 '/api/v1/user/login'）。
- 配置项通常为对象，定义 method、headers、body 等（如 POST 请求时要加上 body 和 Content-Type）。

示例（以 POST 登录为例）：
fetch('/api/v1/user/login', {
  method: 'POST',
  headers: {'Content-Type': 'application/json'},
  body: JSON.stringify({account: 'abc', password: '123456'})
})
  .then(response => response.json()) // 将 Response 对象解析为 JS 对象
  .then(data => {
    // data 是后端返回的JSON对象，比如: {code: 0, msg: "成功", data: {...}}
    if (data.code === 0) {
      // 登录成功处理
    } else {
      // 登录失败逻辑
    }
  })
  .catch(err => {
    // 网络或接口异常处理
    alert('请求失败: ' + err);
  });

3. 链式 then 的顺序：
- 第一个 then 得到 Response 对象，用 response.json() 转成 JS 对象，返回 Promise。
- 第二个 then 的 data 参数就是已经解析好的 JS 数据对象。
- catch 用于捕获整个 Promise 链中的异常。

【注意点】
- fetch 只会 reject 网络级错误，对于 HTTP 状态码错误（比如 400、500 等）不会自动抛异常，需要在 then(response => ...) 里判断 response.ok 决定是否解析 response.json()。

<!-- 
fetch 的 then 用法以及两个 then 的先后关系说明：

1. then 的链式调用解析

fetch("接口地址")
  .then(response => response.json())
  .then(data => {
    // 这里处理 JSON 数据
  });

- 第一个 then（response => response.json()）的作用是将 fetch 返回的 Response 对象解析为 JSON 数据。即第一个 then 的返回值是一个 Promise，表示解析 JSON 的过程。
- 第二个 then（data => ...）是在第一个 then 完成并把 JSON 数据返回后接着执行的。此时 data 参数就是解析出来的 JS 对象。

2. 两个 then 的先后关系

- 它们是**顺序执行**的：第二个 then 必须等第一个 then 完成（即 response.json() 解析成功，并且返回了解析后的数据）之后，才会执行。
- 换句话说，第一个 then 的返回值会作为第二个 then 的输入参数。

3. 举例说明
fetch('/api/v1/user/login', {...})
  .then(response => response.json()) // 这一步把 Response 变成 JS 对象
  .then(data => {                   // data 是解析出来的内容
    // 只有等上一步成功解析了 JSON，这步才会运行
    if (data.code === 0) {
      // 成功逻辑
    } else {
      // 失败逻辑
    }
  });

因此：**then 是链式、顺序执行的，后一个 then 只有在前一个 then 成功完成后才会执行。**

setTimeout 用于设置一个延时任务，即让某一段代码在指定的等待时间（毫秒）之后再执行一次。

**用法示例：**
setTimeout(function() {
  // 这里写要延迟执行的代码
}, 2000); // 2000毫秒后执行（也就是2秒）

**参数说明：**
- 第一个参数：函数或字符串（推荐函数），代表到时要执行的代码。
- 第二个参数：延时的毫秒数（1秒=1000毫秒）。

**常见用途：**
- 页面动画的延后展示、弹窗的自动关闭，如：
  setTimeout(() => {
    modal.style.display = 'none';
  }, 1500);

- 表单提交成功后，延迟2秒跳转到首页
  setTimeout(() => {
    window.location.href = '/';
  }, 2000);

**注意点：**
- setTimeout 只会执行一次。如果想多次定时，请用 setInterval。
- 可以用 clearTimeout(timerId) 取消还未到时的定时任务。

**实际案例：**
展示“注册成功”2秒再关闭弹窗：
registerSuccess.style.display = 'block';
setTimeout(() => {
  registerModal.style.display = 'none';
}, 2000);

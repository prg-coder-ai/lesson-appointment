<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教师职业信息维护 - 语言教学预约系统</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f0f2f5; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 0 24px; height: 60px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; color: #722ed1; }
    .header-actions { display: flex; align-items: center; gap: 16px; }
    .user-info { display: flex; align-items: center; gap: 8px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #722ed1; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #f0f0f0; }
    .card-title { font-size: 16px; font-weight: 600; color: #333; display: flex; align-items: center; gap: 8px; }
    .card-body { padding: 16px 20px; }
    .btn { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; transition: opacity .2s; }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #722ed1; color: #fff; }
    .btn-success { background: #52c41a; color: #fff; }
    .btn-warning { background: #faad14; color: #fff; }
    .btn-danger { background: #f5222d; color: #fff; }
    .btn-default { background: #fff; color: #333; border: 1px solid #d9d9d9; }
    .header-btns { display: flex; gap: 8px; }

    /* 表单样式 */
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 4px; color: #333; font-size: 14px; font-weight: 500; }
    .form-group label .required { color: #f5222d; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 10px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; box-sizing: border-box; background: #fff; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #722ed1; }
    .form-group input[readonly], .form-group select[disabled], .form-group textarea[readonly] { background: #fafafa; color: #666; cursor: default; }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-row { display: flex; gap: 16px; }
    .form-row .form-group { flex: 1; }
    .sub-section { border: 1px solid #f0f0f0; border-radius: 6px; padding: 12px; margin-bottom: 14px; }
    .sub-section-title { font-weight: 600; color: #722ed1; margin-bottom: 8px; font-size: 14px; }
    .sub-item-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .sub-item-row input, .sub-item-row select { flex: 1; padding: 6px 8px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 13px; }
    .add-row-btn { background: #f0f0f0; border: 1px dashed #d9d9d9; padding: 6px; width: 100%; border-radius: 4px; cursor: pointer; color: #722ed1; }

    /* 只读视图样式 */
    .view-section { display: flex; flex-wrap: wrap; gap: 16px 24px; margin-bottom: 16px; }
    .view-field { flex: 1 1 240px; }
    .view-field .label { color: #999; font-size: 12px; margin-bottom: 4px; }
    .view-field .value { color: #333; font-size: 14px; word-break: break-all; }
    .view-photo { width: 120px; height: 120px; border-radius: 6px; object-fit: cover; background: #f0f0f0; }
    .status-active { color: #52c41a; }
    .status-frozen { color: #f5222d; }
    .status-inactive { color: #faad14; }

    .empty-tip { text-align: center; color: #999; padding: 40px 0; }
    .error-tip { text-align: center; color: #f5222d; padding: 40px 0; }
    .loading-tip { text-align: center; color: #999; padding: 40px 0; }

    /* === 图片上传与预览 === */
    /* 个人照片上传行：预览图 + 输入区横向排列 */
    .photo-upload-row { display: flex; gap: 12px; align-items: flex-start; }
    .photo-preview { width: 120px; height: 120px; border: 1px dashed #d9d9d9; border-radius: 6px; overflow: hidden; background: #fafafa; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .photo-preview-img { width: 100%; height: 100%; object-fit: cover; }
    .photo-inputs { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .photo-inputs input[type="text"] { width: 100%; padding: 8px 10px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; box-sizing: border-box; }

    /* 证书行缩略图 */
    .cert-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
    .cert-thumb { width: 50px; height: 50px; border: 1px dashed #d9d9d9; border-radius: 4px; overflow: hidden; background: #fafafa; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .cert-thumb-img { width: 100%; height: 100%; object-fit: cover; }

    /* 占位图（无图片时） */
    .photo-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 12px; }

    /* 查看模式 - 证书图片 */
    .cert-view-img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid #f0f0f0; }
  </style>
</head>
<body>
  <!-- 头部 -->
  <header class="header">
    <div class="logo">
      <i class="fa fa-chalkboard-teacher"></i>
      <span>教师职业信息维护</span>
    </div>
    <div class="header-actions">
      <div class="user-info">
        <div class="avatar" id="avatar">A</div>
        <span id="user-name">Admin</span>
      </div>

      <button class="btn btn-default" onclick="goBack()"><i class="fa fa-arrow-left"></i> 返回</button>
      <button class="btn btn-default" onclick="handleLogout()"><i class="fa fa-sign-out-alt"></i> 退出</button>
    </div>
  </header>

  <div class="container">
    <!-- 单条教师职业信息卡片 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title"><i class="fa fa-id-card"></i> <span id="page-title">教师职业信息</span></div>
        <div class="header-btns" id="action-btns">
           
          <!-- 查看模式：编辑 / 删除 -->
          <div id="btns-view" style="display:none;">
            <button class="btn btn-primary" onclick="enterEditMode()"><i class="fa fa-edit"></i> 编辑/新增</button>
            <button class="btn btn-danger" onclick="deleteCurrent()"><i class="fa fa-trash"></i> 删除</button>
          </div>
          <!-- 编辑模式：保存 / 取消 -->
          <div id="btns-edit" style="display:none;">
            <button class="btn btn-success" onclick="saveForm()"><i class="fa fa-save"></i> 保存</button>
            <button class="btn btn-default" onclick="cancelEdit()"><i class="fa fa-undo"></i> 取消</button>
          </div>
          <!-- 新增模式：保存 / 取消 -->
          <div id="btns-add" style="display:none;">
            <button class="btn btn-success" onclick="saveForm()"><i class="fa fa-save"></i> 保存</button>
            <button class="btn btn-default" onclick="goBack()"><i class="fa fa-times"></i> 取消</button>
          </div>
          <!-- 错误/加载模式：返回 -->
          <div id="btns-error" style="display:none;">
            <button class="btn btn-default" onclick="goBack()"><i class="fa fa-arrow-left"></i> 返回</button>
          </div>
        </div>
      </div>
      <div class="card-body" id="form-container">
        <div class="loading-tip">加载中...</div>
      </div>
    </div>
  </div>

  <!-- 依赖脚本（顺序：axios → utility_request → auth → api → 业务JS） -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/public/utility_request.js"></script>
  <script src="js/public/auth.js"></script>
  <script src="js/public/api.js"></script>
  <script src="js/teacherInfo.js"></script>
  <script>
    // 页面初始化
    (function init() {
      const user = getCurrentUserInfo();
      if (!user) {
        saveLoginRedirect && saveLoginRedirect('no-login');
        window.location.href = './index.html';
        return;
      }
      // 仅管理员可访问
      if (user.role !== 'admin') {
        document.querySelector('.container').innerHTML = '<div class="card"><div class="card-body empty-tip">仅管理员可访问本页面</div></div>';
        return;
      }
      // 设置头部用户信息
      if (user.name) {
        document.getElementById('avatar').innerHTML = user.name[0] || 'A';
        document.getElementById('user-name').innerHTML = user.name;
      }
      // 从 URL 读取 userid 并加载单条数据
      loadTeacherInfoFromUrl();
    })();

    function goBack() {
      // 优先返回来源页，没有则回到管理首页
      const from = new URLSearchParams(window.location.search).get('from');
      if (from) {
        window.location.href = from;
      } else if (document.referrer) {
        window.history.back();
      } else {
        window.location.href = './admin.html';
      }
    }
  </script>
</body>
</html>

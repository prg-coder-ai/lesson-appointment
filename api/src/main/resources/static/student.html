  <!-- 评价弹窗（默认隐藏） -->
  <div id="evaluation-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>评价<span data-term="course">课程</span></h3>
        <span class="modal-close" onclick="closeEvaluationModal()">×</span>
      </div>
      
      <div class="evaluation-form">
        <p style="margin-bottom: 10px; font-size: 14px;">请为<span data-term="course">课程</span>评分：</p>
        <div class="star-rating" id="star-rating">
          <span class="star active" onclick="selectStar(1)">★</span>
          <span class="star active" onclick="selectStar(2)">★</span>
          <span class="star active" onclick="selectStar(3)">★</span>
          <span class="star active" onclick="selectStar(4)">★</span>
          <span class="star active" onclick="selectStar(5)">★</span>
        </div>
        
        <p style="margin-bottom: 10px; font-size: 14px;">评价内容：</p>
        <textarea class="evaluation-textarea" placeholder="请输入您对该课程的评价（不少于10个字）"></textarea>
        
        <div style="display: flex; justify-content: flex-end; gap: 10px;">

  <script> 
    // 核心变量定义
    const menuItems = document.querySelectorAll('.menu-item');
    const pageTitle = document.querySelector('.page-title');
    const dynamicContentCenter = document.getElementById('dynamic-content-center');
    let currentMenuitem = 'today_course';

    /*function syncActiveMenu(menuName) {
      menuItems.forEach(menu => {
        menu.classList.toggle('active', menu.getAttribute('key') === menuName);
      });

    // 初始化页面（加载默认内容）
    window.onload = function() {
      // ====== 入口登录态守卫：校验 tenantCode / 角色一致性，不通过则跳登录页强制重新登录 ======
      if (typeof window.guardEntryPage === 'function' && !window.guardEntryPage('student')) {
        return; // 守卫已触发强制跳转
      }

      userInfo = autoLoginCheck();
      // ====== 新增：未登录 → 保存当前来源页 URL 后跳登录页 ======
      if (!userInfo) {
        undefined;
        if (typeof window.saveLoginRedirect === 'function') {
          window.saveLoginRedirect('noauth');
        }
        location.href = './index.html';
        return;
      }
       // 自动登录：检测本地登录信息并校验token有效性
      const nameid=document.getElementById("user-name");
       if(nameid) nameid.innerHTML= userInfo && userInfo.name;

       // 设置头像为用户名首字母
       const avatarElem = document.getElementById("avatar");
       if (avatarElem && userInfo && userInfo.name && userInfo.name.length > 0) {
         avatarElem.textContent = userInfo.name.charAt(0);
       }

      // ====== 深链参数解析 ======
      // URL 形如 student.html?scdid=12355&tid=xxx&sid=xxx
      // scdid=排期ID, tid=教师ID, sid=学生ID
      var dlParams = new URLSearchParams(window.location.search);
      var dlScdid = dlParams.get('scdid') || '';
      var dlTid   = dlParams.get('tid')   || '';
      var dlSid   = dlParams.get('sid')   || '';
      if (dlScdid || dlTid) {
        window.pendingDeepLink = { scdid: dlScdid, tid: dlTid, sid: dlSid };
        // 直接跳到"课程预订"菜单，不走默认的"今日课程"
        currentMenuitem = 'booking';
        pageTitle.textContent = '课程预订';
        // 同步侧边栏菜单高亮（按 key 属性）
        menuItems.forEach(function(menu) {
          menu.classList.toggle('active', menu.getAttribute('key') === 'booking');
        });
      }

       addChangePasswordButton();
       loadAdminPageContent(currentMenuitem);
      console.log('学生端页面加载完成');
    };

    // 1. 重构菜单点击响应逻辑（核心修复）
    menuItems.forEach(item => {
      item.addEventListener('click', function() {
        // 移除所有激活状态
        menuItems.forEach(menu => menu.classList.remove('active'));
        // 为当前点击项添加激活状态
        this.classList.add('active');
        // 更新页面标题
        const titleText = this.querySelector('span').textContent;
        pageTitle.textContent = titleText;
        // 按 menu-item 的 key 属性加载对应内容
        loadAdminPageContent(this.getAttribute('key'));
      });
    });

    // 2. 页面内容加载函数（统一管理所有菜单内容）
    function loadAdminPageContent(key) {
      // 清空原有内容
      dynamicContentCenter.innerHTML = '';
      if (typeof key === 'undefined' || key === null || (typeof key === 'string' && key.trim() === '')) {
         key = currentMenuitem;// '今日课程'
      }
      currentMenuitem = key;
      // 根据菜单 key 加载对应内容
      switch(key) {
        case 'today_course':
           refreshAppointmentNotes( );//TBD "admin"
      /*
        dynamicContentCenter.innerHTML = `
             <div class="table-container">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>序号</th>
                      <th  style="display:none;">预约ID</th>
                      <th><span data-term="course">课程</span>名称</th>
                      <th><span data-term="student">学生</span>姓名</th>
                      <th><span data-term="teacher">教师</span>姓名</th>
                      <th><span data-term="lessonTime">上课时间</span></th>
                      <th>状态</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="days-appointment-student">
                    
                  </tbody>
                </table>
              </div>
             `;
            //借用student页面内容，显示一致
             refreshAppointmentNotesForStudent("days-appointment-student" );
*/
           break;
        case 'booking': 
              renderStudentBookingCards(); 
          break;
          
        case 'my_booking': 
            renderStudentBookingBrowserCards(); //StudentBookingBrowserCards
            
          break;
          
        case 'course_review':
          dynamicContentCenter.innerHTML = `
            <div class="card" id="evaluation-card">
              <h3><i class="fa fa-star-half-o"></i> 我的<span data-term="course">课程</span>评价0待完成</h3>
              <div id="my-evaluations">
                <div class="course-card">
                  <div class="course-info">
                    <h4>英语初级口语 - <span data-term="classForm1p1">一对一</span></h4>
                    <p>授课教师：李老师 | 上课时间：2026-03-15 10:00</p>
                    <p>评分：★★★★★ | 评价时间：2026-03-15 11:00</p>
                    <p style="margin-top: 5px;">评价内容：李老师讲课非常细致，口语发音纠正很到位，收获很大！</p>
                  </div>
                  <div class="course-actions">
                    <button class="btn btn-gray" onclick="editEvaluation(this)">编辑评价</button>
                  </div>
                </div>
                <div class="course-card">
                  <div class="course-info">
                    <h4>日语入门</h4>
                    <p>授课教师：王老师 | 上课时间：2026-03-10 09:00</p>
                    <p>评分：★★★★☆ | 评价时间：2026-03-10 10:00</p>
                    <p style="margin-top: 5px;">评价内容：王老师的日语入门课很易懂，语法讲解清晰，推荐！</p>
                  </div>
                  <div class="course-actions">
                    <button class="btn btn-gray" onclick="editEvaluation(this)">编辑评价</button>
                  </div>
                </div>
              </div>
            </div>
          `;
          break;
          
        case 'profile':
          dynamicContentCenter.innerHTML = `
            <div class="card">
              <h3>个人信息 待完成</h3>
              <div style="margin-top: 15px; display: flex; gap: 20px;">
                <div style="width: 80px; height: 80px; border-radius: 50%; background-color: var(--primary-color); color: #fff; text-align: center; line-height: 80px; font-size: 32px;">张</div>
                <div style="flex: 1;">
                  <div style="margin-bottom: 10px;">
                    <span style="color: var(--text-light-color); width: 80px; display: inline-block;">姓名：</span>
                    <span>张三</span>
                  </div>
                  <div style="margin-bottom: 10px;">
                    <span style="color: var(--text-light-color); width: 80px; display: inline-block;">学号：</span>
                    <span>2026001</span>
                  </div>
                  <div style="margin-bottom: 10px;">
                    <span style="color: var(--text-light-color); width: 80px; display: inline-block;">电话：</span>
                    <span>13800138000</span>
                  </div>
                  <div style="margin-bottom: 10px;">
                    <span style="color: var(--text-light-color); width: 80px; display: inline-block;">已预约<span data-term="course">课程</span>：</span>
                    <span>8节</span>
                  </div>
                  <button class="btn btn-primary" style="margin-top: 10px;">编辑信息</button>
                </div>
              </div>
            </div>
            <div class="card">
              <h3>账号设置</h3>
              <div style="margin-top: 15px; padding: 0 20px 20px;">
                <div style="margin-bottom: 15px;">
                  <button class="btn btn-gray" style="width: 100%; text-align: left; padding: 10px 15px;">
                    <i class="fa fa-lock"></i> 修改密码
                  </button>
                </div>
                <div>
                  <button class="btn btn-gray" style="width: 100%; text-align: left; padding: 10px 15px;">
                    <i class="fa fa-bell"></i> 消息通知设置
                  </button>
                </div>
              </div>
            </div>
          `;
          break;
      }
    }
     // 评价弹窗相关函数（保留原有功能）
    let selectedStarCount = 5; // 默认5星
    function evaluateCourse(el) {
      document.getElementById('evaluation-modal').style.display = 'flex';
      // 重置评分
      selectedStarCount = 5;
      updateStarRating();
      // 清空文本框
      document.querySelector('.evaluation-textarea').value = '';
    }

    function closeEvaluationModal() {
      document.getElementById('evaluation-modal').style.display = 'none';
    }

    function selectStar(count) {
      selectedStarCount = count;
      updateStarRating();
    }

    function updateStarRating() {
      const stars = document.querySelectorAll('#star-rating .star');
      stars.forEach((star, index) => {
        if (index < selectedStarCount) {
          star.style.color = 'var(--orange-color)';
          star.classList.add('active');
        } else {
          star.style.color = '#ccc';
          star.classList.remove('active');
        }
      });
    }

    function submitEvaluation() {
      const evaluationContent = document.querySelector('.evaluation-textarea').value;
      if (evaluationContent.length < 10) {
        alert('评价内容不少于10个字！');
        return;
      }
      
      alert(`评价提交成功！\n评分：${selectedStarCount}星\n评价内容：${evaluationContent}`);
      closeEvaluationModal();
      // 可在此处调用API提交评价数据
    }

    // 我的预约相关函数（保留原有功能）
    function cancelReservation(el) {
      if (confirm('确定要取消该预约吗？取消后将无法恢复！')) {
        const courseCard = el.closest('.course-card');
        const statusText = courseCard.querySelector('.course-info p');
        statusText.innerHTML = statusText.innerHTML.replace('待确认', '已取消');
        el.textContent = '已取消';
        el.disabled = true;
        el.nextElementSibling.disabled = true;
        alert('预约已取消！');
      }
    }

    function viewMyReservationDetail(el) {
      const courseCard = el.closest('.course-card');
      const courseName = courseCard.querySelector('h4').textContent;
      const courseInfo = courseCard.querySelector('.course-info p').textContent;
      alert(`预约详情：\n课程名称：${courseName}\n${courseInfo}\n备注：请提前10分钟进入课堂`);
    }

    function editEvaluation(el) {
      evaluateCourse(el); // 复用评价弹窗
    }
  </script>

<!--
【语言教学预约系统-学生端使用说明】

1. 今日课程
   - 在“今日课程”栏目下，学生可以随时查看最近7天内即将上课的所有课程列表。
   - 包含课程名称、教师、上课时间、预约状态等信息。
   - 可直接进行上课通知确认、查看详情等操作。
   
2. 课程预订
   - 浏览可预约的课程与老师并进行预约操作。
   - 选择心仪的课程和排期时间后，点击预约即可发送预约请求。
   - 支持按课程、老师等条件筛选与搜索课程。
   
3. 我的预订
   - 展示本人已预约课程的详细信息列表（预约已完成/待确认/已取消/已完成等状态）。
   - 支持撤销预约、申请取消等操作。
   - 点击“查看详情”可查看每一条预约的课堂信息及排期明细。
   
4. 课程评价
   - 完成课程后，可对所上的课程进行评价和打分。
   - 点击“编辑评价”可修改已提交的评价内容。
   - 评价内容包含评分星级、评价文字等，便于教师持续改进教学。
   
5. 个人中心
   - 查看并管理个人基本信息与头像。
   - 部分信息仅作为展示，如需修改请联系管理员或教师。

6. 通用操作说明
   - 左侧菜单栏切换功能板块，当前功能高亮显示。
   - 所有重要操作会有确认提示弹窗，请仔细阅读提示信息。
   - 为保证顺利上课，请提前10分钟进入教室，并保持联系方式畅通。
   - 若遇到课程、排期、预约等疑问，可联系课程导师或管理员寻求帮助。

-->

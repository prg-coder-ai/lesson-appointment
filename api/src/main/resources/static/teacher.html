<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语言教学预约系统 - 教师端</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <!-- 引入教师端全局样式   -->
  <link rel="stylesheet" href="css/teacher.css">
  <link rel="stylesheet" href="css/scheduleTable.css">
  <!-- 引入图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- FullCalendar CSS -->
  <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css">

  <style>
    /* 新增头部样式，确保布局正常 */
   
  </style>
</head>
<body>
  <!-- 头部区域 -->
  <header class="header">
    <div class="logo">
      <img src="https://via.placeholder.com/40x40/52c41a/ffffff?text=教" alt="教师端logo">
      <span class="logo-text">语言教学预约系统（<span data-term="teacher">教师</span>端）</span>
    </div>
    <div class="header-actions">
      <div class="user-info" id="user_info">  
        <div class="avatar" id="avatar" >李</div>
        <span class="user-name" id="user-name">李老师</span>
      </div>
      <button class="btn btn-default" style="padding: 6px 12px;" onclick="handleLogout()">
        <i class="fa fa-sign-out-alt"></i> 退出
      </button>
    </div>
  </header>

  <!-- 布局容器 -->
  <div class="layout-container">
    <!-- 侧边栏 -->
    <aside class="sidebar"> 
      <div class="menu-group-title">我的工作台</div>
      <div class="menu-item">
        <i class="fa fa-home"></i>
        <span>今日<span data-term="course">课程</span></span>
      </div>  

      <div class="menu-group-title"><span data-term="course">课程</span>管理</div>
      <div class="menu-item">
        <i class="fa fa-book"></i>
        <span>我的<span data-term="course">课程</span></span>
      </div>
      <div class="menu-group-title">预订<span data-term="course">课程</span></div>
      <div class="menu-item">
        <i class="fa fa-calendar"></i>
        <span>预订管理</span>
      </div>
      <!-- div class="menu-item">
        <i class="fa fa-calendar-alt"></i>
        <span><span data-term="course">课程</span>通知</span>
      </div -->
      
      <!--
      <div class="menu-item">
        <i class="fa fa-star"></i>
        <span><span data-term="student">学生</span>评价</span>
      </div>
      
      <div class="menu-item">
        <i class="fa fa-user"></i>
        <span>个人中心</span>
      </div>
       -->
    </aside>

    <!-- 主内容区域 -->
    <div class="content-wrapper">
      
      <div class="content-header">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <h1 class="page-title" style="margin: 0;">今日<span data-term="course">课程</span></h1>
          <button class="btn btn-primary" onclick='refreshRightPage()'><i class="fa fa-refresh"></i> 刷新</button>
        </div>
      </div>
      <!-- 动态内容中央区域（核心修改：独立容器+居中样式） -->
      <div id="dynamic-content-center" class="dynamic-content-center">
        <!-- 初始加载我的工作台内容 -->
      </div>
    </div>
  </div>

  <!-- JavaScript交互逻辑 -->
  <script>
    // 侧边栏菜单切换逻辑
    const menuItems = document.querySelectorAll('.menu-item');
    const pageTitle = document.querySelector('.page-title');
    const dynamicContent = document.getElementById('dynamic-content-center'); // 指向正确的容器
    let currentMenuitem = '今日课程';

    // 页面初始化：加载默认的"我的工作台"内容
    window.onload = function() {

      window.renderTeacherCourseAndScheduleBrowserCards =renderTeacherCourseAndScheduleBrowserCards;
      window.renderStudentBookingBrowserCards  = renderStudentBookingBrowserCards ;  
      userInfo = autoLoginCheck();
      // ====== 新增：未登录 → 保存当前来源页 URL 后跳登录页 ======
      if (!userInfo) {
        console.log('%c[AuthRedirect] 调用点 D：teacher.html onload 检测到未登录，准备 saveLoginRedirect',
          'color:#dc2626;font-weight:bold;');
        if (typeof window.saveLoginRedirect === 'function') {
          window.saveLoginRedirect('noauth');
        }
        location.href = './index.html';
        return;
      }
      const nameid=document.getElementById("user-name");
       if(nameid)
         { nameid.innerHTML= userInfo.name;
         }
        //console.log(userInfo.name);
       // 设置头像元素为用户名首字母
       const avatarElem = document.getElementById("avatar");
       if (avatarElem && userInfo && userInfo.name && userInfo.name.length > 0) {
       // console.log( userInfo.name.charAt(0));
         avatarElem.innerHTML = userInfo.name.charAt(0);
       }
       addChangePasswordButton();
       loadAdminPageContent(currentMenuitem);
      console.log('教师端页面加载完成');  
    };

    menuItems.forEach(item => {
      item.addEventListener('click', function() {
        // 移除所有激活状态
        menuItems.forEach(menu => menu.classList.remove('active'));
        // 为当前点击项添加激活状态
        this.classList.add('active');
        // 更新页面标题
        const titleText = this.querySelector('span').textContent;
        pageTitle.textContent = titleText;
        
        // 加载对应页面内容
        loadAdminPageContent(titleText); 
      
      });
    });

    // 教师端页面内容加载逻辑（核心修复：指向正确的动态容器）
    function loadAdminPageContent(menuName) {
      // 清空原有内容
      dynamicContent.innerHTML = '';
      if(menuName=="") {
         menuName =currentMenuitem;// '我的工作台';
      }
      currentMenuitem = menuName;
      switch(menuName) {
        case '今日课程': 
           refreshAppointmentNotes( );//reused with "admin-appointmentNotes.js"
           
          //refreshOnedayAppointmentNotesForTeacher("oneday-appointment-teacher"); 
          break;
        case '我的课程':
          // 操作按钮事件 --checkout----set online =false TBD 
           // 兼容性 fallback: 尝试直接渲染（首次页面加载时）
          renderTeacherCourseAndScheduleBrowserCards(); //TeacherCourseAndScheduleBrowserCards.js
  
          break;
          case '课程通知': //列出7日课程内， 显示课程名称、教师、学生、时间、课程状态，操作：发送通知1、2、3           
          // 渲染数据总览面板
          refreshAppointmentNotes( );//as upper 
          
            break;
        case '预订管理': //booking
          //  renderTeacherBookingandAppointmentBrowserCards();  
         // 
          renderStudentBookingBrowserCards(); //StudentBookingBrowserCards.js
          break;
        case '学生评价':
          dynamicContent.innerHTML = `
            <div class="card">
              <h3 style="padding: 16px 20px; margin: 0; border-bottom: 1px solid var(--border-color);">最新评价</h3>
              <div style="margin-top: 15px; padding: 0 20px 20px;">
                <div style="padding: 15px; border-bottom: 1px solid var(--border-color);">
                  <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                    <span style="font-weight: 600;">张三</span>
                    <span style="color: #fa8c16;">★★★★★</span>
                  </div>
                  <p style="font-size: 14px; color: var(--text-color);">李老师讲课非常细致，口语发音纠正很到位，收获很大！</p>
                  <p style="font-size: 12px; color: var(--text-light-color); margin-top: 8px;">2026-03-18</p>
                </div>
                <div style="padding: 15px; border-bottom: 1px solid var(--border-color);">
                  <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                    <span style="font-weight: 600;">李四</span>
                    <span style="color: #fa8c16;">★★★★☆</span>
                  </div>
                  <p style="font-size: 14px; color: var(--text-color);">写作技巧讲解很实用，希望能多增加一些范文分析。</p>
                  <p style="font-size: 12px; color: var(--text-light-color); margin-top: 8px;">2026-03-15</p>
                </div>
              </div>
            </div>
          `;
          break;
        case '个人中心':
          dynamicContent.innerHTML = `
            <div class="card">
              <h3 style="padding: 16px 20px; margin: 0; border-bottom: 1px solid var(--border-color);">个人信息</h3>
              <div style="margin-top: 15px; padding: 0 20px 20px; display: flex; gap: 20px;">
                <div style="width: 80px; height: 80px; border-radius: 50%; background-color: var(--primary-color); color: #fff; text-align: center; line-height: 80px; font-size: 32px;">李</div>
                <div style="flex: 1;">
                  <div style="margin-bottom: 10px;">
                    <span style="color: var(--text-light-color); width: 80px; display: inline-block;">姓名：</span>
                    <span>李华</span>
                  </div>
                  <div style="margin-bottom: 10px;">
                    <span style="color: var(--text-light-color); width: 80px; display: inline-block;">教龄：</span>
                    <span>5年</span>
                  </div>
                  <div style="margin-bottom: 10px;">
                    <span style="color: var(--text-light-color); width: 80px; display: inline-block;">擅长：</span>
                    <span>英语口语、写作</span>
                  </div>
                  <div style="margin-bottom: 10px;">
                    <span style="color: var(--text-light-color); width: 80px; display: inline-block;">评分：</span>
                    <span style="color: #fa8c16;">4.9分</span>
                  </div>
                  <button class="btn btn-primary" style="margin-top: 10px;">编辑信息</button>
                </div>
              </div>
            </div>
            <div class="card">
              <h3 style="padding: 16px 20px; margin: 0; border-bottom: 1px solid var(--border-color);">账号设置</h3>
              <div style="margin-top: 15px; padding: 0 20px 20px;">
                <div style="margin-bottom: 15px;">
                  <button class="btn btn-gray" style="width: 100%; text-align: left; padding: 10px 15px;">
                    <i class="fa fa-lock"></i> 修改密码
                  </button>
                </div>
                <div>
                  <button class="btn btn-gray" style="width: 100%; text-align: left; padding: 10px 15px;">
                    <i class="fa fa-bell"></i> 消息通知设置
                  </button>
                </div>
              </div>
            </div>
          `;
          break;
      }
    }
  
  </script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>   
   <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
   
   <script src="js/public/terms.js"></script>
   <script src="js/public/termsFunction.js"></script>
   <script src="js/public/utility_request.js"></script>
   <script src="js/public/auth.js"></script> 
   <script src="js/public/api.js"></script> 
   <script src="js/public/dataFunctions.js"></script> 
   <script src="js/public/courseAndBooking.js"></script>  
   <script src="js/public/appointmentNotes.js"></script>  

   <script src="js/TeacherCourseAndScheduleBrowserCards.js"></script> //课程列表及排期查看
   <script src="js/StudentBookingCards.js"></script> //预订课程
   <script src="js/StudentBookingBrowserCards.js"></script> //预订列表及具体日程查看
   <!-- script src="js/teacher-course-booking-appointment.js"></script -->// 预订及日期
   <script src="js/admin-AppointmentNotes.js"></script>
   <script> 
      console.log("end of body...")
   </script>
</body>
</html>

<!--
【语言教学预约系统-教师端使用说明】

1. 今日课程
   - 在“今日课程”栏可查看自己近7天内即将开课的课程和排课列表。
   - 展示内容包括课程名称、学生姓名、上课时段、预约状态等。
   - 支持直接确认学生预约、拒绝预约或查看课程排课详情。
   - 点击“确认”可接受预约，点击“拒绝”将拒绝学生预约申请。

2. 我的课程
   - 展示自己所教授的全部课程列表和已排课情况。
   - 支持按课程名称搜索，快速定位并管理课程。
   - 可浏览课程简介、上课次数等课程信息。
   - 点击进入可查看具体课程下的所有排课和预约详情。

3. 预约管理
   - 集中管理所有收到的学生课程预约申请。
   - 显示预约人、预约时间、课程、当前状态等信息。
   - 对待确认的预约可进行【确认】或【拒绝】操作，已确认状态下可以发起“取消预约”。
   - 支持查看每个预约的详细信息和历史处理记录。

4. 课程评价
   - 可查看学生对自己课程的全部历史评价及评分。
   - 支持筛选课程和评价时间，便于教学反馈改进。
   - 点击“查看详情”可获得完整评价内容。

5. 个人中心
   - 查看与维护个人教师信息（如头像、姓名、联系方式）。
   - 仅部分字段可修改，如需更改不可编辑或重要信息请联系管理员。
   - 支持修改个人登录密码，增强账户安全。

6. 通用操作说明
   - 左侧菜单切换不同功能板块，当前活跃项高亮。
   - 教师端多数操作使用弹窗进行确认或编辑，务必关注弹窗提示。
   - 每个课时请提前10分钟进教室，按时授课，因故无法授课请及时处理。
   - 如遇系统问题、预约纠纷等可联系课程管理员协助处理。

-->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教师介绍</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <style>
    /* 仅本公开页的容器样式，static_html 自带完整页面样式 */
    html, body { margin: 0; padding: 0; height: 100%; background: #f0f2f5; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .pub-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .pub-topbar {
      height: 48px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.06);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; position: sticky; top: 0; z-index: 10;
    }
    .pub-topbar .brand { display: flex; align-items: center; gap: 8px; color: #722ed1; font-weight: 600; font-size: 15px; }
    .pub-topbar .brand i { font-size: 18px; }
    .pub-topbar .actions { display: flex; gap: 8px; }
    .pub-topbar .btn-mini {
      padding: 4px 10px; border-radius: 4px; border: 1px solid #d9d9d9; background: #fff;
      color: #333; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    }
    .pub-topbar .btn-mini:hover { border-color: #722ed1; color: #722ed1; }

    #pub-mount { flex: 1; }
    #pub-mount .publish-wrapper { margin: 0; } /* 内嵌页自带 .publish-wrapper，去除它自己的居中 margin */

    .pub-loading { display: flex; align-items: center; justify-content: center; height: 100%; color: #999; font-size: 14px; flex-direction: column; gap: 12px; padding: 60px 20px; }
    .pub-loading .spinner { width: 28px; height: 28px; border: 3px solid #e5e5e5; border-top-color: #722ed1; border-radius: 50%; animation: pub-spin 0.8s linear infinite; }
    @keyframes pub-spin { to { transform: rotate(360deg); } }

    .pub-error { display: flex; align-items: center; justify-content: center; height: 100%; color: #f5222d; font-size: 14px; flex-direction: column; gap: 12px; padding: 60px 20px; text-align: center; }
    .pub-error .icon { font-size: 36px; }
    .pub-error .hint { color: #999; font-size: 12px; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="pub-shell">
    <!-- 顶部条：品牌 + 打印/分享 -->
    <div class="pub-topbar">
      <div class="brand">
        <i class="fa fa-chalkboard-teacher"></i>
        <span>教师介绍</span>
      </div>
      <div class="actions">
        <button class="btn-mini" onclick="window.print()" title="打印本页"><i class="fa fa-print"></i> 打印</button>
        <button class="btn-mini" onclick="copyShareLink()" title="复制链接分享"><i class="fa fa-share-alt"></i> 复制链接</button>
        <button class="btn-mini" onclick="closePage()" title="关闭页面"><i class="fa fa-times"></i> 关闭</button>
      </div>
    </div>

    <!-- static_html 渲染挂载点 -->
    <div id="pub-mount">
      <div id="pub-loading" class="pub-loading">
        <div class="spinner"></div>
        <div>正在加载教师介绍...</div>
      </div>
      <div id="pub-error" class="pub-error" style="display:none;">
        <div class="icon"><i class="fa fa-exclamation-circle"></i></div>
        <div id="pub-error-msg">加载失败</div>
        <div class="hint">请检查链接是否正确，或稍后重试</div>
      </div>
    </div>
  </div>

  <script>
    /**
     * 教师介绍公开页
     * 入口参数（两种方式，优先级 id > teacherId）：
     *   ?id=xxxx              → 按 publishedProfileId 精确取指定历史版本（调 /public-get）
     *   ?teacherId=xxxx       → 取该教师最新已发布版本（调 /latest-public，兼容 userid/userId）
     * 流程：
     *   1. 从 URL 取 id / teacherId
     *   2. GET /teacher/published/public-get?id=xxx 或 latest-public?teacherId=xxx（无需登录）
     *   3. 接口返回 { code:200, data: { staticHtml: '<!DOCTYPE html>...' } }
     *   4. 把 staticHtml 直接 innerHTML 写入 #pub-mount（内嵌图片 base64 + 完整样式）
     *   5. 404 提示"该教师暂无已发布的个人介绍"
     */
    (function () {
      const API_BASE_URL = window.API_BASE_URL || '';

      function getQueryParam(name) {
        const m = new URLSearchParams(window.location.search);
        return m.get(name);
      }

      function showError(msg, hint) {
        const loading = document.getElementById('pub-loading');
        if (loading) loading.style.display = 'none';
        const errBox = document.getElementById('pub-error');
        const errMsg = document.getElementById('pub-error-msg');
        if (errMsg) errMsg.textContent = msg || '加载失败';
        if (hint) {
          const hintEl = errBox.querySelector('.hint');
          if (hintEl) hintEl.textContent = hint;
        }
        if (errBox) errBox.style.display = 'flex';
        document.title = msg || '教师介绍';
      }

      function mountStaticHtml(html) {
        const loading = document.getElementById('pub-loading');
        if (loading) loading.style.display = 'none';
        const mount = document.getElementById('pub-mount');
        if (!mount) return;
        // static_html 是一个完整的 <!DOCTYPE html>...</html> 文档
        // 取出 <body> 内的内容（保留其中的 <style> 和 DOM）插入到挂载点
        // 这样可以复用其内嵌样式，又不破坏当前页的顶部条
        let bodyContent = html;
        // 提取 <head> 中的 <style>（如果存在）
        const headStyleMatch = html.match(/<head[^>]*>([\s\S]*?)<\/head>/i);
        const styleTags = [];
        if (headStyleMatch) {
          const styleRegex = /<style[^>]*>([\s\S]*?)<\/style>/gi;
          let m;
          while ((m = styleRegex.exec(headStyleMatch[1])) !== null) {
            styleTags.push(m[0]);
          }
        }
        // 提取 <body> 内容
        const bodyMatch = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
        if (bodyMatch) {
          bodyContent = bodyMatch[1];
        } else {
          // 没有 body 标签，去掉 doctype/html/head 包裹
          bodyContent = html
            .replace(/<!DOCTYPE[^>]*>/i, '')
            .replace(/<\/?html[^>]*>/gi, '')
            .replace(/<head[^>]*>[\s\S]*?<\/head>/i, '')
            .replace(/<\/?body[^>]*>/gi, '');
        }

        // 尝试提取 <title> 更新本页标题
        const titleMatch = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
        if (titleMatch && titleMatch[1]) {
          document.title = titleMatch[1].trim();
        }

        mount.innerHTML = (styleTags.join('') || '') + bodyContent;
      }

      async function loadPublished() {
        const id = getQueryParam('id') || getQueryParam('profileId');
        const teacherId = getQueryParam('teacherId') || getQueryParam('userid') || getQueryParam('userId');
        if (!id && !teacherId) {
          showError('缺少参数', '请在 URL 上附加 ?id=xxxx 指定版本，或 ?teacherId=xxxx 查看最新发布');
          return;
        }

        let url;
        if (id) {
          url = API_BASE_URL + '/teacher/published/public-get?id=' + encodeURIComponent(id);
        } else {
          url = API_BASE_URL + '/teacher/published/latest-public?teacherId=' + encodeURIComponent(teacherId);
        }

        try {
          const resp = await fetch(url, {
            method: 'GET',
            headers: { 'Accept': 'application/json' }
          });

          // 后端统一返回：HTTP 200 + body{code,message,data}
          if (!resp.ok) {
            if (resp.status === 404) {
              showError('该教师暂无已发布的个人介绍', '请联系教师先在系统中发布个人介绍');
            } else if (resp.status === 401 || resp.status === 403) {
              showError('暂无访问权限', '请确认链接是否正确');
            } else {
              showError('加载失败（HTTP ' + resp.status + '）', '请稍后重试');
            }
            return;
          }

          const body = await resp.json();
          if (!body || body.code !== 200 || !body.data) {
            const msg = (body && body.message) || '暂无已发布的个人介绍';
            showError(msg, 'code=' + (body && body.code));
            return;
          }

          const data = body.data;
          const staticHtml = data.staticHtml;
          if (!staticHtml) {
            showError('该教师已发布信息，但静态内容为空', '请管理员重新发布一次');
            return;
          }
          mountStaticHtml(staticHtml);
        } catch (e) {
          console.error('加载教师介绍失败：', e);
          showError('网络异常，加载失败', e && e.message ? e.message : '请检查网络连接后刷新重试');
        }
      }

      function copyShareLink() {
        const link = window.location.href;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link).then(
            () => alert('链接已复制到剪贴板：\n' + link),
            () => fallbackCopy(link)
          );
        } else {
          fallbackCopy(link);
        }
      }
      function fallbackCopy(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          alert('链接已复制：\n' + text);
        } catch (_) {
          prompt('请手动复制链接：', text);
        }
      }

      function closePage() {
        // 优先尝试 window.close()（仅对由 window.open 打开的页面有效）
        try {
          window.opener = null;
          window.open('', '_self');
          window.close();
        } catch (_) {}
        // 100ms 后仍未关闭，说明是用户直接打开的 tab，做兜底
        setTimeout(function () {
          if (!window.closed) {
            // 有历史记录就后退
            if (window.history.length > 1) {
              window.history.back();
            } else {
              alert('当前页面是直接打开的，浏览器禁止脚本自动关闭。\n请按 Ctrl+W 手动关闭标签页，或点击浏览器右上角 × 按钮。');
            }
          }
        }, 120);
      }

      window.copyShareLink = copyShareLink;
      window.closePage = closePage;

      // 启动
      loadPublished();
    })();
  </script>
</body>
</html>

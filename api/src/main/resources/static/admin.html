      // 读取名为 currentUser 的 cookie值，并设置回 localStorage，避免用户刷新管理端丢失状态   
        function getCookie(name) {
          const matches = document.cookie.match(
            new RegExp('(?:^|; )' + name.replace(/([.$?*|{}()[\]\\/+^])/g, '\\$1') + '=([^;]*)')
          );
          return matches ? decodeURIComponent(matches[1]) : undefined;
        }

        // 从cookie读取currentUser，写回localStorage
        const cookieUser = getCookie('currentUser');
        if (cookieUser && !localStorage.getItem('currentUser')) {
          // 只在localStorage没有该项时写入，防止不必要覆盖
          localStorage.setItem('currentUser', cookieUser);
          // 也可考虑刷新时覆盖，直接写入都可

<!--
【语言教学预约系统-管理端使用说明】

1. 课程管理
   - 查看课程列表：在“课程管理”菜单下可浏览所有课程信息。
   - 新增课程：点击页面上的“新增课程”按钮，填写相关信息后保存。
   - 编辑课程：点击某课程右侧的“编辑”按钮，在弹出的窗口中进行课程信息修改并保存。
   - 删除课程：点击“删除”按钮并确认后，可移除对应课程。

2. 教师管理
   - 查看教师列表：可浏览教师基本资料及状态。
   - 新增教师：通过“新增教师”按钮创建新教师账号，并设置初始密码。
   - 编辑教师信息：点击“编辑”按钮修改教师资料。
   - 重置教师密码：点击“重置密码”为教师账号重置为默认密码（123456）。

3. 学生管理
   - 查看学生列表：支持查阅所有学生信息。
   - 新增/编辑/删除学生与操作教师类似。
   - 重置学生密码：同教师，通过“重置密码”功能恢复默认密码。

4. 课程排期管理
   - 管理员可在“课程排期”菜单下添加、修改和删除排课计划。
   - 选择课程和教师，设置上课时间、教室等安排。
   - 支持批量操作与高级排期筛选。

5. 预约管理
   - 浏览所有学生的课程预约情况，查看排课明细。
   - 审批或拒绝学生预约申请，支持快速查找与状态筛选。

6. 教师授课统计
   - 按月份、课程或教师统计各类授课数据。
   - 点击“刷新”可获取最新授课统计。
   - 结果可导出或打印，便于教务部门管理。

7. 课程反馈与评价
   - 查看学生提交的课程评价。
   - 可根据课程、教师、日期快速检索历史评价记录。
   - 支持对异常评价进行备注或标记。

8. 其它说明
   - 屏幕右上角“退出登录”用于安全退出后台系统。
   - 如有操作权限不足或页面异常，请联系系统管理员。
   - 页面大部分操作均通过弹窗进行交互，请注意弹窗中提示信息。



// 判断loadAdminPageContent函数是否已定义（用于页面内容加载和切换）
// if (window.loadAdminPageContent) {
   // 如果已存在，利用高阶函数包装原有处理逻辑
   // 这样“学生管理”对应点击时会执行自定义的renderStudentCards()，
   // 其他tab仍然调用原本的loadAdminPageContent
   /*
     语法结构详细分析：

     1. 这是一个自执行函数表达式（IIFE, Immediately Invoked Function Expression）。
        结构： (function(orig){ ... })(loadAdminPageContent)
        意思是声明一个接受orig参数的匿名函数，并立即用参数loadAdminPageContent调用它，将其返回值赋给loadAdminPageContent变量。

     2. 内部 return function(title) {...} 实际上返回一个新函数（同名覆盖全局的 loadAdminPageContent）。
        参数 title 代表导航栏点击的标题。

     3. 该函数体：
       - 先打印传入的 title 方便调试
       - 利用 if 判断，如果 title 等于 '学生管理'，则调用 renderStudentCards() —— 渲染学生管理页
       - 否则（其他 tab），调用 orig(title)，也就是原先的 loadAdminPageContent(title)，保留原有逻辑

     4. (function(orig){...})(loadAdminPageContent) 的意义是“闭包包装+增强”原有的 loadAdminPageContent，无缝扩展一个特殊分支。
 */ 
   -->

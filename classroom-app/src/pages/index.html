<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>云课堂 · 启动中</title>
  <style>
    html,body{margin:0;height:100%;background:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#1f2937}
    .boot{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px}
    .spinner{width:34px;height:34px;border:3px solid #d1d5db;border-top-color:#1f6feb;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .msg{font-size:14px;color:#6b7280}
    .err{color:#b91c1c;font-size:13px;max-width:80%;text-align:center;line-height:1.6}
  </style>
  <!-- classroom-app-injected -->
  <link rel="stylesheet" href="app.css">
  <script src="app-config.js"></script>
  <script src="app-bridge.js"></script>
  <script src="role-router.js"></script>
</head>
<body>
  <div class="boot">
    <div class="spinner"></div>
    <div class="msg" id="boot-msg">正在进入云课堂…</div>
    <div class="err" id="boot-err"></div>
  </div>
  <script>
    (function () {
      var cfg = window.APP_CONFIG || {};
      var msg = document.getElementById('boot-msg');
      var err = document.getElementById('boot-err');

      function go() {
        // 已登录 → 按角色跳对应工作台；未登录 → 登录页
        var info = window.RoleRouter ? window.RoleRouter.resolve() : { authenticated: false, target: 'login.html' };
        // server 模式：线上同源，登录页就是站点login；local 模式：本地login.html
        var target = info.authenticated ? info.target : 'login.html';
        if (msg) msg.textContent = info.authenticated ? '已进入 ' + (info.displayName || '') : '正在打开登录…';
        window.location.replace(target);
      }

      // 短延迟让桥接层的双基址覆盖先 install 完成
      try { msg.textContent = '正在初始化…'; } catch (e) {}
      setTimeout(go, 60);
    })();
  </script>
</body>
</html>

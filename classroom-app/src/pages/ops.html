<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>轻运营 · 巡课与分发</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/classroom.css">
  <link rel="stylesheet" href="app.css">
  <style>
    body { margin:0; background:var(--bg-page,#f5f7fa); color:var(--text-main,#1f2937);
      font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; padding-bottom:60px; }
    .wrap { max-width:720px; margin:0 auto; padding:16px; }
    .bar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .bar h1 { font-size:18px; margin:0; font-weight:500; }
    .btn { border:1px solid #d1d5db; background:#fff; color:#374151; padding:7px 14px; border-radius:8px;
      font-size:13px; cursor:pointer; }
    .btn:hover { border-color:#1f6feb; color:#1f6feb; }
    .btn.danger { color:#b91c1c; border-color:#fca5a5; }
    .mcard { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:14px 16px; margin-bottom:10px; }
    .mtop { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .mtop b { font-weight:500; font-size:15px; }
    .badge { font-size:12px; color:#1d9e75; background:#e1f5ee; padding:2px 8px; border-radius:10px; }
    .mmeta { color:#6b7280; font-size:12px; margin:6px 0 12px; }
    .mops { display:flex; gap:8px; flex-wrap:wrap; }
    .mops button { border:1px solid #d1d5db; background:#fff; color:#374151; padding:6px 12px;
      border-radius:7px; font-size:12px; cursor:pointer; }
    .mops button.danger { color:#b91c1c; border-color:#fca5a5; }
    .loading, .empty { color:#9ca3af; text-align:center; padding:32px 0; font-size:13px; }
    .toast { position:relative; margin:0 0 12px; padding:10px 14px; border-radius:8px; font-size:13px; }
    .toast.ok { background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }
    .toast.bad { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
    #notice-panel { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:16px; margin-top:18px; }
    #notice-panel h2 { font-size:15px; margin:0 0 12px; font-weight:500; }
    .field { margin-bottom:10px; }
    .field label { display:block; font-size:12px; color:#6b7280; margin-bottom:4px; }
    .field input, .field textarea { width:100%; box-sizing:border-box; border:1px solid #d1d5db;
      border-radius:8px; padding:9px 10px; font:14px/1.5 inherit; }
    .field textarea { min-height:76px; resize:vertical; }
    .acts { display:flex; gap:8px; justify-content:flex-end; }
    .note { color:#9ca3af; font-size:12px; margin-top:14px; }
  </style>
  <script src="js/public/vendor/axios.min.js"></script>
  <script src="js/public/utility_request.js"></script>
  <script src="js/public/api.js"></script>
  <script src="js/public/feature-flags.js"></script>
  <script src="js/shared-domain-bridge.js"></script>
  <script src="app-config.js"></script>
  <script src="app-bridge.js"></script>
  <script src="app-env.js"></script>
  <script src="app-unread.js"></script>
  <script src="app-entry-guard.js"></script>
  <script src="ops-lite.js"></script>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>轻运营 · 巡课与分发</h1>
    <button class="btn" id="op-refresh">刷新</button>
  </div>

  <div id="op-toast" class="toast" style="display:none"></div>

  <div id="monitor-list"><div class="loading">加载中…</div></div>

  <div id="notice-panel" style="display:none">
    <h2>发通知 / 链接分发</h2>
    <div class="field">
      <label>课次标识（scheduleId）</label>
      <input id="notice-sid" type="text" readonly>
    </div>
    <div class="field">
      <label>通知内容</label>
      <textarea id="notice-text" placeholder="例如：课堂已开始，请尽快进入"></textarea>
    </div>
    <div class="acts">
      <button class="btn" id="notice-cancel">取消</button>
      <button class="btn" id="notice-send">发送</button>
    </div>
  </div>

  <div class="note">
    仅管理员 / 平台管理员可用（后端强制校验 isManager）。本页只含巡课、强制结课、链接分发三件套；
    报表、对账、审核、租户配置等重后台功能保留在网页后台。
  </div>
</div>
</body>
</html>

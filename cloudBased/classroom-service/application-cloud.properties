# ==============================================================================
# classroom-service 云托管 profile —— 覆盖本地默认
# 关键点：serverTimezone=Asia/Shanghai；库名 classroom
# ==============================================================================

# ---------- 数据库 ----------
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:classroom}?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true

# ---------- 跨 schema 只读（课堂守卫）----------
# classroom-service 除本库 classroom 外，还需「只读」访问主业务库 lesson_appointment 的
# sys_tenant_eclassroom 表（校验租户是否启用课堂）。查询走全限定表名，故部署必须满足：
#   1) classroom-service 与 booking-api 连接「同一个 MySQL 实例」（MYSQL_HOST/MYSQL_PORT 必须一致）；
#   2) classroom-service 使用的数据库账号对 lesson_appointment 库具备 SELECT 权限；
#   3) 主业务库名固定为 lesson_appointment（与 cloudBased/api/application-cloud.properties 的
#      MYSQL_DB 默认值一致）。若云环境改用其它库名，需同步修改：
#      api/classroom-service/.../entity/TenantEclassroom.java 与 mapper/TenantEclassroomMapper.java
#      中硬编码的全限定表名。
classroom.cross-schema.tenant-schema=${MYSQL_TENANT_SCHEMA:lesson_appointment}

# ---------- 端口 ----------
server.port=8092

# ---------- 日志级别 ----------
logging.level.root=INFO
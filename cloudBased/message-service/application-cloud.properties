# ==============================================================================
# message-service 云托管 profile —— 覆盖本地默认
# 关键点：serverTimezone=UTC → Asia/Shanghai；库名 message_center
# ==============================================================================

# ---------- 时区统一 ----------
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:message_center}?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true

# ---------- 端口 ----------
server.port=8090

# ---------- 日志级别 ----------
logging.level.root=INFO

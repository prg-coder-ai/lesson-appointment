# ==============================================================================
# message-service 云托管 profile —— 覆盖本地默认
# 关键点：serverTimezone=UTC → Asia/Shanghai；库名 message_center
# ==============================================================================

# ---------- 时区统一 ----------
# ★ characterEncoding 必须是 Java 字符集名 UTF-8（写 utf8mb4 会抛
#   "Unsupported character encoding 'utf8mb4'"，见 api 侧同类事故 2026-11-08）
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:message_center}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true

# ---------- 端口 ----------
server.port=8090

# ---------- 日志级别 ----------
logging.level.root=INFO

# ==============================================================================
# 云托管部署专用 profile —— 覆盖 application.properties 的本地默认值
# 加载方式：Dockerfile 入口加 --spring.profiles.active=cloud
# 本地默认值里与云托管不兼容的主要有两处：
#   1. serverTimezone=UTC → 必须覆盖为 Asia/Shanghai（容器 TZ=Asia/Shanghai + 库端 serverTimezone 三者统一）
#   2. 数据源地址从 localhost:3306 改成从环境变量 SPRING_DATASOURCE_URL 注入（见 cloudBased/env/.env.api.example）
# ==============================================================================

# ---------- 时区统一（手册 4.2 节强制项） ----------
# application.properties 写的是 serverTimezone=UTC，云托管必须覆盖
# ★ characterEncoding 必须是 Java 字符集名 UTF-8，写 utf8mb4 会导致
#   "Unsupported character encoding 'utf8mb4'"（Java 无此 charset 名，2026-11-08 线上事故）
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:lesson_appointment}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true

# ---------- 端口不变 ----------
server.port=8081

# ---------- 日志级别 ----------
logging.level.root=INFO

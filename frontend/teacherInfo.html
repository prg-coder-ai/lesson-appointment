  <!-- 依赖脚本（顺序：axios → terms → request → auth → api → 业务JS）
       特别注意：api.js 必须早于 teacherInfo*.js —— 后者用到的 escapeHtml/escapeAttr/
       pageUrl/goBack/getCurrentUserInfo 均由它提供。 -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/public/terms.js"></script>
  <script src="js/public/termsFunction.js"></script>
  <script src="js/public/documentTitle.js"></script>
  <script src="js/public/enumTerms.js"></script>
  <script src="js/public/utility_request.js"></script>
  <script src="js/public/auth.js"></script>
  <script src="js/public/api.js"></script>
  <script src="js/teacherInfo-common.js"></script>
  <script src="js/teacherInfo-edit.js"></script>
  <script src="js/teacherInfo-publish.js"></script>
  <script src="js/teacherInfo.js"></script>
  <script>
    // 页面初始化
    (function init() {
      // ====== 入口登录态守卫：校验 tenantCode / 角色一致性，不通过则跳登录页 ======
      if (typeof window.guardEntryPage === 'function' && !window.guardEntryPage('admin')) {
        return; // 守卫已触发强制跳转
      }

      const user = getCurrentUserInfo();
      if (!user) {
        if (typeof window.saveLoginRedirect === 'function') {
          window.saveLoginRedirect('no-login');
        }
        // 必须保留 tCode：否则登录页拿不到租户编码，登录后回不到本页
        window.location.href = (typeof window.pageUrl === 'function')
          ? window.pageUrl('index.html')
          : './index.html';
        return;
      }
      // 仅租户管理员可访问。
      // 平台管理员虽然同为管理员，但它是跨租户管理账号、不属于任何租户，
      // 无法落入 TenantLineInnerInterceptor 的租户数据隔离范围，
      // 即便放行也取不到本租户的教师数据，故同样拒绝 —— 但给出区别于「无权限」的明确指引。
      if (user.role !== 'admin') {
        const tip = (user.role === 'platform_admin')
          ? '平台管理员为跨租户管理账号，不能直接管理单个租户的教师资料，请返回平台后台操作'
          : '仅管理员可访问本页面';
        document.querySelector('.container').innerHTML = '<div class="card"><div class="card-body empty-tip">' + tip + '</div></div>';
        return;
      }
      // 按登录租户所属行业切换行业词表（尽早发起，使后续渲染直接用上正确的行业词）
      if (typeof syncIndustryFromTenant === 'function') {
        syncIndustryFromTenant(user.tenantCode);
      }
      // 设置头部用户信息
      if (user.name) {
        document.getElementById('avatar').innerHTML = user.name[0] || 'A';
        document.getElementById('user-name').innerHTML = user.name;
      }
      // 静态骨架里的 data-term 交由 applyTerms 统一替换
      if (typeof applyTerms === 'function') applyTerms(document.body);
      // 从 URL 读取 userid 并加载单条数据
      loadTeacherInfoFromUrl();
      installLinkCopyAndImageSaveHandlers();
    })();
  </script>

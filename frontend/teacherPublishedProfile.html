  <style>

<body data-page-node-id="e5iKbhrUVbdUc2HYH6A7YA">

  <script>
    /**
     * 教师介绍公开页（免登录）
     *
     * 迁移说明（2026-09-10）：本页随 teacherInfo.html 一同在「前后端分离」提交中被删除、
     * 未迁入 frontend，导致管理端「复制链接/发布」给出的公开链接 404。本次一并迁回。
     *
     * 入口参数（优先级 id > teacherId）：
     *   ?id=xxxx        → 按 publishedProfileId 精确取指定历史版本（/public-get）
     *   ?teacherId=xxxx → 取该教师最新已发布版本（/latest-public，兼容 userid/userId）
     * 注意：对外分享链接刻意不带 tCode（免登录页无法也不需要租户编码）。
     */
    (function () {
      // 本页不加载 api.js（免登录），window.API_BASE_URL 默认为空，
      // 必须自行补 /api/v1 前缀，否则请求会被 Nginx 当成静态资源返回 404。
      var RAW_BASE = (typeof window.API_BASE_URL === 'string' && window.API_BASE_URL) ? window.API_BASE_URL : '';
      var API_PREFIX = (RAW_BASE.indexOf('/api/v1') >= 0) ? RAW_BASE : '/api/v1';

      function getQueryParam(name) {
        try {
          return new URLSearchParams(window.location.search).get(name);
        } catch (e) {
          return null;
        }
      }

      // 取当前行业下"教师"词；termsFunction.js 在本 IIFE 之后才解析，故用 typeof 守卫
      function teacherWord() {
        return (typeof termText === 'function') ? termText('teacher') : '教师';
      }

      function showError(msg, hint) {
        const loading = document.getElementById('pub-loading');
        if (loading) loading.style.display = 'none';
        const errBox = document.getElementById('pub-error');
        const errMsg = document.getElementById('pub-error-msg');
        if (errMsg) errMsg.textContent = msg || '加载失败';
        if (hint && errBox) {
          const hintEl = errBox.querySelector('.hint');
          if (hintEl) hintEl.textContent = hint;
        }
        if (errBox) errBox.style.display = 'flex';
        // 错误态标题也随行业词走，与顶部条 data-term="teacher" 保持一致
        document.title = msg || (teacherWord() + '介绍');
      }

      function mountStaticHtml(html) {
        const loading = document.getElementById('pub-loading');
        if (loading) loading.style.display = 'none';
        const mount = document.getElementById('pub-mount');
        if (!mount) return;
        // staticHtml 是一个完整的 <!DOCTYPE html>...</html> 文档
        // 取出 <body> 内的内容（保留其中的 <style> 和 DOM）插入挂载点，既复用其内嵌样式又不破坏顶部条
        const styleTags = [];
        const headStyleMatch = html.match(/<head[^>]*>([\s\S]*?)<\/head>/i);
        if (headStyleMatch) {
          const styleRegex = /<style[^>]*>([\s\S]*?)<\/style>/gi;
          let m;
          while ((m = styleRegex.exec(headStyleMatch[1])) !== null) {
            styleTags.push(m[0]);
          }
        }
        let bodyContent = html;
        const bodyMatch = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
        if (bodyMatch) {
          bodyContent = bodyMatch[1];
        } else {
          // 没有 body 标签，去掉 doctype/html/head 包裹
          bodyContent = html
            .replace(/<!DOCTYPE[^>]*>/i, '')
            .replace(/<\/?html[^>]*>/gi, '')
            .replace(/<head[^>]*>[\s\S]*?<\/head>/i, '')
            .replace(/<\/?body[^>]*>/gi, '');
        }

        // 尝试提取 <title> 更新本页标题
        const titleMatch = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
        if (titleMatch && titleMatch[1]) {
          document.title = titleMatch[1].trim();
        }

        mount.innerHTML = (styleTags.join('') || '') + bodyContent;
      }

      async function loadPublished() {
        const id = getQueryParam('id') || getQueryParam('profileId');
        const teacherId = getQueryParam('teacherId') || getQueryParam('userid') || getQueryParam('userId');
        if (!id && !teacherId) {
          showError('缺少参数', '请在 URL 上附加 ?id=xxxx 指定版本，或 ?teacherId=xxxx 查看最新发布');
          return;
        }

        let url;
        if (id) {
          url = API_PREFIX + '/teacher/published/public-get?id=' + encodeURIComponent(id);
        } else {
          url = API_PREFIX + '/teacher/published/latest-public?teacherId=' + encodeURIComponent(teacherId);
        }

        try {
          const resp = await fetch(url, {
            method: 'GET',
            headers: { 'Accept': 'application/json' }
          });

          // 后端统一返回：HTTP 200 + body{code,message,data}
          if (!resp.ok) {
            if (resp.status === 404) {
              showError(teacherWord() + '暂无已发布的个人介绍', '请联系' + teacherWord() + '先在系统中发布个人介绍');
            } else if (resp.status === 401 || resp.status === 403) {
              showError('暂无访问权限', '请确认链接是否正确');
            } else {
              showError('加载失败（HTTP ' + resp.status + '）', '请稍后重试');
            }
            return;
          }

          const body = await resp.json();
          if (!body || body.code !== 200 || !body.data) {
            const msg = (body && body.message) || '暂无已发布的个人介绍';
            showError(msg, 'code=' + (body && body.code));
            return;
          }

          const data = body.data;
          const staticHtml = data.staticHtml;
          if (!staticHtml) {
            showError('该教师已发布信息，但静态内容为空', '请管理员重新发布一次');
            return;
          }
          mountStaticHtml(staticHtml);
        } catch (e) {
          console.error('加载教师介绍失败：', e);
          showError('网络异常，加载失败', e && e.message ? e.message : '请检查网络连接后刷新重试');
        }
      }

      function fallbackCopy(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          alert('链接已复制：\n' + text);
        } catch (_) {
          prompt('请手动复制链接：', text);
        }
      }

      function copyShareLink() {
        const link = window.location.href;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link).then(
            () => alert('链接已复制到剪贴板：\n' + link),
            () => fallbackCopy(link)
          );
        } else {
          fallbackCopy(link);
        }
      }

      function closePage() {
        // 优先尝试 window.close()（仅对由 window.open 打开的页面有效）
        try {
          window.opener = null;
          window.open('', '_self');
          window.close();
        } catch (_) {}
        // 100ms 后仍未关闭，说明是用户直接打开的 tab，做兜底
        setTimeout(function () {
          if (!window.closed) {
            if (window.history.length > 1) {
              window.history.back();
            } else {
              alert('当前页面是直接打开的，浏览器禁止脚本自动关闭。\n请按 Ctrl+W 手动关闭标签页，或点击浏览器右上角 × 按钮。');
            }
          }
        }, 120);
      }

      window.copyShareLink = copyShareLink;
      window.closePage = closePage;

      // 启动
      loadPublished();
    })();
  </script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-term-title="{lessonSystem} - 课程详情">语言教学预约系统 - 课程详情</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="js/public/vendor/font-awesome/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #f0f2f5; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #222; }
    .cd-topbar { height: 52px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.06); display: flex; align-items: center; padding: 0 16px; position: sticky; top: 0; z-index: 10; gap: 12px; }
    .cd-topbar .brand { color: #722ed1; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .cd-topbar .back { margin-left: auto; padding: 6px 14px; border: 1px solid #d9d9d9; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; color: #333; text-decoration: none; }
    .cd-topbar .back:hover { border-color: #722ed1; color: #722ed1; }
    .cd-wrap { max-width: 860px; margin: 20px auto; padding: 0 16px; }
    .cd-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 20px; margin-bottom: 18px; }
    .cd-card h3 { margin: 0 0 14px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .cd-cover { width: 100%; height: 220px; border-radius: 8px; object-fit: cover; background: #eef; display: flex; align-items: center; justify-content: center; color: #722ed1; font-size: 40px; margin-bottom: 16px; }
    .cd-name { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    .cd-content { font-size: 14px; line-height: 1.7; color: #555; white-space: pre-wrap; }
    .cd-tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .cd-tag { font-size: 12px; color: #722ed1; background: #f3eaff; border: 1px solid #e3d2ff; border-radius: 10px; padding: 2px 10px; }
    .cd-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .cd-chip { font-size: 11px; color: #555; background: #f5f5f5; border: 1px solid #eee; border-radius: 10px; padding: 2px 8px; }
    .cd-props { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 13px; color: #888; }
    .cd-props b { color: #333; }
    .cd-link { color: #722ed1; text-decoration: none; font-size: 14px; }
    .cd-link:hover { text-decoration: underline; }
    .cd-sched { border-bottom: 1px solid #f0f0f0; padding: 12px 0; display: flex; align-items: center; justify-content: space-between; }
    .cd-sched:last-child { border-bottom: none; }
    .cd-sched .when { font-size: 14px; }
    .cd-sched .when .d { font-weight: 600; }
    .cd-sched .when .t { color: #888; margin-left: 8px; }
    .cd-btn { padding: 6px 16px; border-radius: 4px; border: none; background: #722ed1; color: #fff; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; }
    .cd-btn:hover { background: #5b23c0; }
    .cd-empty { text-align: center; color: #999; padding: 30px 0; font-size: 14px; }
    .cd-error { text-align: center; color: #f5222d; padding: 40px 0; font-size: 15px; }
  </style>
</head>
<body>
  <div class="cd-topbar">
    <span class="brand"><i class="fa fa-graduation-cap"></i> <span data-term="lessonSystem">语言教学预约系统</span></span>
    <a class="back" id="cd-back" href="javascript:void(0)"><i class="fa fa-arrow-left"></i> 返回</a>
  </div>
  <div class="cd-wrap">
    <div class="cd-card" id="cd-mount"><div class="cd-empty">加载中…</div></div>
    <div class="cd-card" id="cd-teacher-card" style="display:none;">
      <h3><i class="fa fa-user-tie"></i> <span data-term="teacher">教师</span>信息</h3>
      <div id="cd-teacher"></div>
    </div>
    <div class="cd-card" id="cd-schedule-card">
      <h3><i class="fa fa-calendar-alt"></i> 排期</h3>
      <div id="cd-schedule"><div class="cd-empty">加载中…</div></div>
    </div>
  </div>

  <script src="js/public/vendor/axios.min.js"></script>
  <script src="js/public/shared-domain-bridge.js"></script>
  <script src="js/public/termsFunction.js"></script>
  <script src="js/public/documentTitle.js"></script>
  <script src="js/public/enumTerms.js"></script>
  <script src="js/public/workLanguage.js"></script>
  <script src="js/public/utility_request.js"></script>
  <script src="js/public/pagefoot.js"></script>
  <script src="js/public/auth.js"></script>
  <script src="js/public/api.js"></script>
  <script src="js/public/ui-kit.js"></script>
  <script src="js/public/dataFunctions.js"></script>
  <script src="js/public/courseAndBooking.js"></script>
  <script src="js/course-detail.js"></script>
</body>
</html>

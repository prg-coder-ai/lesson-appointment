  <script>

  /**
   * 通用：在新标签页打开指定页面，如已打开则切换到该标签
   * @param {string} pageUrl - 页面URL，如 'logBrowser.html'
   * @param {string} channelName - BroadcastChannel 频道名，如 'logBrowser-channel'
   */
  function openPageInTab(pageUrl, channelName) {
    var bc = new BroadcastChannel(channelName);
    var responded = false;
    bc.onmessage = function(ev) {
      if (ev.data === 'pong') responded = true;
    };
    bc.postMessage('ping');
    setTimeout(function() {
      if (!responded) {
        window.open(pageUrl, '_blank');
      }
      bc.close();
    }, 300);
  }

    // 管理端页面内容加载逻辑（核心修改：渲染到中央区域）
    function loadAdminPageContent(key) {
      // 清空中央内容区
      dynamicContentCenter = document.getElementById('dynamic-content-center');
      if(dynamicContentCenter)
      dynamicContentCenter.innerHTML = '';
      // 如果 key 没有定义或者为空，则默认加载“数据总览”
      if (typeof key === 'undefined' || key === null || (typeof key === 'string' && key.trim() === '')) {
        key = 'overview';
      }
      switch(key) {
        // ===== 租户管理员菜单（按 menu-item 的 key 字段分支） =====
        case "overview":
          refreshOverallpage();//admin-overall.js
          break;
        case "course_template":
          if (typeof renderTemplateCards === 'function') renderTemplateCards();//admin-template.js
          break;
        case "booking_audit":
          if (typeof renderBookingCards === 'function') renderBookingCards();//admin-booking.js 预订审核
          break;
        case "teacher":
          renderTeacherCards("teacher");//admin-user.js

        case "student":
          renderTeacherCards("student");//admin-user.js

        case "course_list":
          renderCourseCards();//admin-course.js
          break;
        case "schedule":

          break;
        case "lesson_notice":
          refreshAppointmentNotes();//admin-AppointmentNotes.js 上课通知

        case "messages":
          if (typeof window.renderMessagesPage === 'function') {

          }

        case "data_maintain":

          }

        case "audit_log":

        formContainer = document.getElementById('formContainer');

      // 读取名为 currentUser 的 cookie值，并设置回 localStorage，避免用户刷新管理端丢失状态   
        function getCookie(name) {
          const matches = document.cookie.match(
            new RegExp('(?:^|; )' + name.replace(/([.$?*|{}()[\]\\/+^])/g, '\\$1') + '=([^;]*)')
          );
          return matches ? decodeURIComponent(matches[1]) : undefined;
        }

        // 从cookie读取currentUser，写回localStorage
        const cookieUser = getCookie('currentUser');
        if (cookieUser && !localStorage.getItem('currentUser')) {
          // 只在localStorage没有该项时写入，防止不必要覆盖
          localStorage.setItem('currentUser', cookieUser);
          // 也可考虑刷新时覆盖，直接写入都可

======================= 生产部署步骤和方法 =======================

本项目基于Spring Boot构建，部署流程较为标准。以下是详细的生产部署指南：

1. **环境准备**
   - 确认服务器已安装合适版本的JDK（如JDK 1.8及以上，版本需与pom.xml的<java.version>一致）。
   - 配置数据库（如MySQL）。确认数据库已创建并正确配置application.properties中的连接信息。
   - （推荐）安装Nginx或Apache，用于反向代理和静态资源分发。

2. **配置修改**
   - 检查`src/main/resources/application.properties`中的生产环境配置（如数据库用户名、密码、端口、JWT密钥等），确保安全且与生产环境匹配。
   - 配置`server.port`为生产环境需要暴露的端口，如80、8080等。
   - 关闭Thymeleaf缓存关闭设置（spring.thymeleaf.cache=true）以提升生产性能。

3. **打包项目**
   - 使用Maven在项目根目录下执行打包命令：
     ```
     mvn clean package -Pprod
     ```
     或（如无prod profile，直接）：
     ```
     mvn clean package
     ```
   - 打包后会生成形如`api-1.0.0-SNAPSHOT.jar`的可执行JAR包，位于`target/`目录下。

4. **部署至服务器**
   - 上传生成的JAR包至生产服务器指定目录。
   - 同步`application.properties`等必要配置文件到服务器，保持配置一致或根据需要单独维护环境变量和配置。

5. **运行项目**
   - 通过以下命令在后台启动应用（示例端口如8081，实际以配置为准）：
     ```
     nohup java -jar api-1.0.0-SNAPSHOT.jar --spring.profiles.active=prod > app.log 2>&1 &
     ```
   - 建议使用`systemctl`、`supervisor`或`pm2`等进程管理工具实现自动重启、日志管理和故障恢复。

6. **配置Nginx反向代理（可选，推荐）**
   - 典型配置片段（假设后端8081，前端静态页面由Spring Boot管理或另有CDN）：
     ```
     server {
         listen 80;
         server_name example.com;

         location / {
             proxy_pass http://localhost:8081/;
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
         }
         # 可加静态资源缓存、404等配置
     }
     ```
   - 重新加载Nginx配置：`nginx -s reload`。

7. **安全与优化建议**
   - 配置防火墙，仅允许必要端口（如80/443/8081）。
   - 数据库等敏感配置文件限制权限。
   - 若有SSL证书，升级Nginx到HTTPS服务。
   - 定期备份代码、数据和配置文件。

8. **应用监控与日志**
   - 查看日志（如`tail -f app.log`）跟踪启动及运行情况。
   - 建议集成Prometheus、Grafana，或者Spring Boot Admin、ELK等监控解决方案。

9. **升级与回滚**
   - 升级时先备份旧JAR和配置。
   - 停止旧进程（`kill`或`systemctl stop`），替换JAR后重启。
   - 如有紧急问题，回退到原JAR并重启应用。

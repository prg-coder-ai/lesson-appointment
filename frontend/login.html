  <script> 
    // DOM元素获取（登录相关）

    // 错误提示元素（登录）
   // const roleError = document.getElementById('role-error');
    const usernameError = document.getElementById('username-error');
    const passwordError = document.getElementById('password-error');
    const loginError = document.getElementById('login-error');

    // 新增：注册相关DOM元素
    const registerModal = document.getElementById('register-modal');
    const showRegister = document.getElementById('show-register');
    const closeModal = document.getElementById('close-modal');
    const cancelRegister = document.getElementById('cancel-register');
    const registerForm = document.getElementById('register-form');
    const registerRole = document.getElementById('register-role');
    const registerUsername = document.getElementById('register-username');
    const registerName = document.getElementById('register-name');

     var   registerEmail ="";// document.getElementById('register-email');
     var   registerPhone =""; //document.getElementById('register-phone');
      var registerAccount="";
    const registerPassword = document.getElementById('register-password');
    const registerConfirmPwd = document.getElementById('register-confirm-pwd');
    const registerBtn = document.getElementById('register-btn');
    
    // 注册错误/成功提示
    const registerRoleError = document.getElementById('register-role-error');
    const registerUsernameError = document.getElementById('register-username-error');
    const registerNameError = document.getElementById('register-name-error');
     const registerPasswordError = document.getElementById('register-password-error');
    const registerConfirmError = document.getElementById('register-confirm-error');
    const registerSuccess = document.getElementById('register-success');
    const registerError = document.getElementById('register-error');
   

    // 表单验证函数（登录）
    function validateForm() {
      let isValid = true;
      
      // 重置所有错误提示
      //roleError.style.display = 'none';

      passwordError.style.display = 'none';
      loginError.style.display = 'none';

      // 验证身份选择
    //  if (!userRole.value) {
    //    roleError.style.display = 'block';
    //    isValid = false;
     // }

      // 验证账号
      if (!username.value.trim()) {

      }
   
      // 验证密码

      }

    }

    // 新增：注册表单验证函数
    async function validateRegisterForm() {
      let isValid = true;
      
      // 重置所有提示
      registerRoleError.style.display = 'none';
      registerUsernameError.style.display = 'none';
      registerNameError.style.display = 'none';
      registerPasswordError.style.display = 'none';
      registerConfirmError.style.display = 'none';
      tenantError.style.display = 'none';
      registerSuccess.style.display = 'none';
      registerError.style.display = 'none';

      // 验证身份
      if (!registerRole.value) {
        registerRoleError.style.display = 'block';
        isValid = false;
      }

      // 验证租户编码：后端要求注册时携带，缺失会返回 403
      if (!tenantCodeInput.value.trim()) {
        tenantError.textContent = '请输入租户编码';
        tenantError.style.display = 'block';
        isValid = false;
      }

      // 验证账号
      if (!registerUsername.value.trim()) {
        registerUsernameError.style.display = 'block';
        isValid = false;
      } else {
        // 账号格式校验（邮箱或电话号码）
        // 【修改】新增：根据输入内容判断是邮箱还是电话号码，并进行相应格式校验
        // 账号包含"@"符号，判断为邮箱，否则判断为电话号码 
        if (registerUsername.value.includes("@")) {
           //判断为邮箱，检查是否合规
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(registerUsername.value.trim())) {
          registerUsernameError.textContent = '请输入有效的邮箱地址';
          registerUsernameError.style.display = 'block';
          isValid = false;
      }else {
          registerEmail = registerUsername.value.trim();
          registerAccount = registerEmail;
          registerPhone = "";
        }
    }else{
        registerEmail="";
        const phonePattern = /^[\d-]{1,30}$/;
        if (!phonePattern.test(registerUsername.value.trim())) {
          registerUsernameError.textContent = '请输入有效的电话号码（最多30位，仅限数字和“-”分隔符）';
          registerUsernameError.style.display = 'block';
          isValid = false;
        } else {
          registerPhone = registerUsername.value.trim();
          registerAccount = registerPhone;
        }
      }
      if(isValid)
       { // 检查账号是否已存在  
        const isExist = await toCheckAccountExists(registerAccount);
        if (isExist) { 
          isValid = false; 
          registerUsernameError.textContent = '账号已存在';
          registerUsernameError.style.display = 'block';
        }
      }
    } 

      // 验证真实姓名
      if (!registerName.value.trim()) {
        registerNameError.style.display = 'block';
        isValid = false;
      }
            

      // 验证密码
      if (!registerPassword.value.trim()) {
        registerPasswordError.style.display = 'block';
        isValid = false;
      }

      // 验证确认密码
      if (registerConfirmPwd.value.trim() !== registerPassword.value.trim()) {
        registerConfirmError.style.display = 'block';
        isValid = false;
      }

      return isValid;
    }

   // 利用后端 "/account/exist" 检查账号是否已经存在
   // 该函数会对输入账号发起GET请求，返回Promise<boolean>
   async function toCheckAccountExists(registerAccount) {
     if (!registerAccount) return false;
     try {
       // 调用后端接口 GET /user/account/exist?account=xxx
       // request 拦截器在 code=200 时直接返回 res.data，此处即 Boolean
       const existed = await request({
         url: '/user/account/exist',
         method: 'GET',
         params: { account: registerAccount.trim() },
         customErrorMsg: false // 异常由本函数自行提示，不弹窗
       });
       return !!existed;
     } catch (e) {
       // 后端不可达时保守视为"未占用"，避免阻塞注册；控制台记录便于排查
       console.warn('账号存在性校验失败，视为未占用：', e);
       return false;
     }
   }
    // 新增：提交注册申请（直接使用 request 封装，无伪异步）
    async function submitRegister() {
      // 1. 先跑表单校验（含账号存在性、密码等）；失败直接返回
      const valid = await validateRegisterForm();
      if (!valid) return Promise.resolve(false);

      // 2. 构造注册信息 —— 后端 @RequestBody User 实体字段严格对齐
      const role = registerRole.value.trim();
      const account = (registerAccount || '').trim();
      const tenantCode = document.getElementById('tenant-code').value.trim();
      const registerInfo = {
        role: role,
        account: account,
        email: (registerEmail || '').trim() || null,   // null 不进库时不会触发唯一键
        phone: (registerPhone || '').trim() || null,
        name: registerName.value.trim() || null,        // 学生注册时 name 可空
        password: registerPassword.value.trim(),
        status: 'pending'   ,                           // 修正拼写：原 pendding(3d) -> pending(2d)，与后端一致
        tenantCode: tenantCode // 新增：租户编码
      };
        
      
      try {
        // 3. 使用 request 发起 POST：URL 已通过拦截器 baseURL 自动拼接
        //    后端路径：POST /user/{student|teacher}/register
        const resultData = await request({
          url: `/user/register`,
          method: 'POST',
          data: registerInfo,
          customErrorMsg: false // 我们自己统一处理错误信息（400/网络/异常），避免重复弹窗
        });

        // 4. 注册成功：显示后端返回的 message（若有）
        registerError.style.display = 'none';
        registerSuccess.style.display = 'block';
        // request 拦截器 code=200 时只返回 res.data（Map：{userId,account,token,role}）
        // 所以 message 需从 localStorage 暂存或用默认文案；此处给用户友好提示
        registerSuccess.textContent = '注册成功，请等待管理员审核，即将跳转登录页...';

        // 5. 保存登录态：currentUser（完整用户信息） + token/refreshToken
        //    后端 Register 接口返回不含 refreshToken（只有 token），这里与登录返回对齐
        const currentUser = {
          userId:  resultData.userId,
          account: resultData.account,
          role:    resultData.role,
          token:   resultData.token,
          name:    registerInfo.name || '',
          tenantCode: registerInfo.tenantCode || '' // 新增：租户编码
        };
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        // token 单独保存：utility_request.js 请求拦截器从 localStorage.getItem('token') 取
        if (resultData.token) {
          localStorage.setItem('token', resultData.token);
        }
        // 注册接口暂未返回 refreshToken，留空避免刷新逻辑误判
        localStorage.removeItem('refreshToken');

        // 6. 写入 Cookie（2小时），保持当前逻辑
        try {
          const d = new Date();
          d.setTime(d.getTime() + (2 * 60 * 60 * 1000));
          document.cookie = `currentUser=${encodeURIComponent(JSON.stringify(currentUser))};expires=${d.toUTCString()};path=/`;
        } catch (e) {
          console.warn('写入cookie失败（不影响核心流程）：', e);
        }

        // 7. 2秒后关闭弹窗，并【重定向到登录界面】
        //    —— 注册账号需管理员审核（status=pending），故跳转登录页而非直接进入角色首页；
        //    —— 跳转 URL 必须带上 tCode=注册时的租户编码，使登录页自动隐藏/锁定到该租户入口
        //       （applyTcodeToLogin / applyTenantCodeRule 均按此参数生效）；
        //    —— 同时把注册租户编码持久化到 localStorage，便于后续访问 index 时回显与复用。
        setTimeout(() => {
          registerModal.style.display = 'none';
          resetRegisterForm();
          // 【修订】保存注册时的租户编码
          const regTenantCode = (registerInfo.tenantCode || '').trim() || 'default';
          try {
            localStorage.setItem('lastRegisterTenantCode', regTenantCode);
          } catch (e) {
            console.warn('保存注册租户编码失败（不影响跳转）：', e);
          }
          // 重定向到登录界面，URL 地址栏包含 tCode=注册时的租户编码（参数名与 getTenantCodeFromUrl 约定一致）
          // registered=1：告知登录页「本次是注册后的跳转」，须停留在登录表单，
          //              不要被「已登录自动跳工作台」逻辑立刻弹走（否则想看登录框却被弹到角色首页）。
          const loginUrl = './login.html?tCode=' + encodeURIComponent(regTenantCode) + '&registered=1';
          window.location.assign(loginUrl);
        }, 2000);

        return true;
      } catch (error) {
        // ---- 8. 错误分支：分场景给出精确提示 ----
        console.error('注册请求出错：', error);
        registerSuccess.style.display = 'none';
        registerError.style.display = 'block';

        // request 拦截器对非200：return Promise.reject(res)，res 结构为 {code,message,data}
        const code = error && error.code;
        const msg  = error && (error.message || error.msg);

        if (code === 400) {
          // 后端 existAccount -> "该账号已注册，请登录或重置密码"
          registerError.textContent = msg || '该账号已存在，请更换账号或登录';
           } else if (code === 401  ) {
          registerError.textContent = ' 请先登录'; 
        } else if ( code === 403) {
          registerError.textContent = '无权访问，请联系管理员';
        } else if (code === 500) {
          registerError.textContent = '服务器内部错误，请稍后重试';
        } else if (typeof error === 'string' && error.includes('超时')) {
          registerError.textContent = error;
        } else if (typeof error === 'string' && error.includes('网络连接失败')) {
          registerError.textContent = '网络连接失败，请检查后端服务是否启动（端口8081）';
        } else if (msg) {
          registerError.textContent = msg;
        } else {
          registerError.textContent = '注册失败，请检查网络或稍后重试';
        }
        return false;
      }
    }

    // 【修改】租户编码规则（注册时归属哪个租户）
    //   1) 选择「平台管理员」→ 自动填 platform 并锁定输入框
    //   2) 页面 URL 带 ?tcode=xx → 采用该值并锁定（租户专属注册链接）
    //   3) 其余情况 → 由用户手动填写
    const tenantCodeInput = document.getElementById('tenant-code');
    const tenantError = document.getElementById('tenant-error');
    // 必须与后端 RoleConst.PLATFORM_ADMIN 一致（下划线）
    const PLATFORM_ROLE = 'platform_admin';
    const DEFAULT_TENANT_CODE = 'default';
    const PLATFORM_TENANT_CODE = 'platform';

    /** 读取 URL 参数 ?tcode=xx */
    function getTenantCodeFromUrl() {
      // 兼容「?tCode =tenant_A」（参数名带空格）：手动按 '&' 解析，再复用清洗逻辑
      var raw = '';
      var pairs = (window.location.search || '').replace(/^\?/, '').split('&');
      for (var i = 0; i < pairs.length; i++) {
        if (!pairs[i]) continue;
        var eq = pairs[i].indexOf('=');
        var k = eq === -1 ? pairs[i] : pairs[i].slice(0, eq);
        var v = eq === -1 ? '' : pairs[i].slice(eq + 1);
        if (decodeURIComponent(k).trim().toLowerCase() === 'tcode') { raw = decodeURIComponent(v); break; }
      }
      // 复用与早期脚本一致的清洗逻辑，防止嵌套 tCode（?tCode=tCode=XXX）污染注册/登录表单
      return (typeof window.sanitizeTenantCode === 'function') ? window.sanitizeTenantCode(raw) : (raw && raw.trim() ? raw.trim() : '');
    }

    /**
     * 「上次到访的租户编码」本地缓存键（与 teacherPublishedProfile.html 同名约定）。
     * 教师公开页会把 URL 上的 tCode 记到此键：分享链接本身刻意不带 tCode，
     * 访客若曾从落地页（带 tCode）进过任一公开页，再来登录时就能自动预填，
     * 免去「家长不知道租户编码」的卡点；仍保持可编辑，换租户不受影响。
     */
    const REMEMBERED_TENANT_CODE_KEY = 'lastTenantCode';

    /** 读本地记住的租户编码（platform 是跨租户账号标识，不作为租户预填值） */
    function getRememberedTenantCode() {
      try {
        var v = String(window.localStorage.getItem(REMEMBERED_TENANT_CODE_KEY) || '').trim();
        return (v && v !== PLATFORM_TENANT_CODE) ? v : '';
      } catch (e) { return ''; }
    }

    /** 按角色与 URL 参数决定租户编码及其可编辑状态 */
    function applyTenantCodeRule() {
      const urlCode = getTenantCodeFromUrl();
      const tcFormItem = tenantCodeInput.closest('.form-item');
      if (urlCode) {
        tenantCodeInput.value = urlCode;
        tenantCodeInput.readOnly = true;
        if (urlCode === PLATFORM_TENANT_CODE) {
          registerRole.value = PLATFORM_ROLE;
          // platform 专属链接：租户编码仍展示并锁定为 platform
          tcFormItem.style.display = '';
        } else {
          // tcode 非 platform：隐藏「租户编码」标签与编辑框（已由专属链接代入，无需用户填写）
          tcFormItem.style.display = 'none';
          // 租户专属链接下平台管理员选项不可见
          // 注意：HTMLSelectElement.options 是 HTMLOptionsCollection，既没有 Array 的 findIndex，
          // 其自身也没有 remove 方法（remove 定义在 <select> 元素上）。故用 select.remove(index)。
          const roleSelect = document.getElementById('register-role');
          const roleOptions = roleSelect.options;
          let platformRoleIndex = -1;
          for (let i = 0; i < roleOptions.length; i++) {
            if (roleOptions[i].value === PLATFORM_ROLE) {
              platformRoleIndex = i;
              break;
            }
          }
          if (platformRoleIndex !== -1) {
            roleSelect.remove(platformRoleIndex);
          }
        }
        return;
      }

      // 无 tcode：恢复可见可编辑
      tcFormItem.style.display = '';
      if (registerRole.value === PLATFORM_ROLE) {
        tenantCodeInput.value = PLATFORM_TENANT_CODE;
        tenantCodeInput.readOnly = true;
        return;
      }
      // 其他情况：由用户手动填写；若本浏览器曾到访过某租户的公开页，先预填该编码省一次输入
      tenantCodeInput.value = getRememberedTenantCode() || DEFAULT_TENANT_CODE;
      tenantCodeInput.readOnly = false;
    }

    /**
     * 登录身份联动（镜像注册页 applyTenantCodeRule 的逻辑）

     * - 租户端：优先取 URL ?tcode=，否则由用户手动填写
     */
    function applyLoginTenantRule() {
      const roleSel = document.getElementById('login-role');
      const tcInput = document.getElementById('login-tenant-code');
      const urlCode = getTenantCodeFromUrl();
      if (roleSel.value === PLATFORM_ROLE) {

      } else if (urlCode) {
        tcInput.value = urlCode;
        tcInput.readOnly = true;
      } else {
        tcInput.value = '';
        tcInput.readOnly = false;
      }
    }

    /**

     * 无 tcode 时恢复两项默认可见、可填。

    function applyTcodeToLogin() {

      const roleSel = document.getElementById('login-role');
      const tcInput = document.getElementById('login-tenant-code');
      const roleItem = roleSel.closest('.form-item');

        roleItem.style.display = '';
        tcItem.style.display = '';
        roleSel.value = '';

        // 免去家长从分享链接进来时「不知道租户编码怎么写」的卡点
        tcInput.value = getRememberedTenantCode();
        tcInput.readOnly = false;
      }
    }

  /**
   * 读取并校验 URL 上的 redirect 参数：登录成功后要回到的页内地址。
   *
   * 用途（2026-09-28）：未登录访客在教师公开页（teacherPublishedProfile.html）点「排期/预约」时，
   * 由该页跳来本页并带上 redirect=booking.html?scdid=xxx；登录成功后直达该排期，
   * 而不是把人扔进角色工作台让他自己再找一遍。
   *
   * 安全（防开放重定向）：只接受同源地址 —— 'booking.html?x=1' / './booking.html' /
   * '/booking.html' / 同源绝对地址；拒绝 '//evil.com'、其它域名、以及 javascript:/data: 等伪协议。
   */
  function getUrlRedirectTarget() {
    var raw = '';
    try {
      raw = new URLSearchParams(window.location.search).get('redirect') || '';
    } catch (e) {
      return '';
    }
    raw = String(raw).trim();
    if (!raw) return '';
    // 伪协议（javascript:/data:/vbscript:）直接拒绝；http(s) 交给下一步同源校验
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(raw) && !/^https?:/i.test(raw)) return '';
    var a = document.createElement('a');
    a.href = raw;
    if (a.origin !== window.location.origin) return '';   // 跨域一律拒绝
    var target = (a.pathname || '') + (a.search || '') + (a.hash || '');
    // 兜底：解析结果必须落在某个页面文件上，避免 redirect= 空值/目录造成异常跳转
    if (!/\.html(\?|#|$)/i.test(target)) return '';
    return target;
  }

  window.onload = function() {
      // ?registered=1：由注册成功后的跳转带来。此时必须停留在登录表单，
      // 否则下面的「已登录自动跳转」会立刻把用户弹到角色首页，注册后的登录提示形同虚设。
      var justRegistered = false;
      try {
        justRegistered = new URLSearchParams(window.location.search).get('registered') === '1';
      } catch (e) {}
      // redirect 优先于「按角色进工作台」：公开页点「排期」→ 去登录 → 回该排期。
      //
      // 但回跳必须加【已登录】前提（2026-09-28 修）：
      //   未登录时若立即回跳 redirect，目标页（如 booking.html）的入口守卫
      //   guardEntryPage → forceEntryLogin 会把人再弹回 login.html，而那条路径
      //   只带 tCode、不带 redirect（api.js 里消费 auth_redirect_info 的分支也已被注释），
      //   于是「登录后回到原排期」的意图在中转途中被吞掉，用户最终落在工作台。
      //   正确顺序：未登录 → 停在登录表单（租户编码已按 tCode 锁定）→ 登录成功后再回跳。
      var urlRedirect = getUrlRedirectTarget();
      var __hasToken = false;
      try { __hasToken = !!localStorage.getItem('token'); } catch (e) {}
      if (!justRegistered && urlRedirect && __hasToken) {
        window.location.href = urlRedirect;
        return;
      }
      // 已登录用户直接进入对应角色工作台，避免停留在登录框（登录页自身不是 401 兜底环的一环）
      if (!justRegistered && __hasToken) {
        try {
          var __cu = JSON.parse(localStorage.getItem('currentUser') || 'null');
          if (__cu && __cu.role) { redirectToUserPage(__cu); return; }
        } catch (e) {}
      }
      // 页面加载时套用租户编码规则：URL 带 ?tcode=xx 时自动填充并锁定
      applyTenantCodeRule();
      // 登录界面 tcode 专属链接：隐藏身份与租户编码并锁定为 tcode 对应值
      applyTcodeToLogin();
      // 注册后跳回：给一条绿色成功提示，引导用户用刚注册的账号登录
      if (justRegistered) {
        var el = document.getElementById('login-error');
        if (el) {
          el.style.display = 'block';
          el.style.color = 'green';
          el.textContent = '注册成功，请使用刚注册的账号登录（账号需管理员审核后方可正常使用）';
        }
      }
  };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">协议与政策</title>
  <style>
    :root {
      --primary: #722ed1;
      --text: #1f2a44;
      --weak: #6b7587;
      --line: #ebeef5;
      --bg: #f5f7fa;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    .legal-header {
      position: sticky; top: 0; z-index: 10;
      background: #fff; border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    }
    .legal-title { font-size: 18px; font-weight: 600; margin-right: auto; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .seg button {
      border: none; background: #fff; color: var(--weak);
      padding: 6px 14px; font-size: 14px; cursor: pointer;
    }
    .seg button.active { background: var(--primary); color: #fff; }
    .close-btn {
      border: 1px solid var(--line); background: #fff; color: var(--text);
      padding: 6px 14px; font-size: 14px; border-radius: 8px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .close-btn:hover { background: var(--bg); }
    /* 语言选择暂不显示（默认中文） */
    #lang-seg { display: none; }
    .legal-main {
      max-width: 860px; margin: 24px auto; padding: 32px 36px;
      background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.06);
      min-height: 50vh;
    }
    .doc-title { font-size: 22px; font-weight: 700; text-align: center; margin: 0 0 6px; }
    .doc-meta { text-align: center; color: var(--weak); font-size: 13px; margin-bottom: 24px; }
    .doc-content { font-size: 15px; color: #2c3650; }
    .doc-content h1, .doc-content h2, .doc-content h3 { color: var(--text); }
    .doc-content p { margin: 10px 0; }
    .doc-content ul, .doc-content ol { padding-left: 22px; }
    .doc-content table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    .doc-content th, .doc-content td { border: 1px solid var(--line); padding: 8px 10px; }
    .legal-state { text-align: center; color: var(--weak); padding: 60px 20px; font-size: 15px; }
    .legal-state.error { color: #f5222d; }
    .legal-footer { text-align: center; color: var(--weak); font-size: 12px; padding: 20px; }
    .close-btn {
      border: 1px solid var(--line); background: #fff; color: var(--weak);
      padding: 6px 14px; font-size: 14px; cursor: pointer; border-radius: 8px;
    }
    .close-btn:hover { color: var(--text); border-color: #d9d9d9; }
    @media (max-width: 640px) {
      .legal-main { margin: 12px; padding: 20px; }
      .legal-title { width: 100%; margin-bottom: 4px; }
    }
  </style>
</head>
<body>
  <div class="legal-header">
    
    <span class="legal-title" id="brand">协议与政策</span>
    <button class="close-btn" id="close-btn">关闭</button>
    <div class="seg" id="type-seg">
      <button data-type="user_agreement">用户协议</button>
      <button data-type="privacy_policy">隐私政策</button>
    </div>
    <!-- 语言选择暂不显示，默认中文；后续多语言启用时移除此注释 -->
    <!--
      <button data-lang="zh">中文</button>
      <button data-lang="en">English</button>
      <button data-lang="fr">Français</button>
    </div> 
    -->
    <button class="close-btn" id="close-btn" title="返回">← 返回</button>
  </div>

  <main class="legal-main">
    <h1 class="doc-title" id="doc-title" style="display:none;"></h1>
    <div class="doc-meta" id="doc-meta" style="display:none;"></div>
    <div class="doc-content" id="doc-content"></div>
    <div class="legal-state" id="state">加载中…</div>
  </main>

  <div class="legal-footer" id="footer">本页面内容由平台或您所属机构发布，仅供参考。如与正式签署文本不一致，以平台留存版本为准。</div>

  <script>
    (function () {
      var PARAMS = new URLSearchParams(location.search);
      var type = PARAMS.get('type') || 'user_agreement';
      var lang = 'zh'; // 暂不提供语言切换，强制默认中文
      var tenant = PARAMS.get('tenant') || '';
      // 统一 API 前缀：裸路径 + 前缀拼接，避免散落硬编码完整 /api/v1 端点（守卫约定）
      var API_BASE = '/api/v1';

      var TYPES = {
        user_agreement: '用户协议',
        privacy_policy: '隐私政策',
        user_agreement_template: '用户协议（平台参考模板）',
        privacy_policy_template: '隐私政策（平台参考模板）'
      };
      var LANGS = { zh: '中文', en: 'English', fr: 'Français' };

      // 启发式检测：content 是 HTML 还是 Markdown
      // 检测特征：存在明显的 HTML 标签对或 DOCTYPE/注释
      function looksLikeHtml(text) {
        if (!text) return false;
        var s = text.trim();
        if (s.indexOf('<!DOCTYPE') === 0 || s.indexOf('<!--') === 0) return true;
        // 匹配开始标签（<tag 或 </tag），tag 必须是字母
        return /<\/?[a-zA-Z][a-zA-Z0-9-]*(?:\s[^>]*)?>/.test(s);
      }

      // ---------- 极简 Markdown → HTML 渲染器 ----------
      // 仅覆盖协议文本常用语法：标题、段落、粗/斜体、链接、无序列表、有序列表、换行、代码
      // 设计原则：安全优先（不引入任何外部库，不执行任意代码），不追求 markdown 全特性
      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str == null ? '' : String(str);
        return div.innerHTML;
      }

      function renderMarkdown(text) {
        if (!text) return '';
        var lines = text.replace(/\r\n?/g, '\n').split('\n');
        var out = [];
        var i = 0;
        var inUl = false, inOl = false;
        function closeLists() {
          if (inUl) { out.push('</ul>'); inUl = false; }
          if (inOl) { out.push('</ol>'); inOl = false; }
        }
        function fmtInline(line) {
          // 先 escape HTML，再做 markdown 内联替换
          var s = escapeHtml(line);
          // 行内代码 `code`
          s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
          // 链接 [text](url)
          s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
          // 粗体 **text**
          s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
          // 斜体 *text*（注意不要吞掉 bullet 的 *，前提是前后都是非空白）
          s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
          return s;
        }
        while (i < lines.length) {
          var line = lines[i];
          // 空行：关闭列表
          if (!line.trim()) { closeLists(); i++; continue; }
          // 标题 # ~ ######
          var h = line.match(/^(#{1,6})\s+(.*)$/);
          if (h) {
            closeLists();
            out.push('<h' + h[1].length + '>' + fmtInline(h[2]) + '</h' + h[1].length + '>');
            i++; continue;
          }
          // 无序列表 - 或 *
          var ul = line.match(/^([-*])\s+(.*)$/);
          if (ul) {
            if (inOl) { out.push('</ol>'); inOl = false; }
            if (!inUl) { out.push('<ul>'); inUl = true; }
            out.push('<li>' + fmtInline(ul[2]) + '</li>');
            i++; continue;
          }
          // 有序列表 1.
          var ol = line.match(/^\d+\.\s+(.*)$/);
          if (ol) {
            if (inUl) { out.push('</ul>'); inUl = false; }
            if (!inOl) { out.push('<ol>'); inOl = true; }
            out.push('<li>' + fmtInline(ol[1]) + '</li>');
            i++; continue;
          }
          // 段落（缩进 4 空格或 \t 的代码块简化处理：这里不做完整代码块）
          closeLists();
          out.push('<p>' + fmtInline(line) + '</p>');
          i++;
        }
        closeLists();
        return out.join('\n');
      }

      function renderContent(raw) {
        if (!raw) return '<p style="color:#6b7587;">（文档内容为空）</p>';
        if (looksLikeHtml(raw)) return raw; // 管理员录入的 HTML，直接信任
        return renderMarkdown(raw);
      }

      var stateEl = document.getElementById('state');
      var titleEl = document.getElementById('doc-title');
      var metaEl = document.getElementById('doc-meta');
      var contentEl = document.getElementById('doc-content');

      function syncSeg() {
        document.querySelectorAll('#type-seg button').forEach(function (b) {
          b.className = (b.getAttribute('data-type') === type) ? 'active' : '';
        });
        document.querySelectorAll('#lang-seg button').forEach(function (b) {
          b.className = (b.getAttribute('data-lang') === lang) ? 'active' : '';
        });
      }

      function showState(msg, isError) {
        stateEl.textContent = msg;
        stateEl.className = 'legal-state' + (isError ? ' error' : '');
        stateEl.style.display = 'block';
        titleEl.style.display = 'none';
        metaEl.style.display = 'none';
        contentEl.innerHTML = '';
      }

      function render(data) {
        stateEl.style.display = 'none';
        titleEl.style.display = 'block';
        metaEl.style.display = 'block';
        titleEl.textContent = data.title || (TYPES[type] || '文档');
        document.getElementById('page-title').textContent = (TYPES[type] || '协议与政策') + ' · ' + (LANGS[lang] || lang);
        var isTemplate = /_template$/.test(type);
        if (isTemplate) {
          document.getElementById('brand').textContent = '平台参考模板';
        } else {
          document.getElementById('brand').textContent = (tenant ? '机构' : '平台') + '协议与政策';
        }
        var scope = (data.scopeTenantId === 0 || data.scopeTenantId == null)
          ? '平台统一版本' : '本机构定制版本';
        metaEl.textContent = '版本 v' + (data.version || 1) + ' · ' + (LANGS[data.language] || data.language || '中文') + ' · ' + scope;
        // 自动检测 content 格式（HTML / Markdown）并正确渲染
        contentEl.innerHTML = renderContent(data.content);
      }

      function load() {
        syncSeg();
        showState('加载中…', false);
        var qs = new URLSearchParams({ type: type, lang: lang });
        if (tenant) qs.set('tenant', tenant);
        fetch(API_BASE + '/legal/doc?' + qs.toString(), { headers: { 'Accept': 'application/json' } })
          .then(function (r) { return r.json(); })
          .then(function (json) {
            if (json && json.code === 200 && json.data) {
              render(json.data);
            } else if (json && json.code === 404) {
              showState('《' + (TYPES[type] || '文档') + '》尚未配置，暂无法阅读。', false);
            } else {
              showState((json && json.message) || '加载失败，请稍后重试。', true);
            }
          })
          .catch(function () {
            showState('网络异常，请检查网络连接后重试。', true);
          });
      }

      function changeParam(key, value) {
        var p = new URLSearchParams(location.search);
        p.set(key, value);
        history.replaceState(null, '', location.pathname + '?' + p.toString());
        if (key === 'type') type = value;
        if (key === 'lang') lang = value;
        load();
      }

      document.getElementById('type-seg').addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        changeParam('type', b.getAttribute('data-type'));
      });

      // 关闭/返回：优先尝试关闭窗口（target=_blank 打开的新窗口），否则 history.back
      document.getElementById('close-btn').addEventListener('click', function () {
        if (window.opener) {
          window.close();
        } else if (history.length > 1) {
          history.back();
        } else {
          location.href = 'login.html';
        }
      });

      load();
    })();
  </script>
</body>
</html>

  <script>
    // 租户码统一清洗：去除嵌套（如 URL 被拼成 ?tCode=tCode=TENANT_A）、首尾空格、
    // 以及可能残留的 ? & 字符，避免 index↔landing 重定向死循环与接口查空。挂到 window 供本页复用。
    window.sanitizeTenantCode = function (raw) {
      if (!raw) return '';
      raw = String(raw).trim();
      if (raw.indexOf('=') >= 0) raw = raw.substring(raw.lastIndexOf('=') + 1);
      raw = raw.replace(/[?&]/g, '').trim();
      return raw;
    };
    // 租户专属链接（?tCode=xxx）且未登录：直接落到师资展示页（自带「登录/注册」入口），
    // 跳过登录墙，体验更友好。用 location.replace 把 index 从历史栈移除，让地址栏直接变为
    // student-landing.html，避免落地页「关闭」→ history.back() → index → 再重定向形成的死循环。
    // 落地页「登录/注册」按钮指向独立的 login.html 并带 noredirect=1，不再回 index。
    (function () {
      try {
        var sp = new URLSearchParams(window.location.search);
        // 兼容「?tCode =tenant_A」（参数名带空格）：原生 get 对空格键名返回 null，故手动按 '&' 解析
        var tCode = (function () {
          var pairs = (window.location.search || '').replace(/^\?/, '').split('&');
          for (var i = 0; i < pairs.length; i++) {
            if (!pairs[i]) continue;
            var eq = pairs[i].indexOf('=');
            var k = eq === -1 ? pairs[i] : pairs[i].slice(0, eq);
            var v = eq === -1 ? '' : pairs[i].slice(eq + 1);
            if (decodeURIComponent(k).trim().toLowerCase() === 'tcode') return decodeURIComponent(v);
          }
          return '';
        })();
        if (!tCode) tCode = sp.get('tcode') || '';
        if (!tCode) {
          // 如果没有 tCode 参数，尝试从 localStorage 读取上次注册/登录的租户编码
          tCode = localStorage.getItem('lastRegisterTenantCode') || localStorage.getItem('lastLoginTenantCode') || '';
        }
        tCode = window.sanitizeTenantCode(tCode);
        var noRedirect = sp.get('noredirect');
        var hasToken = !!localStorage.getItem('token');
        // index 现在只做深链/参数路由（登录/注册已拆分至 login.html）：
        // 未登录 + 有 tCode → 展示页(带登录入口)；未登录 + 无 tCode → 登录页；已登录 → 交由底部脚本进角色工作台
        if (!hasToken) {
          if (tCode && noRedirect !== '1') {
            window.location.replace('student-landing.html?tCode=' + encodeURIComponent(tCode));
          } else if (noRedirect !== '1') {
            window.location.replace('login.html');
          }
        }
      } catch (e) {}
    })();
  </script>

<!-- 
在使用 fetch 进行自动登录（如刷新页面后检查 localStorage/cookie 自动登录）时出现 403 错误，原因可能有：

1. **会话凭证丢失**：后端通常通过 Cookie（如 JSESSIONID、token 等）验证登录态。刷新页面时，如果前端未携带或丢失这些凭证（如本地未种 cookie，或 fetch 没加 credentials 配置），后端会拒绝请求返回 403。

2. **跨域未携带认证信息**：fetch 请求如果未设置 `credentials: 'include'`，跨域情况下不会自动携带 cookie，导致登录态失效。

3. **token 已过期或状态与后端不一致**：localStorage 的用户信息只是前端存储，若 session 已失效、token 过期、cookie 被手动清理，前端以为有“已登录”信息但后端拒绝认证，请求接口就会 403。

4. **CSRF 校验失败**：有些后端对 POST/登录敏感接口做了 CSRF 校验，header/token 不对时也会 403。

**排查与修复建议：**
- 检查 fetch 是否正确带上了 Cookie（如需要跨域，必须加 `credentials: 'include'`）。
- 检查 localStorage 或 cookie 的登录态是否和服务端保持一致。
- 手动清除 localStorage 及 cookie，重新登录一次，观察是否能恢复正常。
- 检查后端日志确认 403 详细原因。

1. 在自动登录的 fetch 请求之后，判断 response.status 是否为 403。
2. 如果遇到 403，前端需要清理本地的登录信息（localStorage.removeItem('currentUser')，或清除 cookie），然后跳转回登录页。
3. 示例如下：

fetch('/api/v1/user/info', {
  method: 'GET',
  credentials: 'include'
})
  .then(response => {
    if (response.status === 403) {
      // 清除前端登录存储信息
      localStorage.removeItem('currentUser');
      document.cookie = 'currentUser=;expires=Thu, 01 Jan 1970 00:00:01 GMT;path=/';
      // 可根据需要加提示
      alert('登录状态已过期，请重新登录');
      // 跳回登录页
      window.location.href = ((typeof window.pageUrl === 'function') ? window.pageUrl('index.html') : './index.html');
      throw new Error('未登录或登录已失效');
    }
    return response.json();
  })
  .then(data => {
    // 根据 data 继续后续逻辑
  })
  .catch(err => {
    // 这里可根据需要处理其它异常
    console.error('自动登录失败:', err);
  });

4. 自动登录相关位置总结（例如页面 onload 或初始化检测登录态时）都应加上述 403 处理分支。
 

**fetch 用法举例（含携带 cookie）**：
fetch('/api/v1/user/info', {
  method: 'GET',
  credentials: 'include', // 重要！带上 cookie
})
  .then(resp => resp.json())
  .then(data => {
    // 判定登录态
  });

<!-- 
【fetch 的使用方法说明】

1. fetch 是原生 JavaScript 用于发起 HTTP 请求获取数据的函数。其基本用法如下：

fetch(请求地址, 配置项)
  .then(response => response.json()) // 解析响应体为 JSON
  .then(data => {
    // 对 data 进行处理（data 是 JSON 解析出来的 JS 对象）
  })
  .catch(error => {
    // 处理网络异常等错误
  });

2. 参数和链式调用说明：
- 第一个参数：字符串类型，接口地址（如 '/api/v1/user/login'）。
- 配置项通常为对象，定义 method、headers、body 等（如 POST 请求时要加上 body 和 Content-Type）。

示例（以 POST 登录为例）：
fetch('/api/v1/user/login', {
  method: 'POST',
  headers: {'Content-Type': 'application/json'},
  body: JSON.stringify({account: 'abc', password: '123456'})
})
  .then(response => response.json()) // 将 Response 对象解析为 JS 对象
  .then(data => {
    // data 是后端返回的JSON对象，比如: {code: 0, msg: "成功", data: {...}}
    if (data.code === 0) {
      // 登录成功处理
    } else {
      // 登录失败逻辑
    }
  })
  .catch(err => {
    // 网络或接口异常处理
    alert('请求失败: ' + err);
  });

3. 链式 then 的顺序：
- 第一个 then 得到 Response 对象，用 response.json() 转成 JS 对象，返回 Promise。
- 第二个 then 的 data 参数就是已经解析好的 JS 数据对象。
- catch 用于捕获整个 Promise 链中的异常。

【注意点】
- fetch 只会 reject 网络级错误，对于 HTTP 状态码错误（比如 400、500 等）不会自动抛异常，需要在 then(response => ...) 里判断 response.ok 决定是否解析 response.json()。

<!-- 
fetch 的 then 用法以及两个 then 的先后关系说明：

1. then 的链式调用解析

fetch("接口地址")
  .then(response => response.json())
  .then(data => {
    // 这里处理 JSON 数据
  });

- 第一个 then（response => response.json()）的作用是将 fetch 返回的 Response 对象解析为 JSON 数据。即第一个 then 的返回值是一个 Promise，表示解析 JSON 的过程。
- 第二个 then（data => ...）是在第一个 then 完成并把 JSON 数据返回后接着执行的。此时 data 参数就是解析出来的 JS 对象。

2. 两个 then 的先后关系

- 它们是**顺序执行**的：第二个 then 必须等第一个 then 完成（即 response.json() 解析成功，并且返回了解析后的数据）之后，才会执行。
- 换句话说，第一个 then 的返回值会作为第二个 then 的输入参数。

3. 举例说明
fetch('/api/v1/user/login', {...})
  .then(response => response.json()) // 这一步把 Response 变成 JS 对象
  .then(data => {                   // data 是解析出来的内容
    // 只有等上一步成功解析了 JSON，这步才会运行
    if (data.code === 0) {
      // 成功逻辑
    } else {
      // 失败逻辑
    }
  });

因此：**then 是链式、顺序执行的，后一个 then 只有在前一个 then 成功完成后才会执行。**

<!-- 
setTimeout 用于设置一个延时任务，即让某一段代码在指定的等待时间（毫秒）之后再执行一次。

**用法示例：**
setTimeout(function() {
  // 这里写要延迟执行的代码
}, 2000); // 2000毫秒后执行（也就是2秒）

**参数说明：**
- 第一个参数：函数或字符串（推荐函数），代表到时要执行的代码。
- 第二个参数：延时的毫秒数（1秒=1000毫秒）。

**常见用途：**
- 页面动画的延后展示、弹窗的自动关闭，如：
  setTimeout(() => {
    modal.style.display = 'none';
  }, 1500);

- 表单提交成功后，延迟2秒跳转到首页
  setTimeout(() => {
    window.location.href = '/';
  }, 2000);

**注意点：**
- setTimeout 只会执行一次。如果想多次定时，请用 setInterval。
- 可以用 clearTimeout(timerId) 取消还未到时的定时任务。

**实际案例：**
展示“注册成功”2秒再关闭弹窗：
registerSuccess.style.display = 'block';
setTimeout(() => {
  registerModal.style.display = 'none';
}, 2000);

优化后的后端数据请求失败响应提示函数，可全局复用。调用 showApiError(msg) 显示错误提示。
示例：fetch(...).catch(err => showApiError("网络连接失败，请稍后再试"));

使用一个弹窗覆盖层/提示条（也可直接 alert 作为简化）。

示例弹窗实现如下。需在HTML头部<body>中加上id="api-error-tip"的提示条DOM（若本页面已有类似元素可复用）。



<style>
  #api-error-tip {
    display: none;
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translate(-50%, 0);
    background: #ff5555;
    color: white;
    padding: 12px 30px;
    font-size: 16px;
    border-radius: 8px;
    z-index: 99999;
    box-shadow: 0 2px 16px rgba(0,0,0,0.15);
    min-width: 220px;
    text-align: center;
  }
</style>
<div id="api-error-tip"></div>
<script>
  /**
   * 优化的全局API错误提示
   * @param {string} msg 要提示的内容
   */
  function showApiError(msg) {
    const tip = document.getElementById('api-error-tip');
    if (!tip) return alert(msg);
    tip.textContent = msg || '服务异常，请稍后再试';
    tip.style.display = 'block';
    clearTimeout(window.__apiErrorTimer);
    window.__apiErrorTimer = setTimeout(() => {
      tip.style.display = 'none';
    }, 2500);
  }
</script>

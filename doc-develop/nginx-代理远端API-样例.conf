# ==============================================================================
# 上线自检（三条，缺一条就可能"能打开页面但登录不了"）
# ==============================================================================
#
# 1) 上游是否可达、证书是否匹配：
#      curl -sS -o /dev/null -w '%{http_code} %{ssl_verify_result}\n' \
#        https://api-329614-8-1475810246.sh.run.tcloudbase.com/system/info
#
# 2) 经 Nginx 是否等价（应与上一条同码，且 body 有 appName/version/buildTime）：
#      curl -s http://127.0.0.1/api/v1/system/info
#    ⚠ 路径是 /api/v1/system/info —— 前端裸路径 /system/info 会被 normalizeUrl 补成 /api/v1/system/info
#
# 3) SSE 是否真的没被缓冲（应立刻看到一条 data: 而不是等 30s）：
#      curl -N -H 'Accept: text/event-stream' http://127.0.0.1/api/v1/sse/xxx
#
# ==============================================================================
# 三个必须知道的行为差异（本地 proxy 换成远端后才会暴露）
# ==============================================================================
#
# ① 客户端真实 IP 不会传到后端 —— 这是后端的**有意设计**，不是配置错误。
#    ClientIpResolver 只信任"内网来源"的 X-Forwarded-For：直连一律无视 XFF（首段可被任意伪造）。
#    本机 Nginx 的出网地址是公网 IP，后端看到 remote=该公网 IP（非内网）→ **直接采信 remote，
#    忽略我们传的 XFF**。后果：所有访客在后端眼里是同一个 IP，
#    登录风控的 login.guard.rate.ip.limit（默认 60 次/小时）变成"全站共享 60 次"。
#    三种处理，按需选：
#      a) 把 Nginx 的出口 IP 加进后端可信代理集合（需改 ClientIpResolver.isDefaultTrusted 或加配置项）；
#      b) 若 Nginx 与后端在同一个云内网/VPC，把 Nginx 换成内网地址访问后端，XFF 自然生效；
#      c) 临时把 login.guard.rate.ip.limit 调大（如 600），靠 account 维度（20/小时）兜底。
#
# ② 上传体积受两处限制：这里的 client_max_body_size，以及云托管/网关侧的限制。
#    413 先看这两处，别只盯后端。
#
# ③ 换域名要同时改两处：upstream 里的 server 行 **和** server 块里的 set $api_upstream_host。
#    只改一处会出现"能连上但返回 404"（Host 与 SNI 对不上）。
#
# ④ 云托管域名解析的 IP 可能变化：upstream 里的域名只在 nginx 启动/重载时解析一次。
#    若遇到"昨天好好的今天 502"，先 nginx -s reload，再考虑换成带 resolver 的写法：
#      resolver 223.5.5.5 valid=30s ipv6=off;
#      set $api_host "api-329614-8-1475810246.sh.run.tcloudbase.com";
#      proxy_pass https://$api_host;      # 带变量时 nginx 每次请求按 TTL 重新解析
# ==============================================================================

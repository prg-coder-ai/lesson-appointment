# ==============================================================================
# 预约系统 · 前端静态站 + 远端 API 反向代理（Nginx 样例 · 双服务版）
#
# 场景：前端跑在本地/自有服务器（本文件所在机器），后端是**两个独立的云托管实例**：
#
#   ① booking-api         https://api-329614-8-1475810246.sh.run.tcloudbase.com        (容器端口 8081)
#   ② message-service     https://message-service-329614-8-1475810246.sh.run.tcloudbase.com (容器端口 8090)
#
# 编制：2026-10-24 / 修订：2026-10-25（单 upstream → 双 upstream）
# 参照：doc-develop/dev-proxy.js 的分流规则、cloudBased/web/nginx.conf.template
# ==============================================================================
#
# 【两个容易踩死的坑，先说清楚】
#
# ★ 坑 1：message-329614-... 这个域名**不存在**，别配进去。
#   实测 2026-10-25：
#     GET https://api-329614-8-1475810246.sh.run.tcloudbase.com/api/v1/system/info
#       → 200  {"service":"booking_api","version":"2.2.0"}              ✅
#     GET https://message-service-329614-8-1475810246.sh.run.tcloudbase.com/api/v1/system/info
#       → 200  {"service":"message-service","version":"1.1.0"}          ✅
#     GET https://message-329614-8-1475810246.sh.run.tcloudbase.com/api/v1/system/info
#       → 404  {"code":"INVALID_HOST"}                                  ❌ 域名没建
#   云托管返回 INVALID_HOST = 该环境里没有这个服务绑定的域名，配进 upstream 只会得到
#   「连得上但每个请求都 404」，且 404 是上游返回的，nginx 日志里看不出是域名写错了。
#
# ★ 坑 2：两个上游必须分别设 Host 头。云托管靠 Host/SNI 路由，
#   把 message 的请求发给 api 域名（或反之）→ 同样是 200/404 的诡异组合，而不是连接失败。
#   本文件用「一个变量 $proxy_host_hdr，默认 booking，消息服务的 4 个 location 各自改写」
#   的办法解决，避免把 6 个 proxy_set_header 在每个 location 里抄一遍。
#
# 【为什么用 Nginx 反代，而不是把前端 API 基址改成远端域名】
#   前端每个请求都是「同源相对路径」：utility_request.js 的 normalizeUrl 会自动补 /api/v1，
#   api.js 里 API_BASE_URL 默认空串时浏览器就打到当前站点。
#   若改成 https://api-xxx.tcloudbase.com：
#     ① 变跨域 → 非简单请求全要 CORS 预检；
#     ② **booking 侧 CorsConfig 只放行 localhost / 127.0.0.1 / 152.136.254.127**，
#        换个来源就全红（message-service 侧倒是 allowedOriginPatterns("*") 全放开）；
#     ③ 换环境要改前端并重新构建。
#   同源反代 = 前端一行都不用改，换环境只改这份 conf。
#
# 【分流规则：必须与 dev-proxy.js、cloudBased/web/nginx.conf.template 一致】
#   /api/v1/message*     → 消息服务（messages / message-templates / message-categories，
#                          注意全是**复数**：MessageSendController、MessageTemplateController、
#                          CategoryController 的 @RequestMapping 都以 /api/v1/message 开头）
#   /api/v1/sensitive*   → 消息服务（敏感词 SensitiveWordController）
#   /api/v1/sse*         → 消息服务（SSE 推送，必须关缓冲）
#   /api/v1/users/{id}   → 消息服务（UserInboxController，复数 users）
#   /api/v1/*            → 业务后台（booking）
#   ★ 大坑：业务后台是 /api/v1/user/*（单数，UserController），消息服务是 /api/v1/users/*（复数）。
#     只差一个 s。写错会把业务接口转给消息服务 → 401/404 且查不出原因。
#   ★ 已核对 booking 侧所有 @RequestMapping 前缀，**没有** /api/v1/users/，
#     也没有 /api/v1/message*（只有 /api/v1/msg-ledger，不撞车）。分流是干净的。
#
# 【本文件放在哪】
#   Debian/Ubuntu：/etc/nginx/sites-available/booking  → 软链到 sites-enabled/
#   CentOS/RHEL  ：/etc/nginx/conf.d/booking.conf
#   改完必须：nginx -t && nginx -s reload
# ==============================================================================

# ------------------------------------------------------------------------------
# 上游 ①：业务后台 booking-api
# ------------------------------------------------------------------------------
upstream api_remote {
    server api-329614-8-1475810246.sh.run.tcloudbase.com:443;

    # 与上游保持长连接：SSE 与高频接口都受益，能明显减少 TLS 握手
    keepalive 32;
    keepalive_requests 1000;
}

# ------------------------------------------------------------------------------
# 上游 ②：消息服务 message-service
#   ⚠ 是 message-**service**-329614-...，不是 message-329614-...（后者 INVALID_HOST）
# ------------------------------------------------------------------------------
upstream msg_remote {
    server message-service-329614-8-1475810246.sh.run.tcloudbase.com:443;

    keepalive 32;
    keepalive_requests 1000;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;                       # 局域网 IP / localhost / 任意域名都能访问

    # ── 上游 Host / SNI：默认发往 booking ─────────────────────────────────────
    # 消息服务的 4 个 location 会在自己作用域里再 set 一次覆盖它。
    # nginx 的执行顺序：server 级 rewrite（本行）→ 选 location → location 级 rewrite，
    # 所以 location 里的 set 一定生效；proxy_set_header 的值在 content 阶段才求值，
    # 拿到的是最终值。（这就是不用在 6 个 location 里重复 6 个 header 的原因。）
    #
    # 不写 $host：那是前端自己的域名（localhost / 内网 IP），发给云托管必然不匹配。
    set $proxy_host_hdr "api-329614-8-1475810246.sh.run.tcloudbase.com";

    # ── 静态站点根目录 ─────────────────────────────────────────────────────────
    # ★ 改成你自己的实际路径。指向构建产物（frontend/build.js 的输出）最好，
    #   源码直出也能跑，但 dist 才是压缩过的（体积差 3~5 倍）。
    root  /var/www/booking/frontend/dist;
    index login.html;                     # 本项目入口是 login.html，不是 index.html

    charset utf-8;
    client_max_body_size 20m;             # 头像/资料图上传；超出会 413
    server_tokens off;

    access_log /var/log/nginx/booking.access.log;
    error_log  /var/log/nginx/booking.error.log warn;

    # ── 通用代理头（所有 upstream 共用）───────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host              $proxy_host_hdr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # 上游是 HTTPS：SNI 必须显式打开（云托管靠 SNI 选证书，关掉就握手失败）
    proxy_ssl_server_name on;
    proxy_ssl_name        $proxy_host_hdr;
    proxy_ssl_protocols   TLSv1.2 TLSv1.3;
    # 校验上游证书（推荐生产开启）。Debian/Ubuntu 的 CA 包路径如下；
    # CentOS 用 /etc/pki/tls/certs/ca-bundle.crt
    proxy_ssl_verify       on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # ══════════════════════════════════════════════════════════════════════════
    # 一、走 message-service 的 4 条（顺序无关，nginx 取最长前缀匹配）
    #     每条都要两件事：① set 成消息服务域名 ② proxy_pass 指向 msg_remote
    # ══════════════════════════════════════════════════════════════════════════

    # ── 1. SSE 推送（消息中心实时到账）────────────────────────────────────────
    # 三条必配：buffer off / cache off / 长超时。少一条就会「连接建立但收不到消息」，
    # 表现为前端静默断连、EventSource 反复重连（浏览器控制台每秒一条 sse 请求）。
    location /api/v1/sse {
        set $proxy_host_hdr "message-service-329614-8-1475810246.sh.run.tcloudbase.com";
        proxy_pass https://msg_remote;

        proxy_buffering off;              # ★ 不缓冲，否则消息攒满 buffer 才下发
        proxy_cache off;
        proxy_read_timeout 3600s;         # SSE 是长连接，别用默认 60s 掐断
        proxy_send_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';   # ★ 不发送 Connection: close，否则长连接被断
        chunked_transfer_encoding on;
        # 说明：真正禁止缓冲的是这里的 proxy_buffering off。
        # （X-Accel-Buffering 是"后端→nginx"的响应头，由后端自己返回；在 nginx 侧 add_header
        #  只是发给浏览器，对缓冲毫无作用，别被网上抄来的写法误导。）
    }

    # ── 2. 消息 / 模板 / 分类（/api/v1/messages、/api/v1/message-templates …）──
    location /api/v1/message {
        set $proxy_host_hdr "message-service-329614-8-1475810246.sh.run.tcloudbase.com";
        proxy_pass https://msg_remote;
        proxy_set_header Connection '';
    }

    # ── 3. 敏感词 ────────────────────────────────────────────────────────────
    location /api/v1/sensitive {
        set $proxy_host_hdr "message-service-329614-8-1475810246.sh.run.tcloudbase.com";
        proxy_pass https://msg_remote;
        proxy_set_header Connection '';
    }

    # ── 4. ★ 复数 users（消息服务的收件箱台账），与业务后台的单数 user 严格区分 ──
    location /api/v1/users/ {
        set $proxy_host_hdr "message-service-329614-8-1475810246.sh.run.tcloudbase.com";
        proxy_pass https://msg_remote;
        proxy_set_header Connection '';
    }

    # ══════════════════════════════════════════════════════════════════════════
    # 二、走 booking 的其余 /api/v1/*
    # ══════════════════════════════════════════════════════════════════════════
    # 注意 proxy_pass 后面不能带 URI（不能写成 https://api_remote/），
    # 否则 nginx 会把 /api/v1/ 前缀替换掉，后端全部 404。
    # 这里不需要再 set：server 级的 $proxy_host_hdr 已经是 booking 域名。
    location /api/v1/ {
        proxy_pass https://api_remote;
        proxy_read_timeout 120s;
        proxy_set_header Connection '';

        # 登录/注册这类免登录端点也有频率闸，任何响应都不许缓存
        proxy_cache off;
    }

    # 健康探针（booking 的 actuator/health，运维排查用）
    location = /actuator/health {
        proxy_pass https://api_remote;
        access_log off;
    }

    # 消息服务的健康探针：另起一个路径，别和上面抢。
    # 对应 message-service 的 WebMvcConfig 白名单 /api/v1/message/system/info（匿名可访问）
    location = /msg-health {
        set $proxy_host_hdr "message-service-329614-8-1475810246.sh.run.tcloudbase.com";
        proxy_pass https://msg_remote/api/v1/system/info;
        access_log off;
    }

    # ══════════════════════════════════════════════════════════════════════════
    # 三、静态资源
    # ══════════════════════════════════════════════════════════════════════════

    # 这是多页应用（login/admin/teacher/student/platform_admin…），
    # 不做 SPA 的 index.html 回退：路径不对就该 404，否则错链会被"静默"成首页，
    # 排查时极难发现。
    location / {
        try_files $uri $uri/ =404;
    }

    # HTML 与构建信息必须每次回源校验：新版本上线后浏览器还拿旧页面是最常见的"改了没生效"
    #
    # ⚠ nginx 的 add_header 是"覆盖式继承"：本 location 一旦自己写了 add_header，
    #   就**不再继承** server 级的那三条安全头。所以这里必须重复一遍。
    #   静态资源那个 location 没写 add_header，故自动继承，不用重复。
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /build-info.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # js/css/图片/字体带指纹或很少变：长缓存。注意 dist 里的文件名不带 hash，
    # 所以这里给 7 天而不是 1 年；上线后如遇缓存问题，让用户 Ctrl+F5，
    # 或把下面改成 1h 以更保守。
    # （不要在这里再写 add_header Cache-Control：expires 已经会产出它，两条会重复下发）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
    }

    # ── 压缩 ─────────────────────────────────────────────────────────────────
    # 不要压缩 text/event-stream（会引入缓冲，SSE 立刻变"卡"）
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript application/json
                      application/xml image/svg+xml;

    # ── 基础安全头（可按需保留）─────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# ==============================================================================
# 可选：对外用 HTTPS（本地只做内网访问时可整块删掉）
#   certbot --nginx -d booking.example.com 会自动往下面的 server 块里插证书路径
# ==============================================================================
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;                            # nginx ≥ 1.25.1 写法；更老的版本删掉这行，
#                                          # 改成 listen 443 ssl http2;
#     server_name booking.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/booking.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/booking.example.com/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 1d;
#
#     # 把上面 80 端口 server 里的 root / location / proxy 设置整段复制过来
#     include /etc/nginx/snippets/booking-locations.conf;
# }

# ==============================================================================
# 如果你的前端也跑在微信云托管的 web 容器里（cloudBased/web）
# ==============================================================================
# 那就**不要**用本文件，用 cloudBased/web/nginx.conf.template（已同步改为双 upstream），
# 并在控制台/构建脚本里给两个构建参数：
#     API_UPSTREAM=http://api.<envid>.svc.cluster.local:8081
#     MSG_UPSTREAM=http://message-service.<envid>.svc.cluster.local:8090
# 内网地址比公网域名好三点：免公网流量、延迟低、且**走内网时 XFF 会被后端采信**（见下面 ①）。
#
# 已有部署若在用 deploy/nginx/booking-ip.conf 或 deploy/nginx/booking.conf
# （那两份是「后端在本机 8081/8090」的老拓扑），切到云托管只需换两处：
#   ① 顶部加本文件的两个 upstream 块；
#   ② 把 4 个 `proxy_pass http://127.0.0.1:8090;` 改成 `https://msg_remote`（并各自 set 域名），
#      把 `proxy_pass http://127.0.0.1:8081;` 改成 `https://api_remote`。
# ==============================================================================

# ==============================================================================
# 上线自检（四条，缺一条就可能"能打开页面但登录不了"或"消息不刷新"）
# ==============================================================================
#
# 1) 两个上游各自可达、证书匹配：
#      curl -sS -o /dev/null -w 'api  %{http_code} ssl=%{ssl_verify_result}\n' \
#        https://api-329614-8-1475810246.sh.run.tcloudbase.com/api/v1/system/info
#      curl -sS -o /dev/null -w 'msg  %{http_code} ssl=%{ssl_verify_result}\n' \
#        https://message-service-329614-8-1475810246.sh.run.tcloudbase.com/api/v1/system/info
#
# 2) 经 Nginx 分流是否打到正确的服务（★ 最关键的一条，两条都要跑）：
#      curl -s http://127.0.0.1/api/v1/system/info | grep -o '"service":"[^"]*"'   # → booking_api
#      curl -s http://127.0.0.1/msg-health        | grep -o '"service":"[^"]*"'   # → message-service
#    若两条都返回 booking_api → 消息的 location 没生效（前缀写错/顺序被 /api/v1/ 吃掉）；
#    若某条返回 INVALID_HOST 的 404 → 域名写错（十有八九写成了 message-329614-...）。
#
# 3) 消息接口是否真的走 8090（拿真实路径试，不是 system/info）：
#      curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1/api/v1/messages/x
#    401 是**正确**的（没带 token），404/405 才是分流错了。
#
# 4) SSE 是否真的没被缓冲（应立刻看到一条 data: 而不是等 30s）：
#      curl -N -H 'Accept: text/event-stream' http://127.0.0.1/api/v1/sse/xxx
#
# ==============================================================================
# 四个必须知道的行为差异（前端从"跟着后端跑"换成"反代远端"后才会暴露）
# ==============================================================================
#
# ① 客户端真实 IP 不会传到后端 —— 这是后端的**有意设计**，不是配置错误。
#    ClientIpResolver 只信任"内网来源"的 X-Forwarded-For：直连一律无视 XFF（首段可被任意伪造）。
#    本机 Nginx 的出网地址是公网 IP，后端看到 remote=该公网 IP（非内网）→ **直接采信 remote，
#    忽略我们传的 XFF**。后果：所有访客在后端眼里是同一个 IP，
#    登录风控的 login.guard.rate.ip.limit（默认 60 次/小时）变成"全站共享 60 次"。
#    三种处理，按需选：
#      a) 把 Nginx 的出口 IP 加进后端可信代理集合（需改 ClientIpResolver.isDefaultTrusted 或加配置项）；
#      b) ★ 若 Nginx 与后端在同一个云内网/VPC（含云托管 web 容器走 svc.cluster.local），
#         XFF 自然生效 —— 这是最优解，也是 cloudBased/web 推荐内网地址的原因；
#      c) 临时把 login.guard.rate.ip.limit 调大（如 600），靠 account 维度（20/小时）兜底。
#
# ② 上传体积受两处限制：这里的 client_max_body_size，以及云托管/网关侧的限制。
#    413 先看这两处，别只盯后端。
#
# ③ 换域名要同时改**三处**：upstream 的 server 行、server 级的 set $proxy_host_hdr、
#    以及 4 个消息 location 里的 set。只改一处 = "能连上但 404"（Host 与 SNI 对不上）。
#    想少踩这坑：把三个域名提到文件顶部的 map 里集中管理（见下）。
#
# ④ 云托管域名解析的 IP 可能变化：upstream 里的域名只在 nginx 启动/重载时解析一次。
#    若遇到"昨天好好的今天 502"，先 nginx -s reload，再考虑换成带 resolver 的写法：
#      resolver 223.5.5.5 valid=30s ipv6=off;
#      set $api_host "api-329614-8-1475810246.sh.run.tcloudbase.com";
#      proxy_pass https://$api_host;      # 带变量时 nginx 每次请求按 TTL 重新解析
#    ⚠ 带变量时 nginx **不做**默认 Host 推导，必须自己 proxy_set_header Host $api_host。
# ==============================================================================

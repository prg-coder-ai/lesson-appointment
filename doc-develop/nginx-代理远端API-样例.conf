# ==============================================================================
# 预约系统 · 前端静态站 + 远端 API 反向代理（Nginx 样例）
#
# 场景：前端跑在本地/自有服务器（本文件所在机器），后端 API 在腾讯云托管远端：
#       https://api-329614-8-1475810246.sh.run.tcloudbase.com/
#       该地址的 /system/info 已可正常返回，说明「域名 → 应用 → 数据库」整链是通的。
#
# 编制：2026-10-24
# 参照：doc-develop/dev-proxy.js 的分流规则、doc-develop/000 腾讯云部署与维护手册
# ==============================================================================
#
# 【为什么用 Nginx 反代，而不是把 API 改到远端域名】
#   前端的每个请求都是「同源相对路径」：utility_request.js 的 normalizeUrl 会自动补
#   /api/v1 前缀，API_BASE_URL 为空串时浏览器就打到当前站点。
#   若把 window.API_BASE_URL 改成 https://api-xxx.tcloudbase.com：
#     ① 变成跨域请求 → 每个非简单请求都要 CORS 预检，云端没开就全红；
#     ② 后端若没配 Access-Control-Allow-Origin，连登录都过不去；
#     ③ 一旦要换环境（本地/测试/生产）就得改前端并重新构建。
#   用 Nginx 同源反代 = 前端一行都不用改，换环境只改这份 conf。
#
# 【分流规则：必须与 dev-proxy.js 一模一样】
#   /api/v1/message*     → 消息服务（发送/收件箱/模板…）
#   /api/v1/sensitive*   → 消息服务（敏感词）
#   /api/v1/sse*         → 消息服务（SSE 推送，必须关缓冲）
#   /api/v1/users/*      → 消息服务（注意是 users，复数）
#   /api/v1/*            → 业务后台（booking）
#   ★ 大坑：业务后台是 /api/v1/user/*（单数，UserController），
#     消息服务是 /api/v1/users/*（复数）。两者只差一个 s，
#     千万不要把 message 的 location 写成 /api/v1/user，否则会把业务接口转发到消息服务。
#
# 【本文件放在哪】
#   Debian/Ubuntu：/etc/nginx/sites-available/booking  → 软链到 sites-enabled/
#   CentOS/RHEL  ：/etc/nginx/conf.d/booking.conf
#   改完必须：nginx -t && nginx -s reload
# ==============================================================================

# ------------------------------------------------------------------------------
# 上游：一个域名同时承载两个服务（云托管同一入口）。
# 如果消息服务是独立域名（如 msg.example.com），把下面 upstrem 复制一份改名，
# 再把 message/sse/sensitive/users 四个 location 的 proxy_pass 指过去即可。
# ------------------------------------------------------------------------------
upstream api_remote {
    server api-329614-8-1475810246.sh.run.tcloudbase.com:443;

    # 与上游保持长连接：SSE 与高频接口都受益，能明显减少 TLS 握手
    keepalive 32;
    keepalive_requests 1000;
}

# 上游 Host / SNI 变量：换域名时改这里 + 上面 upstream 的 server 行，两处都改
# （云托管按 Host/SNI 路由，写错会表现为"能连上但 404 / 证书不匹配"）
# 不用 $host：那是前端自己的域名（localhost / 内网 IP），发给上游必然不匹配
server {
    listen       80;
    listen       [::]:80;
    server_name  _;                       # 局域网 IP / localhost / 任意域名都能访问

    set $api_upstream_host "api-329614-8-1475810246.sh.run.tcloudbase.com";

    # ── 静态站点根目录 ─────────────────────────────────────────────────────────
    # ★ 改成你自己的实际路径。指向构建产物（frontend/build.js 的输出）最好，
    #   源码直出也能跑，但 dist 才是压缩过的（体积差 3~5 倍）。
    root  /var/www/booking/frontend/dist;
    index login.html;

    charset utf-8;
    client_max_body_size 20m;             # 头像/资料图上传；超出会 413
    server_tokens off;

    access_log /var/log/nginx/booking.access.log;
    error_log  /var/log/nginx/booking.error.log warn;

    # ── 通用代理头（所有 upstream 共用）───────────────────────────────────────
    # Host 必须是上游域名（见上面的 set $api_upstream_host），否则云托管可能返回 404 / 证书不匹配
    proxy_http_version 1.1;
    proxy_set_header Host              $api_upstream_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # 上游是 HTTPS：SNI 必须显式打开（云托管靠 SNI 选证书，关掉就握手失败）
    proxy_ssl_server_name on;
    proxy_ssl_name        $api_upstream_host;
    proxy_ssl_protocols   TLSv1.2 TLSv1.3;
    # 校验上游证书（推荐生产开启）。Debian/Ubuntu 的 CA 包路径如下；
    # CentOS 用 /etc/pki/tls/certs/ca-bundle.crt
    proxy_ssl_verify       on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # ══════════════════════════════════════════════════════════════════════════
    # 一、API 分流（顺序无关，nginx 取最长前缀匹配）
    # ══════════════════════════════════════════════════════════════════════════

    # ── 1. SSE 推送（消息中心实时到账）────────────────────────────────────────
    # 三条必配：buffer off / cache off / 长超时。少一条就会「连接建立但收不到消息」，
    # 表现为前端静默断连、EventSource 反复重连（浏览器控制台每秒一条 sse 请求）。
    location /api/v1/sse {
        proxy_pass https://api_remote;

        proxy_buffering off;              # ★ 不缓冲，否则消息攒满 buffer 才下发
        proxy_cache off;
        proxy_read_timeout 3600s;         # SSE 是长连接，别用默认 60s 掐断
        proxy_send_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';   # ★ 不发送 Connection: close，否则长连接被断
        chunked_transfer_encoding on;
        # 说明：真正禁止缓冲的是这里的 proxy_buffering off。
        # （X-Accel-Buffering 是"后端→nginx"的响应头，由后端自己返回；在 nginx 侧 add_header
        #  只是发给浏览器，对缓冲毫无作用，别被网上抄来的写法误导。）
    }

    # ── 2. 消息服务：消息 / 敏感词 / 用户台账 ─────────────────────────────────
    location /api/v1/message {
        proxy_pass https://api_remote;
        proxy_set_header Connection '';
    }

    location /api/v1/sensitive {
        proxy_pass https://api_remote;
        proxy_set_header Connection '';
    }

    # ★ 复数 users（消息服务的接收人台账），与业务后台的单数 user 严格区分
    location /api/v1/users/ {
        proxy_pass https://api_remote;
        proxy_set_header Connection '';
    }

    # ── 3. 业务后台：其余全部 /api/v1/* ──────────────────────────────────────
    # 注意 proxy_pass 后面不能带 URI（不能写成 https://api_remote/），
    # 否则 nginx 会把 /api/v1/ 前缀替换掉，后端全部 404。
    location /api/v1/ {
        proxy_pass https://api_remote;
        proxy_read_timeout 120s;
        proxy_set_header Connection '';

        # 登录/注册这类免登录端点也有频率闸，任何响应都不许缓存
        proxy_cache off;
    }

    # 健康探针（云托管的 actuator/health，运维排查用）
    location = /actuator/health {
        proxy_pass https://api_remote;
        access_log off;
    }

    # ══════════════════════════════════════════════════════════════════════════
    # 二、静态资源
    # ══════════════════════════════════════════════════════════════════════════

    # 这是多页应用（login/admin/teacher/student/platform_admin…），
    # 不做 SPA 的 index.html 回退：路径不对就该 404，否则错链会被"静默"成首页，
    # 排查时极难发现。
    location / {
        try_files $uri $uri/ =404;
    }

    # HTML 与构建信息必须每次回源校验：新版本上线后浏览器还拿旧页面是最常见的"改了没生效"
    #
    # ⚠ nginx 的 add_header 是"覆盖式继承"：本 location 一旦自己写了 add_header，
    #   就**不再继承** server 级的那三条安全头。所以这里必须重复一遍。
    #   静态资源那个 location 没写 add_header，故自动继承，不用重复。
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /build-info.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # js/css/图片/字体带指纹或很少变：长缓存。注意 dist 里的文件名不带 hash，
    # 所以这里给 7 天而不是 1 年；上线后如遇缓存问题，让用户 Ctrl+F5，
    # 或把下面改成 1h 以更保守。
    # （不要在这里再写 add_header Cache-Control：expires 已经会产出它，两条会重复下发）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
    }

    # ── 压缩 ─────────────────────────────────────────────────────────────────
    # 不要压缩 text/event-stream（会引入缓冲，SSE 立刻变"卡"）
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript application/json
                      application/xml image/svg+xml;

    # ── 基础安全头（可按需保留）─────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# ==============================================================================
# 可选：对外用 HTTPS（本地只做内网访问时可整块删掉）
#   certbot --nginx -d booking.example.com 会自动往下面的 server 块里插证书路径
# ==============================================================================
